<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0e0c0a">
  <title>Ranking dos Marocas</title>
  <meta name="description" content="Quem mais foi o culpado e quem mais carregou o grupo, partida a partida.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topo">
    <a class="voltar" href="../" aria-label="Voltar para o painel">← Painel</a>
    <div class="titulo">
      <h1>Ranking dos Marocas</h1>
      <p>Quem mais foi o culpado e quem mais carregou o grupo</p>
    </div>
  </header>

  <main class="pagina">
    <div class="controles">
      <div class="abas" role="tablist" aria-label="Filtro de partidas">
        <button class="aba" role="tab" id="tab-geral" data-aba="geral" aria-selected="true" aria-controls="painel">Geral</button>
        <button class="aba" role="tab" id="tab-stack" data-aba="stack" aria-selected="false" aria-controls="painel">Em grupo</button>
        <button class="aba" role="tab" id="tab-solo" data-aba="solo" aria-selected="false" aria-controls="painel">Solo</button>
      </div>
      <div class="ordem" role="group" aria-label="Ordenar por">
        <span class="ordem-rotulo">Ordenar</span>
        <button class="chip" data-ordem="culpados" aria-pressed="true">Mais culpado</button>
        <button class="chip" data-ordem="craques" aria-pressed="false">Mais craque</button>
        <button class="chip" data-ordem="taxa" aria-pressed="false">% de culpa</button>
      </div>
    </div>

    <p class="dica" id="dica"></p>

    <section id="painel" role="tabpanel" aria-live="polite">
      <p class="estado">Carregando o ranking…</p>
    </section>

    <footer class="rodape">
      <p id="atualizado-em"></p>
      <p>Culpado e craque seguem a mesma conta do painel: o culpado é quem mais pesou na derrota, o craque é quem mais carregou a vitória.</p>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
