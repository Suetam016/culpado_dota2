<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root {
  color-scheme: dark;
  --bg: #0e0c0a; --surface: #1a1612; --surface-2: #221c16; --surface-3: #2b231b; --line: #3a2f24; --line-strong: #5a4732;
  --ink: #efe6d6; --ink-2: #c7b9a3; --muted: #8f8270; --gold: #e8b04a; --gold-2: #f6d27a; --on-gold: #1b1206;
  --gold-wash: rgba(232, 176, 74, 0.10); --good: #3fae4f; --bad: #e5533d; --good-ink: #6fd17c; --bad-ink: #ff8f7a;
  --good-wash: rgba(63, 174, 79, 0.16); --bad-wash: rgba(229, 83, 61, 0.16);
  --azul: #5aa9e6; --vermelho: #e5533d;
  --shadow: inset 0 1px 0 rgba(255, 230, 180, 0.06), 0 18px 40px -14px rgba(0, 0, 0, 0.75);
  --font-body: "Alegreya Sans", system-ui, "Segoe UI", Roboto, sans-serif;
  --font-display: "Cinzel", "Trajan Pro", Georgia, serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --radius: 14px; --radius-sm: 8px;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --bg: #e9dfcb; --surface: #f6efdf; --surface-2: #efe4cc; --surface-3: #e6d8bb; --line: #d3c3a3; --line-strong: #b49b72;
    --ink: #23190f; --ink-2: #4d3d2a; --muted: #6e5d47; --gold: #8a5a00; --gold-2: #a8730f; --on-gold: #fff7e6;
    --gold-wash: rgba(138, 90, 0, 0.08); --good-ink: #1d6b29; --bad-ink: #a3241b;
    --good-wash: rgba(29, 107, 41, 0.12); --bad-wash: rgba(179, 38, 30, 0.12); --azul: #1f6fb0; --vermelho: #b3261e;
    --shadow: inset 0 1px 0 rgba(255, 255, 255, 0.6), 0 10px 26px -14px rgba(60, 40, 15, 0.35);
  }
}
:root[data-theme="dark"] { color-scheme: dark; }
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: radial-gradient(1200px 600px at 50% -200px, rgba(232, 176, 74, 0.08), transparent 70%), var(--bg);
  color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.5; min-height: 100vh;
}
a { color: var(--gold-2); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--gold-2); outline-offset: 2px; border-radius: var(--radius-sm); }
.pagina { max-width: 860px; margin: 0 auto; padding: 20px 16px 64px; }
.topo { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
.marca { font-family: var(--font-display); font-weight: 900; font-size: 1.25rem; letter-spacing: .02em; color: var(--ink); text-decoration: none; }
.marca small { display: block; font-family: var(--font-body); font-weight: 500; font-size: .8rem; color: var(--muted); letter-spacing: 0; }
.selo { font-size: .75rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--on-gold); background: var(--gold); padding: 2px 8px; border-radius: 99px; }
.voltar { color: var(--ink-2); font-size: .9rem; text-decoration: none; }
.voltar:hover { color: var(--gold-2); }
.cartao { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; margin-bottom: 16px; }
h1 { font-family: var(--font-display); font-weight: 900; font-size: clamp(1.5rem, 5vw, 2.1rem); line-height: 1.15; margin-bottom: 6px; }
h2 { font-family: var(--font-display); font-weight: 700; font-size: 1.1rem; margin-bottom: 12px; }
.sub { color: var(--ink-2); }
.aviso { background: var(--gold-wash); border: 1px dashed var(--line-strong); border-radius: var(--radius-sm); padding: 10px 12px; color: var(--ink-2); font-size: .92rem; margin-bottom: 16px; }

/* lista de partidas */
.partidas { display: grid; gap: 10px; }
.partida { display: grid; grid-template-columns: 48px 1fr auto; align-items: center; gap: 12px; padding: 10px 12px; text-decoration: none; color: inherit;
  background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--line-strong); border-radius: var(--radius-sm); }
.partida:hover { border-color: var(--line-strong); }
.partida.v { border-left-color: var(--good); }
.partida.d { border-left-color: var(--bad); }
.partida .nome { font-weight: 700; }
.partida .meta { color: var(--muted); font-size: .85rem; }
.partida .kda { font-family: var(--font-mono); font-size: .95rem; text-align: right; }
.icone { width: 48px; height: 48px; border-radius: 10px; background: var(--surface-3); object-fit: cover; display: block; }
.icone.g { width: 72px; height: 72px; border-radius: 14px; }
.icone.p { width: 32px; height: 32px; border-radius: 8px; }

/* veredito */
.culpado { display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 16px; align-items: center; }
.culpado .rotulo { font-size: .8rem; font-weight: 800; text-transform: uppercase; letter-spacing: .1em; color: var(--bad-ink); }
.culpado .quem { overflow-wrap: anywhere; font-family: var(--font-display); font-weight: 900; font-size: clamp(1.4rem, 5vw, 1.9rem); line-height: 1.1; }
.culpado .quem small { display: block; font-family: var(--font-body); font-weight: 500; font-size: .95rem; color: var(--ink-2); }
.motivos { list-style: none; margin-top: 14px; display: grid; gap: 8px; }
.motivos li { background: var(--surface-2); border-radius: var(--radius-sm); padding: 8px 12px; display: flex; gap: 10px; align-items: baseline; }
.motivos .pts { font-family: var(--font-mono); font-weight: 500; color: var(--bad-ink); min-width: 3.2em; }
.motivos .pts.bom { color: var(--good-ink); }
.ranking { display: grid; gap: 8px; }
.linha { display: grid; grid-template-columns: 32px minmax(0, 1fr) 3.5em; align-items: center; gap: 10px; }
.linha .nm { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.linha .nm small { color: var(--muted); font-weight: 500; }
.barra { height: 8px; background: var(--surface-3); border-radius: 99px; overflow: hidden; margin-top: 3px; }
.barra i { display: block; height: 100%; background: var(--bad); border-radius: 99px; }
.linha .pc { font-family: var(--font-mono); text-align: right; color: var(--ink-2); }
.linha.eu .nm { color: var(--gold-2); }
details.porque { margin-top: 4px; grid-column: 2 / 4; }
details.porque summary { cursor: pointer; color: var(--muted); font-size: .85rem; }
details.porque ul { margin: 6px 0 4px 18px; color: var(--ink-2); font-size: .9rem; }
.grafico svg, .mapa svg { width: 100%; height: auto; display: block; }
.legenda { display: flex; flex-wrap: wrap; gap: 12px; color: var(--muted); font-size: .85rem; margin-top: 8px; }
.legenda span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; background: var(--c); }
.rp-mapa { max-width: 560px; margin: 0 auto; }
.rp-mapa svg { width: 100%; height: auto; display: block; border-radius: 10px; touch-action: manipulation; }
.rp-ctrl { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 10px; align-items: center; max-width: 560px; margin: 12px auto 0; }
.rp-play { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--gold); color: var(--on-gold); font-size: 1.1rem; cursor: pointer; }
.rp-ctrl input[type=range] { width: 100%; accent-color: var(--gold); }
.rp-hora { font-family: var(--font-mono); font-size: .95rem; min-width: 3.2em; text-align: right; }
.rp-linha { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; max-width: 560px; margin: 10px auto 0; font-size: .85rem; color: var(--muted); }
.rp-chip { border: 1px solid var(--line-strong); background: var(--surface-2); border-radius: 99px; padding: 3px 10px; cursor: pointer; font-size: .85rem; }
.rp-chip.on { background: var(--gold); color: var(--on-gold); border-color: var(--gold); }
.rp-chip.morte { border-color: var(--bad); color: var(--bad-ink); }
.rp-feed { list-style: none; max-width: 560px; margin: 10px auto 0; display: grid; gap: 4px; min-height: 6.4em; }
.rp-feed li { display: flex; gap: 8px; align-items: baseline; font-size: .9rem; color: var(--ink-2); }
.rp-feed li b { font-family: var(--font-mono); font-weight: 500; color: var(--muted); min-width: 3em; }
.rp-feed li.mau { color: var(--bad-ink); }
.rp-feed li.bom { color: var(--good-ink); }
.momentos { display: grid; gap: 12px; }
@media (min-width: 640px) { .momentos { grid-template-columns: 1fr 1fr; } }
.momento { border-radius: var(--radius-sm); padding: 14px; border: 1px solid var(--line); background: var(--surface-2); display: grid; gap: 6px; align-content: start; }
.momento.throw { border-color: var(--bad); background: var(--bad-wash); }
.momento.play { border-color: var(--good); background: var(--good-wash); }
.momento .rot { font-family: var(--font-display); font-weight: 900; font-size: 1.05rem; }
.momento.throw .rot { color: var(--bad-ink); }
.momento.play .rot { color: var(--good-ink); }
.momento .quem { display: flex; gap: 10px; align-items: center; font-weight: 700; }
.momento .chance { font-family: var(--font-mono); font-size: .95rem; }
.momento button { justify-self: start; }
.abas { display: flex; gap: 6px; margin-bottom: 10px; }
.habs { display: grid; gap: 14px; }
.habs h3 { font-size: .8rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 800; }
.hab-j { display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 10px; align-items: start; }
.hab-j .nm { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hab-j .nm small { color: var(--muted); font-weight: 500; }
.hab-j.eu .nm { color: var(--gold-2); }
.tiles { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 4px; }
.tile { width: 36px; text-align: center; font-family: var(--font-mono); font-size: .8rem; color: var(--ink-2); }
.tile .ic { width: 30px; height: 30px; margin: 0 auto 2px; border-radius: 6px; background: var(--surface-3); display: grid; place-items: center; font-family: var(--font-body); font-weight: 800; font-size: .8rem; color: var(--muted); overflow: hidden; }
.tile .ic img { width: 100%; height: 100%; display: block; }
.tile.zero { color: var(--bad-ink); }
.tile.zero .ic { outline: 2px solid var(--bad); }
.tile.sep { width: 2px; }
.ordem { font-family: var(--font-mono); font-size: .75rem; color: var(--muted); margin-top: 4px; letter-spacing: .04em; word-break: break-all; }
.recibo { display: grid; gap: 5px; margin-top: 6px; }
.recibo .tot { font-size: .9rem; color: var(--ink-2); }
.recibo .rl { display: grid; grid-template-columns: minmax(0, 1fr) 3.6em; gap: 8px; align-items: center; font-size: .85rem; }
.recibo .rl .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.recibo .rl .nm small { color: var(--muted); }
.recibo .rl .bar { grid-column: 1 / 3; height: 5px; border-radius: 99px; background: var(--surface-3); overflow: hidden; margin-top: -3px; }
.recibo .rl .bar i { display: block; height: 100%; background: var(--bad); }
.recibo .rl .v { font-family: var(--font-mono); text-align: right; }
.rp-recibo { max-width: 560px; margin: 10px auto 0; padding: 10px 12px; border-radius: var(--radius-sm); background: var(--bad-wash); border: 1px solid var(--bad); }
.rp-recibo:empty { display: none; }
.rp-recibo .tt { font-weight: 700; color: var(--bad-ink); }
.lutas { display: grid; gap: 10px; }
.luta { border: 1px solid var(--line); border-left: 4px solid var(--line-strong); border-radius: var(--radius-sm); padding: 10px 12px; background: var(--surface-2); display: grid; gap: 4px; }
.luta.venceu { border-left-color: var(--good); }
.luta.perdeu { border-left-color: var(--bad); }
.luta .cab { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
.luta .cab b { font-family: var(--font-mono); font-weight: 500; }
.luta .placar { font-weight: 800; }
.luta.venceu .placar { color: var(--good-ink); }
.luta.perdeu .placar { color: var(--bad-ink); }
.luta .det { color: var(--ink-2); font-size: .9rem; }
.luta button { justify-self: start; }
.medalhas { display: grid; gap: 12px; }
.med-j { display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 10px; }
.med-j .nm { font-weight: 700; }
.med-j.eu .nm { color: var(--gold-2); }
.med-lista { list-style: none; display: grid; gap: 3px; margin-top: 4px; }
.med-lista li { font-size: .9rem; color: var(--ink-2); }
.med-lista li b { color: var(--good-ink); }
.med-lista li.mau b { color: var(--bad-ink); }
.pings { display: grid; gap: 8px; margin-top: 6px; }
.ping-l { display: grid; grid-template-columns: 32px minmax(0, 1fr) 2.6em; gap: 10px; align-items: center; }
.ping-l .nm { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ping-l .tp { font-size: .8rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ping-l .n { font-family: var(--font-mono); text-align: right; }
.destaque { background: var(--gold-wash); border-radius: var(--radius-sm); padding: 8px 12px; margin-bottom: 10px; color: var(--ink); }
.vazio { color: var(--muted); text-align: center; padding: 24px 8px; }
.rodape { color: var(--muted); font-size: .8rem; margin-top: 28px; text-align: center; }

/* revelação: as 5 cartas girando, como no Dota */
.lrev { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  background: radial-gradient(circle at 50% 45%, #2a1d0f, #060504 70%); color: #f4ead8; animation: lrev-entra .3s ease; --raridade: #e4ae39; }
.lrev.saindo { opacity: 0; transition: opacity .45s; }
@keyframes lrev-entra { from { opacity: 0; } }
.lrev.policia::after, .lrev.nuclear::after { content: ""; position: fixed; inset: 0; pointer-events: none; }
.lrev.policia::after { animation: lrev-giroflex .55s steps(1) infinite; }
.lrev.nuclear::after { animation: lrev-nuclear 4.7s ease-in-out infinite; }
@keyframes lrev-giroflex { 0% { box-shadow: inset 0 0 120px 10px rgba(229, 40, 40, .55); } 50% { box-shadow: inset 0 0 120px 10px rgba(40, 90, 255, .55); } }
@keyframes lrev-nuclear { 0%, 100% { background: rgba(180, 0, 0, .05); } 45%, 65% { background: rgba(200, 10, 0, .32); } }
.lrev-titulo { font-family: var(--font-display); font-weight: 900; font-size: clamp(1.3rem, 5vw, 2rem); letter-spacing: .04em; text-align: center; padding: 0 16px; }
.lrev.revelado .lrev-titulo { color: var(--raridade); }
.lrev-palco { position: relative; width: min(760px, 96vw); height: clamp(170px, 30vw, 230px); display: grid; place-items: center; }
.lrev-fila { position: relative; z-index: 1; display: flex; align-items: center; justify-content: center; gap: clamp(6px, 2vw, 16px); perspective: 900px; }
.lrev-carta { flex: 0 0 auto; width: clamp(54px, 15vw, 118px); transition: width .4s cubic-bezier(.4, 0, .2, 1) .12s, margin .4s .12s, opacity .3s, transform .35s cubic-bezier(.5, -.4, .6, 1); }
.lrev-gira { position: relative; width: 100%; aspect-ratio: 3 / 4; transform-style: preserve-3d; will-change: transform; }
.lrev-face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 10px; overflow: hidden; background: #1b1f27; box-shadow: 0 0 0 2px #3a3f4c, 0 10px 22px rgba(0, 0, 0, .6); }
.lrev-frente .icone { width: 100%; height: 100%; border-radius: 0; object-fit: cover; }
.lrev-verso { transform: rotateY(180deg); display: grid; place-items: center; background: radial-gradient(circle at 50% 40%, #3a2a12, #120d07 75%); color: #e3b448; font-size: clamp(1.6rem, 5vw, 2.6rem);
  box-shadow: 0 0 0 2px #6b5326, inset 0 0 0 4px #1f170c, inset 0 0 0 5px #6b5326; }
.lrev-x { position: absolute; inset: 0; display: grid; place-items: center; font-size: clamp(2.2rem, 6vw, 3.6rem); font-weight: 900; color: #e5533d; text-shadow: 0 2px 8px #000; opacity: 0; }
.lrev-carta.fora { width: 0; margin: 0 calc(-1 * clamp(3px, 1vw, 8px)); opacity: 0; transform: scale(.25) translateY(-30px); }
.lrev-carta.fora .lrev-x { opacity: 1; }
.lrev-carta.vencedor { width: clamp(96px, 24vw, 170px); transition: width .45s cubic-bezier(.2, .9, .3, 1.3); }
.lrev-carta.vencedor .lrev-frente { box-shadow: 0 0 0 4px var(--raridade), 0 0 34px var(--raridade), 0 0 90px color-mix(in srgb, var(--raridade) 55%, transparent); }
.lrev-raios { position: absolute; left: 50%; top: 50%; width: min(560px, 92vw); aspect-ratio: 1; transform: translate(-50%, -50%) scale(.2); border-radius: 50%; opacity: 0; pointer-events: none;
  background: repeating-conic-gradient(from 0deg, color-mix(in srgb, var(--raridade) 70%, transparent) 0 6deg, transparent 6deg 18deg);
  -webkit-mask: radial-gradient(circle, #000 18%, transparent 68%); mask: radial-gradient(circle, #000 18%, transparent 68%); transition: opacity .4s, transform .6s cubic-bezier(.2, .9, .3, 1); }
.lrev.revelado .lrev-raios { opacity: 1; transform: translate(-50%, -50%) scale(1); animation: lrev-gira 6s linear infinite; }
@keyframes lrev-gira { to { transform: translate(-50%, -50%) scale(1) rotate(360deg); } }
.lrev-nome { min-height: 1.5em; text-align: center; padding: 0 16px; font-family: var(--font-display); font-weight: 900; font-size: clamp(1.4rem, 6vw, 2.4rem); overflow-wrap: anywhere; }
.lrev-selo { min-height: 1.4em; font-family: var(--font-display); font-weight: 800; letter-spacing: .12em; text-transform: uppercase; text-align: center; padding: 0 12px;
  color: var(--raridade); text-shadow: 0 0 18px var(--raridade); opacity: 0; transform: translateY(6px); transition: opacity .35s .15s, transform .35s .15s; }
.lrev.revelado .lrev-selo { opacity: 1; transform: none; }
.lrev-pular { position: absolute; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: rgba(255, 255, 255, .08); border: 1px solid rgba(255, 255, 255, .25); color: #f4ead8; padding: 8px 18px; border-radius: 99px; cursor: pointer; }
.lrev-tocar { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 5; font-weight: 700; font-size: 1.1rem; padding: 16px 26px; border-radius: 999px;
  border: 2px solid var(--raridade); background: #120d08ee; color: #fff; cursor: pointer; box-shadow: 0 0 30px var(--raridade); white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { .lrev.revelado .lrev-raios, .lrev.policia::after, .lrev.nuclear::after { animation: none; } .lrev-carta, .lrev-raios { transition: none; } }

/* o documento da culpa: um papel por nível de gravidade. É um objeto físico: mesmas cores no tema claro e no escuro */
.doc { --papel: #efe3c8; --tinta: #2a1d10; --tinta-2: #5b4630; --linha-doc: #b9a17a; --destaque: #8a1c12;
  position: relative; background: var(--papel); color: var(--tinta); border-radius: 6px; padding: 20px 18px 18px; margin: 14px 0 6px;
  box-shadow: 0 1px 0 rgba(255, 255, 255, .4) inset, 0 16px 34px -12px rgba(0, 0, 0, .7); overflow: hidden; }
.doc-cab { text-align: center; border-bottom: 2px solid var(--linha-doc); padding-bottom: 10px; margin-bottom: 14px; }
.doc-cab .org { font-size: .74rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--tinta-2); }
.doc-cab .tit { font-family: var(--font-display); font-weight: 900; font-size: clamp(1.7rem, 8vw, 2.6rem); line-height: 1.05; letter-spacing: .03em; text-transform: uppercase; }
.doc-cab .num { font-family: var(--font-mono); font-size: .8rem; color: var(--tinta-2); }
.doc-cab .faixa { font-family: var(--font-display); font-weight: 700; font-size: .95rem; color: var(--destaque); margin-top: 4px; }
.doc-meio { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 14px; align-items: start; }
.doc-foto { position: relative; }
.doc-foto .icone { width: 96px; height: 120px; border-radius: 4px; border: 3px solid var(--tinta); background: #c9b58e; object-fit: cover; }
.doc-foto small { display: block; text-align: center; font-size: .66rem; color: var(--tinta-2); margin-top: 2px; }
.doc-nome { font-family: var(--font-display); font-weight: 900; font-size: clamp(1.25rem, 5vw, 1.6rem); line-height: 1.1; overflow-wrap: anywhere; }
.doc-vulgo { font-style: italic; color: var(--tinta-2); margin-bottom: 6px; }
.doc-campos { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 4px 12px; font-size: .86rem; }
.doc-campos div { border-bottom: 1px dotted var(--linha-doc); padding-bottom: 2px; min-width: 0; overflow-wrap: anywhere; }
.doc-campos b { display: block; font-size: .64rem; letter-spacing: .1em; text-transform: uppercase; color: var(--tinta-2); font-weight: 800; }
.doc-bloco { margin-top: 14px; }
.doc-rot { font-size: .72rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--destaque); margin-bottom: 6px; }
.doc-crimes { list-style: none; display: grid; gap: 8px; counter-reset: crime; }
.doc-crimes li { counter-increment: crime; padding-left: 28px; position: relative; line-height: 1.3; }
.doc-crimes li::before { content: counter(crime); position: absolute; left: 0; top: 0; width: 20px; height: 20px; border-radius: 50%; background: var(--tinta); color: var(--papel);
  font-size: .75rem; font-weight: 800; display: grid; place-items: center; }
.doc-crimes strong { font-weight: 800; }
.doc-crimes small { display: block; color: var(--tinta-2); font-size: .86rem; margin-top: 1px; }
.doc-texto { color: var(--tinta-2); line-height: 1.4; }
.doc-recompensa { text-align: center; margin-top: 16px; }
.doc-recompensa .valor { font-family: var(--font-display); font-weight: 900; font-size: clamp(1.8rem, 9vw, 2.6rem); line-height: 1; color: var(--destaque); }
.doc-recompensa small { display: block; color: var(--tinta-2); }
.doc-rodape { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; margin-top: 16px; padding-top: 10px; border-top: 1px solid var(--linha-doc); font-size: .82rem; color: var(--tinta-2); }
.doc-carimbo { font-family: var(--font-display); font-weight: 900; text-transform: uppercase; letter-spacing: .08em; color: var(--destaque); border: 3px solid var(--destaque);
  padding: 2px 10px; border-radius: 4px; transform: rotate(-8deg); opacity: .85; }
.doc-alerta { margin-top: 14px; padding: 10px 12px; border-radius: 4px; font-weight: 700; }
/* Procura-se: cartaz do faroeste */
.doc-wanted { --papel: #e8d2a0; background: radial-gradient(circle at 30% 20%, #f1dfb3, #ddc189 70%, #c9a86b); text-align: center; }
.doc-wanted .doc-meio { grid-template-columns: 1fr; justify-items: center; }
.doc-wanted .doc-foto .icone { width: 132px; height: 132px; filter: sepia(.7) contrast(1.05); }
.doc-wanted .doc-campos { display: none; }
.doc-wanted .doc-crimes li { padding-left: 0; } .doc-wanted .doc-crimes li::before { display: none; }
/* Boletim de Ocorrência */
.doc-bo { --papel: #f7f5ef; --tinta: #1b2433; --tinta-2: #4a5568; --linha-doc: #9aa6b8; --destaque: #1d3f78; }
.doc-bo .doc-cab { text-align: left; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: end; border-bottom-color: #1d3f78; }
.doc-bo .doc-cab .tit { font-family: var(--font-body); font-size: 1.25rem; letter-spacing: .02em; color: #1d3f78; }
.doc-bo .doc-carimbo { color: #a3241b; border-color: #a3241b; }
/* Interpol: difusão vermelha */
.doc-interpol { --papel: #10213f; --tinta: #eef2fa; --tinta-2: #aab6cc; --linha-doc: #3a5584; --destaque: #ff6b5b; }
.doc-interpol .doc-cab { background: #b3261e; margin: -20px -18px 14px; padding: 12px 18px; border-bottom: 0; }
.doc-interpol .doc-cab .org, .doc-interpol .doc-cab .num { color: #ffd9d4; }
.doc-interpol .doc-foto .icone { border-color: #eef2fa; }
.doc-interpol .doc-alerta { background: rgba(255, 107, 91, .14); border: 1px solid #ff6b5b; color: #ffd9d4; }
/* Haia: mandado de prisão */
.doc-haia { --papel: #eaf1f8; --tinta: #10263f; --tinta-2: #46607d; --linha-doc: #8aa7c4; --destaque: #1d5fa3; }
.doc-haia .doc-cab { border-bottom: 3px double #1d5fa3; }
.doc-haia .doc-cab .tit { color: #1d5fa3; font-size: clamp(1.4rem, 6vw, 2rem); }
.doc-haia .doc-decisao { margin-top: 14px; font-style: italic; color: var(--tinta-2); border-left: 3px solid #1d5fa3; padding-left: 10px; }
/* Tribunal Penal Internacional: o pior */
.doc-tpi { --papel: #0d0b08; --tinta: #f3e6c4; --tinta-2: #b9a77d; --linha-doc: #6b5326; --destaque: #e8b04a; box-shadow: 0 0 0 2px #6b5326, 0 0 40px -6px rgba(232, 176, 74, .45), 0 16px 34px -12px rgba(0, 0, 0, .8); }
.doc-tpi .doc-cab .tit { color: #e8b04a; }
.doc-tpi .doc-foto .icone { border-color: #e8b04a; }
.doc-tpi .doc-carimbo { color: #ff4b3a; border-color: #ff4b3a; font-size: 1.1rem; }
.doc-tpi .doc-alerta { background: rgba(255, 75, 58, .12); border: 1px solid #ff4b3a; color: #ffd0c8; }
.doc-de-novo { background: none; border: 1px solid var(--line-strong); color: var(--ink-2); border-radius: 99px; padding: 6px 14px; cursor: pointer; font-size: .9rem; margin-top: 8px; }
.doc-de-novo:hover { color: var(--gold-2); border-color: var(--gold); }
@media (max-width: 420px) { .doc-meio { grid-template-columns: 80px minmax(0, 1fr); } .doc-foto .icone { width: 80px; height: 100px; } }
</style>
</head>
<body>
<div class="pagina">
  <header class="topo">
    <a class="marca" href="./">Quem é o culpado <small>League of Legends</small></a>
    <div style="display:flex;gap:12px;align-items:center"><span class="selo">protótipo</span><a class="voltar" href="../">Dota 2 →</a></div>
  </header>
  <main id="app"><p class="vazio">Carregando…</p></main>
  <p class="rodape">Dados da API oficial da Riot Games. O Culpado não é endossado pela Riot Games.</p>
</div>
<script src="julgar.js"></script>
<script src="replay.js"></script>
<script src="resenha.js"></script>
<script src="culpa.js"></script>
<script src="revelar.js"></script>
<script>
(function () {
  'use strict';
  const L = window.CulpadoLoL;
  const app = document.getElementById('app');
  const FILAS = { 400: 'Normal', 420: 'Ranqueada solo', 430: 'Normal às cegas', 440: 'Ranqueada flex', 450: 'ARAM', 480: 'Partida rápida', 490: 'Partida rápida', 700: 'Clash', 1700: 'Arena', 1900: 'URF' };
  const ROTAS = { TOP: 'topo', JUNGLE: 'selva', MIDDLE: 'meio', BOTTOM: 'atirador', UTILITY: 'suporte' };
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  let versaoDD = null;
  const ddVersao = fetch('https://ddragon.leagueoflegends.com/api/versions.json').then((r) => r.json()).then((v) => (versaoDD = v[0])).catch(() => null);
  const ID_CAMPEAO = { FiddleSticks: 'Fiddlesticks' };
  const icone = (campeao, cls) => versaoDD
    ? `<img class="icone ${cls || ''}" alt="" loading="lazy" src="https://ddragon.leagueoflegends.com/cdn/${versaoDD}/img/champion/${esc(ID_CAMPEAO[campeao] || campeao)}.png" onerror="this.style.visibility='hidden'">`
    : `<span class="icone ${cls || ''}"></span>`;
  const nome = (j) => j.riotIdGameName || j.championName;
  const data = (s) => new Date(s * 1000).toLocaleString('pt-BR', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
  const pegar = (u) => fetch(u, { cache: 'no-cache' }).then((r) => (r.ok ? r.json() : null)).catch(() => null);

  async function rota() {
    await ddVersao;
    const h = decodeURIComponent(location.hash.slice(1));
    const [mid, quem] = h.split('@');
    if (mid) return mostrarPartida(mid, quem);
    return mostrarLista();
  }

  async function mostrarLista() {
    const indice = await pegar('indice.json');
    // remake (partida cancelada nos primeiros minutos) não tem culpado
    const partidas = ((indice && indice.partidas) || []).filter((p) => p.duracao >= 300);
    let html = '<section class="cartao"><h1>Quem entregou a partida?</h1><p class="sub">Protótipo com as partidas do grupo puxadas da API da Riot. Escolha uma partida para ver o veredito.</p></section>';
    if (!partidas.length) {
      html += '<p class="aviso">Ainda não tem partida coletada: a coleta roda no GitHub Actions assim que a chave da Riot estiver configurada. Enquanto isso, veja <a href="#EXEMPLO">uma partida de exemplo (fictícia)</a>.</p>';
    } else {
      html += '<div class="partidas">' + partidas.map((p) => {
        const n = p.nossos[0];
        if (!n) return '';
        return `<a class="partida ${n.win ? 'v' : 'd'}" href="#${encodeURIComponent(p.id)}@${encodeURIComponent(n.riotId)}">
          ${icone(n.campeao)}
          <div><div class="nome">${esc(n.riotId.split('#')[0])} · ${esc(n.campeao)}</div>
          <div class="meta">${n.win ? 'Vitória' : 'Derrota'} · ${esc(FILAS[p.fila] || 'Fila ' + p.fila)} · ${Math.round(p.duracao / 60)} min · ${data(p.inicio)}</div></div>
          <div class="kda">${n.k}/${n.d}/${n.a}</div></a>`;
      }).join('') + '</div>';
    }
    app.innerHTML = html;
  }

  async function mostrarPartida(mid, quem) {
    const exemplo = mid === 'EXEMPLO';
    const [partida, indice] = await Promise.all([pegar((exemplo ? 'exemplos/' : 'partidas/') + encodeURIComponent(mid) + '.json'), exemplo ? null : pegar('indice.json')]);
    if (!partida) { app.innerHTML = '<p class="vazio">Partida não encontrada. <a href="./">Voltar</a></p>'; return; }
    if (partida.duracao < 300) { app.innerHTML = '<p class="vazio">Partida cancelada nos primeiros minutos (remake): não tem culpado. <a href="./">Voltar</a></p>'; return; }
    const contas = (indice && indice.jogadores) || {};
    const puuid = exemplo ? 'p-mia' : (contas[quem] || {}).puuid;
    const r = L.julgar(partida, puuid);
    const c = r.culpado;
    const eu = partida.jogadores.find((j) => j.puuid === puuid);
    partidaAtual = partida;
    const cv = L.chanceDeVitoria(partida, r.timeNos);
    const titulo = r.venceu ? 'Ganharam, mas alguém quase entregou' : 'Perderam. A culpa é de…';
    const doc = r.venceu ? null : window.CulpaLoL.documento(c, partida);
    let html = '';
    if (exemplo) html += '<p class="aviso">Partida de exemplo com dados fictícios, só para mostrar como fica. As de verdade aparecem quando a coleta rodar.</p>';
    html += `<p style="margin-bottom:12px"><a class="voltar" href="./">← Partidas</a></p>
      <section class="cartao">
        <p class="sub">${esc(FILAS[partida.fila] || partida.modo)} · ${Math.round(partida.duracao / 60)} min · ${data(partida.inicio)}${rendicao(partida, r)}</p>
        <h1>${titulo}</h1>
        ${r.venceu ? `<div class="culpado" style="margin-top:14px">${icone(c.jogador.championName, 'g')}
          <div><div class="rotulo">Culpado · ${Math.round(c.fatia * 100)}% da culpa</div>
          <div class="quem">${esc(nome(c.jogador))}<small>${esc(c.jogador.championName)} · ${esc(ROTAS[c.jogador.teamPosition] || '')} · ${c.jogador.kills}/${c.jogador.deaths}/${c.jogador.assists}</small></div></div>
        </div>
        <ul class="motivos">${c.pesou.concat(c.atenuantes).map((m) => `<li><span class="pts ${m.pontos < 0 ? 'bom' : ''}">${m.pontos > 0 ? '+' : ''}${m.pontos.toLocaleString('pt-BR')}</span><span>${esc(m.evidencia)}</span></li>`).join('')}</ul>`
        : `${docHtml(c, partida, r, doc)}<button type="button" class="doc-de-novo" id="ver-revelacao">⚖ Ver a revelação de novo</button>`}
      </section>
      ${momentosHtml(cv, r)}
      <section class="cartao" id="cartao-replay"><h2>Replay da partida</h2>${replayHtml(partida, r, c)}</section>
      ${lutasHtml(r)}
      <section class="cartao"><h2>Divisão da culpa no time</h2><div class="ranking">${r.vereditos.map((v) => `
        <div class="linha ${eu && v.jogador.id === eu.id ? 'eu' : ''}">${icone(v.jogador.championName, 'p')}
          <div><div class="nm">${esc(nome(v.jogador))} <small>${esc(v.jogador.championName)}</small></div><div class="barra"><i style="width:${Math.round(v.fatia * 100)}%"></i></div></div>
          <div class="pc">${Math.round(v.fatia * 100)}%</div>
          <details class="porque"><summary>por quê</summary><ul>${v.componentes.map((m) => `<li>${esc(m.label)} (${m.pontos > 0 ? '+' : ''}${m.pontos.toLocaleString('pt-BR')}): ${esc(m.evidencia)}</li>`).join('') || '<li>Nada pesou.</li>'}</ul></details>
        </div>`).join('')}</div>
        <p class="legenda" style="margin-top:12px">Pontos = cada 1.000 de ouro entregue aos inimigos (mortes, objetivos perdidos, rota) menos o que ajudou a ganhar.</p>
      </section>
      <section class="cartao grafico"><h2 id="graf-titulo">Chance de vitória</h2>
        <div class="abas"><button class="rp-chip on" data-graf="chance">Chance de vitória</button><button class="rp-chip" data-graf="ouro">Ouro</button></div>
        <div id="graf-corpo">${graficoChance(cv)}</div></section>
      ${resenhaHtml(partida, r, eu)}
      <section class="cartao"><h2>Uso de habilidades</h2>${habilidadesHtml(partida, r, eu)}</section>`;
    app.innerHTML = html;
    iniciarReplay(partida, r, c);
    document.querySelectorAll('[data-graf]').forEach((b) => b.addEventListener('click', () => {
      document.querySelectorAll('[data-graf]').forEach((x) => x.classList.toggle('on', x === b));
      document.getElementById('graf-corpo').innerHTML = b.dataset.graf === 'ouro' ? graficoOuro(partida, r) : graficoChance(cv);
      document.getElementById('graf-titulo').textContent = b.dataset.graf === 'ouro' ? 'Ouro do time, minuto a minuto' : 'Chance de vitória';
    }));
    document.querySelectorAll('[data-ver]').forEach((b) => b.addEventListener('click', () => {
      document.getElementById('cartao-replay').scrollIntoView({ behavior: 'smooth', block: 'start' });
      if (replay && replay.pular) replay.pular(Math.max(0, +b.dataset.ver - 10));
    }));
    preencherHabilidades(partida);
    window.scrollTo(0, 0);
    if (doc) {
      const abrir = () => window.RevelarLoL({
        jogadores: r.vereditos.map((v) => ({ id: v.jogador.id, rosto: icone(v.jogador.championName), peso: v.fatia })),
        culpado: c.jogador.id, nome: nome(c.jogador), nivel: doc.nivel, cor: doc.cor, crime: doc.crime, som: true,
      });
      document.getElementById('ver-revelacao').addEventListener('click', abrir);
      // a revelação abre sozinha na primeira vez que a partida é aberta neste navegador
      const chave = 'culpado-lol:revelado:' + mid;
      let visto = false;
      try { visto = localStorage.getItem(chave) === '1'; localStorage.setItem(chave, '1'); } catch (e) { /* sem armazenamento: abre sempre */ }
      if (!visto && !exemplo) abrir();
    }
  }

  // o papel da culpa: Procura-se ou B.O., Interpol, Haia ou Tribunal Penal Internacional
  function docHtml(c, partida, r, d) {
    const j = c.jogador;
    const pct = `${Math.round(c.fatia * 100)}%`;
    const ouro = d.entregue > 0 ? `${d.entregue.toLocaleString('pt-BR')} de ouro` : '—';
    const crimes = (comArtigo) => `<ol class="doc-crimes">${d.acusacoes.map((a) => `<li><strong>${esc(comArtigo && !/^Art\. /.test(a.crime) ? `Art. ${a.artigo} · ${a.crime}` : a.crime)}</strong>${a.evidencia ? `<small>${esc(a.evidencia)}</small>` : ''}</li>`).join('')}</ol>`;
    const campo = (rot, val) => `<div><b>${rot}</b>${esc(val)}</div>`;
    const campos = [campo('Campeão', j.championName), campo('Rota', ROTAS[j.teamPosition] || '—'), campo('KDA', `${j.kills}/${j.deaths}/${j.assists}`),
      campo('Culpa', pct), campo('Ouro entregue', ouro)].join('');
    const foto = (leg) => `<div class="doc-foto">${icone(j.championName)}${leg ? `<small>${leg}</small>` : ''}</div>`;
    const quem = `<p class="doc-nome">${esc(nome(j))}</p><p class="doc-vulgo">vulgo “${esc(d.alcunha)}”</p>`;
    const recompensa = d.entregue > 0
      ? `<div class="doc-recompensa"><p class="valor">${d.entregue.toLocaleString('pt-BR')}</p><small>de ouro de recompensa: o que entregou aos inimigos</small></div>`
      : `<div class="doc-recompensa"><small>Recompensa: ${esc(d.recompensa)}</small></div>`;
    const lado = r.timeNos === 100 ? 'Azuis' : 'Vermelhos';
    const quando = new Date(partida.inicio * 1000);
    const corpo = {
      wanted: () => `<header class="doc-cab"><p class="tit">Procura-se</p><p class="faixa">★ ${esc(d.faixa)} ★</p></header>
        <div class="doc-meio">${foto()}<div>${quem}</div></div>
        <div class="doc-bloco"><p class="doc-rot">Procurado por</p>${crimes(false)}</div>
        <div class="doc-bloco"><p class="doc-rot">Visto pela última vez</p><p class="doc-texto">${esc(d.paradeiro.charAt(0).toUpperCase() + d.paradeiro.slice(1))}.</p></div>
        ${recompensa}<footer class="doc-rodape"><span>Informações ao Xerife do Condado dos ${lado}</span><span>${esc(d.rodape)}</span></footer>`,
      bo: () => `<header class="doc-cab"><div><p class="org">Secretaria da Segurança Pública de Runeterra</p><p class="tit">Boletim de Ocorrência</p></div><p class="num">Nº ${esc(d.numero)}</p></header>
        <div class="doc-meio">${foto('foto 3x4')}<div>${quem}<div class="doc-campos">${campos}${campo('Data do fato', quando.toLocaleDateString('pt-BR'))}</div></div></div>
        <div class="doc-bloco"><p class="doc-rot">Natureza</p>${crimes(true)}</div>
        <div class="doc-bloco"><p class="doc-rot">Histórico</p><p class="doc-texto">Relatam as vítimas, ainda na tela de derrota, que o autor foi ${esc(d.paradeiro)}. ${esc(d.fecho)}</p></div>
        <footer class="doc-rodape"><span>${esc(d.escrivao)}, de plantão</span><span class="doc-carimbo">Registrado</span></footer>`,
      interpol: () => `<header class="doc-cab"><p class="org">Interpol · Difusão vermelha</p><p class="tit">Procurado</p><p class="num">Ref. ${esc(d.numero)}</p></header>
        <div class="doc-meio">${foto()}<div>${quem}<div class="doc-campos">${campos}</div></div></div>
        <div class="doc-bloco"><p class="doc-rot">Acusações</p>${crimes(false)}</div>
        <p class="doc-alerta">${esc(d.alerta)}</p>
        <footer class="doc-rodape"><span>Visto pela última vez: ${esc(d.paradeiro)}</span></footer>`,
      haia: () => `<header class="doc-cab"><p class="org">Tribunal de Haia · Câmara de Instrução</p><p class="tit">Mandado de prisão</p><p class="num">Processo ${esc(d.numero)}</p></header>
        <div class="doc-meio">${foto()}<div>${quem}<div class="doc-campos">${campos}</div></div></div>
        <div class="doc-bloco"><p class="doc-rot">Crimes contra a humanidade</p>${crimes(false)}</div>
        <p class="doc-decisao">${esc(d.decisao)} Pena sugerida: ${esc(d.pena)}.</p>
        <footer class="doc-rodape"><span>${esc(d.escrivao)}, escrivania da Câmara</span><span class="doc-carimbo">Expeça-se</span></footer>`,
      tpi: () => `<header class="doc-cab"><p class="org">Tribunal Penal Internacional</p><p class="tit">Procurado</p><p class="faixa">por ${esc(d.crime.toLowerCase())}</p></header>
        <div class="doc-meio">${foto()}<div>${quem}<div class="doc-campos">${campos}</div></div></div>
        <div class="doc-bloco"><p class="doc-rot">Acusações</p>${crimes(false)}</div>
        <p class="doc-alerta">Pena: ${esc(d.pena)}.</p>
        ${recompensa}<footer class="doc-rodape"><span>${esc(d.decisao)}</span><span class="doc-carimbo">${esc(d.crime)}</span></footer>`,
    };
    return `<article class="doc doc-${d.papel}" style="--raridade:${d.cor}">${corpo[d.papel]()}</article>`;
  }

  function graficoOuro(partida, r) {
    const serie = L.ouroDoTime(partida, r.timeNos);
    if (serie.length < 2) return '<p class="vazio">Sem timeline.</p>';
    const W = 400, H = 200, P = 28;
    const max = Math.max(1000, ...serie.map((s) => Math.abs(s.dif)));
    const x = (i) => P + (i / (serie.length - 1)) * (W - P - 8);
    const y = (v) => H / 2 - (v / max) * (H / 2 - 14);
    const pts = serie.map((s, i) => `${x(i).toFixed(1)},${y(s.dif).toFixed(1)}`).join(' ');
    const area = `${x(0)},${H / 2} ${pts} ${x(serie.length - 1)},${H / 2}`;
    const k = (v) => (Math.abs(v) >= 1000 ? (v / 1000).toFixed(0) + 'k' : v);
    const ticks = [];
    for (let m = 10; m < serie.length; m += 10) ticks.push(`<text x="${x(m)}" y="${H - 2}" text-anchor="middle" font-size="10" fill="var(--muted)">${m}'</text>`);
    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Diferença de ouro do time por minuto">
      <defs><clipPath id="cima"><rect x="0" y="0" width="${W}" height="${H / 2}"/></clipPath><clipPath id="baixo"><rect x="0" y="${H / 2}" width="${W}" height="${H / 2}"/></clipPath></defs>
      <polygon points="${area}" fill="var(--good)" opacity=".22" clip-path="url(#cima)"/>
      <polygon points="${area}" fill="var(--bad)" opacity=".22" clip-path="url(#baixo)"/>
      <line x1="${P}" x2="${W - 8}" y1="${H / 2}" y2="${H / 2}" stroke="var(--line-strong)"/>
      <polyline points="${pts}" fill="none" stroke="var(--gold)" stroke-width="2"/>
      <text x="2" y="${y(max) + 4}" font-size="10" fill="var(--muted)">+${k(max)}</text>
      <text x="2" y="${y(-max) + 4}" font-size="10" fill="var(--muted)">−${k(max)}</text>${ticks.join('')}
    </svg><p class="legenda"><span style="--c:var(--good)">time na frente</span><span style="--c:var(--bad)">time atrás</span></p>`;
  }

  // ---------------------------------------------------------------- recibo, lutas e resenha
  let partidaAtual = null;
  const nomesHab = {};   // campeão -> nomes de Q, W, E, R (Data Dragon em português)

  function reciboHtml(abate) {
    const R = window.ResenhaLoL.recibo(abate, (c) => nomesHab[c]);
    if (!R.total) return '';
    const max = R.linhas[0].dano || 1;
    const quem = R.porQuem.slice(0, 3).map(([f, d]) => `${esc(f)} ${Math.round((d / R.total) * 100)}%`).join(', ');
    return `<div class="recibo"><div class="tot">Levou ${L.fmt(R.total)} de dano: ${quem}.</div>${R.linhas.map((l) => `
      <div class="rl"><span class="nm">${esc(l.fonte)}${l.golpe ? ` <small>${esc(l.golpe)}</small>` : ''}</span><span class="v">${L.fmt(l.dano)}</span>
      <span class="bar"><i style="width:${Math.round((l.dano / max) * 100)}%"></i></span></div>`).join('')}</div>`;
  }

  function rendicao(partida, r) {
    const j = partida.jogadores.find((x) => x.gameEndedInEarlySurrender || x.gameEndedInSurrender);
    if (!j) return '';
    const quem = r.venceu ? 'os inimigos' : 'vocês';
    return j.gameEndedInEarlySurrender ? ` · ${quem} se renderam cedo` : ` · ${quem} se renderam`;
  }

  function lutasHtml(r) {
    if (!r.lutas.length) return '';
    const nomeObj = (os) => L.descreverObjetivos(os);
    return `<section class="cartao"><h2>Lutas</h2><div class="lutas">${r.lutas.map((l) => {
      const res = { venceu: 'Vocês ganharam', perdeu: 'Vocês perderam', empate: 'Empate' }[l.resultado];
      const abriu = l.abriuNosso
        ? `${esc(nome(l.abriu))} (${esc(l.abriu.championName)}) abriu a luta morrendo.`
        : `Abriu com ${esc(l.abriu.championName)} deles morrendo.`;
      const aus = l.ausentes.length ? ` Não foram: ${l.ausentes.map((a) => esc(nome(a))).join(', ')}.` : '';
      const dep = l.objetivosNos.length ? ` Depois vocês pegaram ${esc(nomeObj(l.objetivosNos))}.`
        : l.objetivosEles.length ? ` Depois eles pegaram ${esc(nomeObj(l.objetivosEles))}.` : '';
      return `<div class="luta ${l.resultado}"><div class="cab"><b>${L.mmss(l.inicio)}</b><span>${esc(l.lugar)}</span>
          <span class="placar">${res} ${l.mortesEles} x ${l.mortesNos}</span></div>
        <div class="det">${abriu}${aus}${dep}</div>
        <button class="rp-chip" data-ver="${l.inicio}">▶ Ver no replay</button></div>`;
    }).join('')}</div><p class="legenda" style="margin-top:10px">Luta = 3 abates ou mais perto um do outro. Placar: abates de vocês x mortes de vocês.</p></section>`;
  }

  function resenhaHtml(partida, r, eu) {
    const Rz = window.ResenhaLoL;
    const pg = Rz.pings(partida.jogadores);
    const med = r.nos.map((j) => ({ j, m: Rz.medalhas(partida, j, pg) })).filter((x) => x.m.length);
    const medHtml = med.length ? `<div class="medalhas">${med.map(({ j, m }) => `
      <div class="med-j ${eu && j.id === eu.id ? 'eu' : ''}">${icone(j.championName, 'p')}<div><div class="nm">${esc(nome(j))}</div>
        <ul class="med-lista">${m.map((x) => `<li class="${x.bom ? '' : 'mau'}"><b>${esc(x.titulo)}:</b> ${esc(x.texto)}</li>`).join('')}</ul></div></div>`).join('')}</div>` : '';
    const ids = new Set(r.nos.map((j) => j.id));
    const linhas = pg.linhas.filter((l) => ids.has(l.jogador.id));
    const rei = pg.reiDoInterrogacao;
    const pingHtml = linhas.length ? `<h3 style="margin-top:18px;font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)">Pings do time</h3>
      ${rei ? `<p class="destaque" style="margin-top:8px">${esc(nome(rei.jogador))} (${esc(rei.jogador.championName)}) pingou "?" ${rei.interrogacoes} vezes${ids.has(rei.jogador.id) ? '' : ' (e é do outro time)'}.</p>` : ''}
      <div class="pings">${linhas.map((l) => `<div class="ping-l">${icone(l.jogador.championName, 'p')}
        <div><div class="nm">${esc(nome(l.jogador))}</div><div class="tp">${l.tipos.slice(0, 4).map((t) => `${esc(t.nome)} ${t.n}`).join(' · ') || 'nenhum'}</div></div>
        <div class="n">${l.total}</div></div>`).join('')}</div>` : '';
    if (!medHtml && !pingHtml) return '';
    return `<section class="cartao"><h2>Resenha</h2>${medHtml}${pingHtml}</section>`;
  }

  // ---------------------------------------------------------------- throw e play of the game
  function momentosHtml(cv, r) {
    const pc = (x) => `${Math.round(x * 100)}%`;
    const cartao = (l, tipo) => {
      if (!l) return '';
      const obj = L.descreverObjetivos(l.objetivos);
      const quem = tipo === 'throw' ? l.vitima : l.matou;
      const texto = tipo === 'throw'
        ? `${esc(nome(l.vitima))} (${esc(l.vitima.championName)}) morreu aos ${L.mmss(l.t)}${l.matou ? ` para ${esc(l.matou.championName)}` : ''}${obj ? ` e logo depois os inimigos pegaram ${esc(obj)}` : ''}.`
        : `${esc(nome(l.matou))} (${esc(l.matou.championName)}) pegou ${esc(l.vitima.championName)} aos ${L.mmss(l.t)}${obj ? ` e o time emendou ${esc(obj)}` : ''}.`;
      return `<div class="momento ${tipo}"><div class="rot">${tipo === 'throw' ? 'Throw of the Game' : 'Play of the Game'}</div>
        <div class="quem">${icone(quem.championName, 'p')}<span>${esc(nome(quem))}</span></div>
        <div>${texto}</div>
        <div class="chance">Chance de vitória: ${pc(l.antes)} → ${pc(l.depois)}</div>
        ${tipo === 'throw' && l.morte.recibo && l.morte.recibo.length ? `<div data-recibo="${partidaAtual.eventos.indexOf(l.morte)}">${reciboHtml(l.morte)}</div>` : ''}
        <button class="rp-chip" data-ver="${l.t}">▶ Ver no replay</button></div>`;
    };
    const html = cartao(cv.throwDoJogo, 'throw') + cartao(cv.playDoJogo, 'play');
    return html ? `<section class="cartao"><h2>Momentos da partida</h2><div class="momentos">${html}</div></section>` : '';
  }

  function graficoChance(cv) {
    const serie = cv.curva;
    if (serie.length < 2) return '<p class="vazio">Sem timeline.</p>';
    const W = 400, H = 200, P = 30, fim = serie[serie.length - 1].t || 1;
    const x = (t) => P + (t / fim) * (W - P - 8);
    const y = (p) => 10 + (1 - p) * (H - 30);
    const pts = serie.map((s) => `${x(s.t).toFixed(1)},${y(s.p).toFixed(1)}`).join(' ');
    const area = `${x(0)},${y(0.5)} ${pts} ${x(fim)},${y(0.5)}`;
    const ticks = [];
    for (let m = 10; m * 60 < fim; m += 10) ticks.push(`<text x="${x(m * 60)}" y="${H - 4}" text-anchor="middle" font-size="10" fill="var(--muted)">${m}'</text>`);
    const marca = (l, cor) => (l ? `<circle cx="${x(l.t).toFixed(1)}" cy="${y(l.depois).toFixed(1)}" r="5" fill="${cor}" stroke="var(--surface)" stroke-width="2"><title>${L.mmss(l.t)}</title></circle>` : '');
    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Chance de vitória minuto a minuto">
      <defs><clipPath id="cc-cima"><rect x="0" y="0" width="${W}" height="${y(0.5)}"/></clipPath><clipPath id="cc-baixo"><rect x="0" y="${y(0.5)}" width="${W}" height="${H}"/></clipPath></defs>
      <polygon points="${area}" fill="var(--good)" opacity=".22" clip-path="url(#cc-cima)"/>
      <polygon points="${area}" fill="var(--bad)" opacity=".22" clip-path="url(#cc-baixo)"/>
      <line x1="${P}" x2="${W - 8}" y1="${y(0.5)}" y2="${y(0.5)}" stroke="var(--line-strong)" stroke-dasharray="3 3"/>
      <polyline points="${pts}" fill="none" stroke="var(--gold)" stroke-width="2"/>
      ${marca(cv.throwDoJogo, 'var(--bad)')}${marca(cv.playDoJogo, 'var(--good)')}
      <text x="2" y="${y(1) + 4}" font-size="10" fill="var(--muted)">100%</text>
      <text x="2" y="${y(0.5) + 4}" font-size="10" fill="var(--muted)">50%</text>
      <text x="2" y="${y(0) + 4}" font-size="10" fill="var(--muted)">0%</text>${ticks.join('')}
    </svg><p class="legenda"><span style="--c:var(--bad)">Throw of the Game</span><span style="--c:var(--good)">Play of the Game</span></p>
    <p class="legenda">Estimativa pelo ouro, torres, inibidores, dragões e Barão de cada minuto. Ainda não é um modelo treinado como o do Dota.</p>`;
  }

  // ---------------------------------------------------------------- uso de habilidades
  const FEITICOS = { 1: 'Purificar', 3: 'Exaustão', 4: 'Flash', 6: 'Fantasma', 7: 'Curar', 11: 'Golpear', 12: 'Teleporte', 13: 'Clareza', 14: 'Incendiar', 21: 'Barreira', 32: 'Marcar' };
  const TECLAS = ['Q', 'W', 'E', 'R'];

  function habilidadesHtml(partida, r, eu) {
    if (partida.jogadores[0].spell1Casts == null) return '<p class="vazio">Esta partida foi coletada antes de guardarmos o uso de habilidades. Ela é atualizada na próxima coleta.</p>';
    const bloco = (titulo, js) => `<div><h3>${titulo}</h3>${js.map((j) => {
      const casts = [j.spell1Casts, j.spell2Casts, j.spell3Casts, j.spell4Casts];
      const ordem = (j.skills || []).map(([, s]) => TECLAS[s - 1] || '?').join(' ');
      return `<div class="hab-j ${eu && j.id === eu.id ? 'eu' : ''}" style="margin-top:10px">${icone(j.championName, 'p')}<div>
        <div class="nm">${esc(nome(j))} <small>${esc(j.championName)}</small></div>
        <div class="tiles">${casts.map((n, i) => `<div class="tile${i === 3 && n === 0 ? ' zero' : ''}" title="${TECLAS[i]}"><div class="ic" data-camp="${esc(j.championName)}" data-slot="${i}">${TECLAS[i]}</div>${n}</div>`).join('')}
          <div class="tile sep"></div>
          ${[[j.summoner1Id, j.summoner1Casts], [j.summoner2Id, j.summoner2Casts]].map(([id, n]) => `<div class="tile" title="${esc(FEITICOS[id] || '')}"><div class="ic" data-feitico="${id}">${esc((FEITICOS[id] || '?').slice(0, 2))}</div>${n == null ? '' : n}</div>`).join('')}</div>
        ${ordem ? `<div class="ordem">Ordem: ${ordem}</div>` : ''}</div></div>`;
    }).join('')}</div>`;
    return `<div class="habs">${bloco('Seu time', r.nos)}${bloco('Inimigos', r.eles)}</div>
      <p class="legenda" style="margin-top:12px">Quantas vezes cada um usou Q, W, E, R e os feitiços. Em vermelho: ultimate que não saiu nenhuma vez. A Riot não diz em que momento cada habilidade foi usada, só o total.</p>`;
  }

  const cacheDD = {};
  const pegarDD = (u) => (cacheDD[u] = cacheDD[u] || fetch(u).then((x) => (x.ok ? x.json() : null)).catch(() => null));
  async function preencherHabilidades(partida) {
    if (!versaoDD) return;
    const base = `https://ddragon.leagueoflegends.com/cdn/${versaoDD}`;
    const feiticos = await pegarDD(`${base}/data/pt_BR/summoner.json`);
    if (feiticos && feiticos.data) {
      const porChave = Object.fromEntries(Object.values(feiticos.data).map((f) => [f.key, f]));
      document.querySelectorAll('[data-feitico]').forEach((el) => {
        const f = porChave[el.dataset.feitico];
        if (f) { el.innerHTML = `<img alt="" src="${base}/img/spell/${esc(f.image.full)}">`; el.parentNode.title = f.name; }
      });
    }
    for (const camp of new Set(partida.jogadores.map((j) => j.championName))) {
      const id = ID_CAMPEAO[camp] || camp;
      const d = await pegarDD(`${base}/data/pt_BR/champion/${encodeURIComponent(id)}.json`);
      const info = d && d.data && Object.values(d.data)[0];
      if (!info) continue;
      document.querySelectorAll(`[data-camp="${CSS.escape(camp)}"]`).forEach((el) => {
        const sp = info.spells[+el.dataset.slot];
        if (sp) { el.innerHTML = `<img alt="" src="${base}/img/spell/${esc(sp.image.full)}">`; el.parentNode.title = `${TECLAS[+el.dataset.slot]}: ${sp.name}`; }
      });
      nomesHab[camp] = info.spells.map((x) => x.name);
    }
    document.querySelectorAll('[data-recibo]').forEach((el) => { el.innerHTML = reciboHtml(partida.eventos[+el.dataset.recibo]); });
    if (replay) replay.recibo = null;
  }

  // ---------------------------------------------------------------- replay no mapinha
  // Summoner's Rift: coordenadas de -120 a ~14980, com y para cima
  const MAPA = { MIN: -120, MAX: 14980, S: 300 };
  const px = (v) => ((v - MAPA.MIN) / (MAPA.MAX - MAPA.MIN)) * MAPA.S;
  const VELOCIDADES = [10, 30, 60];
  let replay = null;   // estado do replay da partida aberta

  function replayHtml(partida, r, c) {
    const S = MAPA.S;
    const img = versaoDD ? `<image href="https://ddragon.leagueoflegends.com/cdn/${versaoDD}/img/map/map11.png" x="0" y="0" width="${S}" height="${S}"/>` : '';
    const ids = new Set(r.nos.map((j) => j.id));
    const bonecos = partida.jogadores.map((j) => {
      const cor = ids.has(j.id) ? 'var(--azul)' : 'var(--vermelho)';
      const culpado = j.id === c.jogador.id;
      const foto = versaoDD ? `<image href="https://ddragon.leagueoflegends.com/cdn/${versaoDD}/img/champion/${esc(ID_CAMPEAO[j.championName] || j.championName)}.png" x="-9" y="-9" width="18" height="18" clip-path="url(#rp-circ)"/>` : '';
      return `<g id="rp-j${j.id}" style="display:none"><circle r="9.5" fill="var(--surface-3)"/>${foto}<circle r="${culpado ? 11 : 10}" fill="none" stroke="${culpado ? 'var(--gold-2)' : cor}" stroke-width="${culpado ? 3 : 2}"/><title>${esc(nome(j))} (${esc(j.championName)})</title></g>`;
    }).join('');
    const mortesCulpado = partida.eventos.filter((e) => e.tipo === 'abate' && e.morreu === c.jogador.id);
    const pulos = mortesCulpado.map((m) => `<button class="rp-chip morte" data-pulo="${Math.max(0, m.t - 12)}">${L.mmss(m.t)}</button>`).join('');
    return `<div class="rp-mapa"><svg id="rp-svg" viewBox="0 0 ${S} ${S}" role="img" aria-label="Replay da partida no mapa">
        <defs><clipPath id="rp-circ"><circle r="9"/></clipPath></defs>
        <rect width="${S}" height="${S}" fill="#1f3b22" rx="10"/>${esquema(r.timeNos)}${img}<g id="rp-ev"></g><g id="rp-jog">${bonecos}</g></svg></div>
      <div class="rp-ctrl"><button class="rp-play" id="rp-play" aria-label="Tocar">▶</button>
        <input type="range" id="rp-t" min="0" max="${partida.duracao}" step="1" value="0" aria-label="Tempo da partida">
        <span class="rp-hora" id="rp-hora">0:00</span></div>
      <div class="rp-linha">Velocidade ${VELOCIDADES.map((v) => `<button class="rp-chip${v === 30 ? ' on' : ''}" data-vel="${v}">${v}x</button>`).join('')}</div>
      ${pulos ? `<div class="rp-linha">Mortes de ${esc(nome(c.jogador))}: ${pulos}</div>` : ''}
      <ol class="rp-feed" id="rp-feed"></ol>
      <div class="rp-recibo" id="rp-recibo"></div>
      <p class="legenda">A Riot só dá a posição de cada um uma vez por minuto e no segundo de cada abate. Entre esses pontos o caminho é estimado. Azul: seu time. Vermelho: os inimigos. Anel dourado: o culpado.</p>`;
  }

  // desenho simples do mapa (rotas, rio e bases), por baixo da imagem oficial, para quando ela não carrega
  function esquema(timeNos) {
    const p = (x, y) => `${px(x).toFixed(1)},${(MAPA.S - px(y)).toFixed(1)}`;
    const azul = window.ReplayLoL.BASE[100], verm = window.ReplayLoL.BASE[200];
    const rota = (pts) => `<polyline points="${pts.map(([x, y]) => p(x, y)).join(' ')}" fill="none" stroke="#c9b98f" stroke-opacity=".35" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>`;
    return `<polyline points="${p(-120, 14980)} ${p(14980, -120)}" stroke="#4f8fbf" stroke-opacity=".35" stroke-width="14"/>`
      + rota([[1200, 1600], [1200, 13600], [13300, 13600]]) + rota([[1600, 1200], [13600, 1200], [13600, 13300]]) + rota([[1500, 1500], [13400, 13400]])
      + `<circle cx="${px(azul.x)}" cy="${MAPA.S - px(azul.y)}" r="22" fill="${timeNos === 100 ? 'var(--azul)' : 'var(--vermelho)'}" opacity=".35"/><circle cx="${px(verm.x)}" cy="${MAPA.S - px(verm.y)}" r="22" fill="${timeNos === 200 ? 'var(--azul)' : 'var(--vermelho)'}" opacity=".35"/>`;
  }

  function iniciarReplay(partida, r, c) {
    if (replay && replay.raf) cancelAnimationFrame(replay.raf);
    const dados = window.ReplayLoL.preparar(partida, r.timeNos);
    const el = (id) => document.getElementById(id);
    const st = replay = { t: 0, tocando: false, vel: 30, raf: 0, ultimo: 0, feedN: -1 };
    const nos = dados.jogadores.map((j) => ({ j, g: el('rp-j' + j.id) }));
    const S = MAPA.S;

    function desenhar() {
      const t = st.t;
      for (const { j, g } of nos) {
        const p = window.ReplayLoL.posicao(j, t);
        if (!p.vivo) { g.style.display = 'none'; continue; }
        g.style.display = '';
        g.setAttribute('transform', `translate(${px(p.x).toFixed(1)},${(S - px(p.y)).toFixed(1)})`);
      }
      // eventos dos últimos 40 s de jogo, apagando aos poucos
      let ev = '';
      for (const e of dados.eventos) {
        if (e.t > t) break;
        const idade = t - e.t;
        if (idade > 40) continue;
        const o = (1 - idade / 40).toFixed(2), x = px(e.x), y = S - px(e.y);
        const cor = e.bom ? 'var(--good)' : 'var(--bad)';
        ev += e.tipo === 'abate'
          ? `<g opacity="${o}" transform="translate(${x.toFixed(1)},${y.toFixed(1)})"><circle r="${8 + idade / 4}" fill="none" stroke="${cor}" stroke-width="1.5"/><path d="M-4,-4L4,4M4,-4L-4,4" stroke="${cor}" stroke-width="2.5"/></g>`
          : `<g opacity="${o}" transform="translate(${x.toFixed(1)},${y.toFixed(1)})"><rect x="-6" y="-6" width="12" height="12" transform="rotate(45)" fill="${cor}" stroke="#000"/></g>`;
      }
      el('rp-ev').innerHTML = ev;
      el('rp-hora').textContent = L.mmss(t);
      el('rp-t').value = Math.round(t);
      // feed: os 4 últimos eventos até agora
      let n = 0;
      while (n < dados.eventos.length && dados.eventos[n].t <= t) n++;
      // recibo da última morte do time nos últimos 15 s de jogo
      const ultMorte = [...dados.eventos.slice(0, n)].reverse().find((e) => e.tipo === 'abate' && !e.bom && t - e.t <= 15);
      const chaveRecibo = ultMorte ? ultMorte.t + '-' + ultMorte.morreu : '';
      if (chaveRecibo !== st.recibo) {
        st.recibo = chaveRecibo;
        const ab = ultMorte && partida.eventos.find((e) => e.tipo === 'abate' && e.t === ultMorte.t && e.morreu === ultMorte.morreu);
        const vit = ab && partida.jogadores.find((j) => j.id === ab.morreu);
        el('rp-recibo').innerHTML = ab && ab.recibo && ab.recibo.length
          ? `<div class="tt">${esc(nome(vit))} (${esc(vit.championName)}) morreu aos ${L.mmss(ab.t)}</div>${reciboHtml(ab)}` : '';
      }
      if (n !== st.feedN) {
        st.feedN = n;
        el('rp-feed').innerHTML = dados.eventos.slice(Math.max(0, n - 4), n).reverse()
          .map((e) => `<li class="${e.bom ? 'bom' : 'mau'}"><b>${L.mmss(e.t)}</b><span>${esc(e.texto)}</span></li>`).join('')
          || '<li><span>Os eventos aparecem aqui conforme a partida passa.</span></li>';
      }
    }

    function quadro(agora) {
      if (!st.tocando || replay !== st) return;
      const dt = st.ultimo ? (agora - st.ultimo) / 1000 : 0;
      st.ultimo = agora;
      st.t = Math.min(dados.duracao, st.t + dt * st.vel);
      desenhar();
      if (st.t >= dados.duracao) return tocar(false);
      st.raf = requestAnimationFrame(quadro);
    }

    function tocar(sim) {
      st.tocando = sim;
      st.ultimo = 0;
      el('rp-play').textContent = sim ? '❚❚' : '▶';
      el('rp-play').setAttribute('aria-label', sim ? 'Pausar' : 'Tocar');
      if (sim) {
        if (st.t >= dados.duracao) st.t = 0;
        st.raf = requestAnimationFrame(quadro);
      }
    }

    st.pular = (t) => { st.t = t; desenhar(); tocar(true); };
    el('rp-play').addEventListener('click', () => tocar(!st.tocando));
    el('rp-t').addEventListener('input', (e) => { st.t = +e.target.value; desenhar(); });
    document.querySelectorAll('[data-vel]').forEach((b) => b.addEventListener('click', () => {
      st.vel = +b.dataset.vel;
      document.querySelectorAll('[data-vel]').forEach((x) => x.classList.toggle('on', x === b));
    }));
    document.querySelectorAll('[data-pulo]').forEach((b) => b.addEventListener('click', () => {
      st.t = +b.dataset.pulo;
      desenhar();
      tocar(true);
    }));
    desenhar();
  }

  window.addEventListener('hashchange', rota);
  rota();
})();
</script>
