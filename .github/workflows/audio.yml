name: Áudio da vitória (voz do Mat)

# Quem carregou manda um áudio debochado no grupo: o roteiro sai dos números da partida (audio/roteiro.js) e a voz é a
# do Mat, clonada no Qwen3-TTS 0.6B (Apache 2.0) a partir do trecho que ele publicou (audio/voz/mat.wav), na CPU.
# Grava a conversa do zap: 3 a 4 áudios curtos em audios/banco/<chave>.mp3 e audios/<id>-<lado>.json. Roda depois de cada ranking (vitórias do grupo dos últimos dias), na mão,
# ou na hora com um push em audio/pedidos/<id> (pedido do site, para partida de qualquer pessoa).
on:
  workflow_run:
    workflows: ["Ranking dos amigos (culpados, MMR e parceiros)"]
    types: [completed]
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["audio/pedidos/**", "audio/roteiro.js", "audio/fila.js", "audio/falar.py", "audio/banco.js", ".github/workflows/audio.yml"]

permissions:
  contents: write

# Pedido do site (push) e lote do grupo (depois do ranking) rodam em filas separadas: o visitante não espera o lote
# de 3 áudios (~12 min) terminar para o dele começar.
concurrency:
  group: audio-${{ github.event_name == 'push' && 'pedido' || 'lote' }}
  cancel-in-progress: false

jobs:
  audio:
    # Desligado de novo em 06/11/2026 junto com a conversa do zap na vitória: só grava na mão. Para religar a gravação
    # automática, crie a variável do repositório AUDIO_AUTOMATICO=true.
    if: github.event_name == 'workflow_dispatch' || vars.AUDIO_AUTOMATICO == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/checkout@v4
        with:
          ref: dados
          path: .dados
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Roteiros (fila)
        id: fila
        env:
          OPENDOTA_API_KEY: ${{ secrets.OPENDOTA_API_KEY }}
        run: node audio/fila.js --max 3 --dias 3 | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-python@v5
        id: py
        if: steps.fila.outputs.fila != '0'
        with:
          python-version: "3.11"
      # o ambiente Python já instalado (venv) e o modelo ficam em cache: com o venv pronto não roda pip nenhum
      # (antes o cache era só dos downloads do pip e a instalação ainda levava ~1,5 min a cada rodada)
      - uses: actions/cache@v4
        id: cache
        if: steps.fila.outputs.fila != '0'
        with:
          path: |
            ~/venv-voz
            ~/.cache/huggingface
          key: qwen-tts-0.6b-venv-${{ steps.py.outputs.python-version }}-v1
      - name: Instalar a voz
        if: steps.fila.outputs.fila != '0'
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v sox >/dev/null; then
            sudo apt-get install -y -qq ffmpeg sox >/dev/null 2>&1 || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg sox >/dev/null)
          fi
          if [ "${{ steps.cache.outputs.cache-hit }}" != "true" ]; then
            python -m venv ~/venv-voz
            ~/venv-voz/bin/pip install -q --index-url https://download.pytorch.org/whl/cpu torch torchaudio
            ~/venv-voz/bin/pip install -q qwen-tts==0.1.1 soundfile numpy
          fi
          echo "$HOME/venv-voz/bin" >> "$GITHUB_PATH"
      - name: Gravar
        if: steps.fila.outputs.fila != '0' || steps.fila.outputs.pedidos != '0'
        run: python audio/falar.py 2>&1 | grep -v -i -E "warn|pci_bus" | tail -30 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Salvar
        if: always() && (steps.fila.outputs.fila != '0' || steps.fila.outputs.pedidos != '0')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p audios
          git add -A audios audio/pedidos audio/falhas.json 2>/dev/null || git add -A audios
          git diff --cached --quiet && exit 0
          git commit -m "Áudio da vitória: $(git diff --cached --name-only -- audios/banco | grep -c '\.mp3$') áudio(s) novo(s)"
          for i in 1 2 3; do
            if ! git pull --rebase -X theirs origin main; then
              git diff --name-only --diff-filter=U -- audio/pedidos | xargs -r git rm -q --
              GIT_EDITOR=true git rebase --continue || { git rebase --abort; sleep 5; continue; }
            fi
            git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
