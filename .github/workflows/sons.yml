name: Sons das skills

# Baixa da wiki de Dota o som das ultimates e skills de impacto que aparecem nos mapas.
# Roda quando chegam mapas novos (1x por dia basta) ou na hora com um push em sons/baixar.py.
on:
  schedule:
    - cron: "37 7 * * *"
  push:
    paths: ["sons/baixar.py", ".github/workflows/sons.yml", "sons/pedido"]

permissions:
  contents: write

concurrency:
  group: sons
  cancel-in-progress: false

jobs:
  sons:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Baixar sons
        run: python sons/baixar.py | tee -a "$GITHUB_STEP_SUMMARY" sons/ultimo-log.txt
      - name: Salvar
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sons
          git diff --cached --quiet && exit 0
          git commit -m "Sons: skills do mapa"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
