name: Worker do coach (deploy)

# Publica worker/coach.js na Cloudflare e preenche o config.json com o endereço.
# Precisa dos segredos do repositório CLOUDFLARE_API_TOKEN (modelo "Edit Cloudflare Workers")
# e CLOUDFLARE_ACCOUNT_ID. Opcional: MAPA_GITHUB_TOKEN (token do GitHub do botão "Gerar o mapa agora"),
# que este robô grava no Worker como o segredo GITHUB_TOKEN. Roda quando o worker muda, ou na hora com um push em worker/deploy-agora.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["worker/coach.js", "worker/wrangler.toml", "worker/deploy-agora", ".github/workflows/worker.yml"]

permissions:
  contents: write

concurrency:
  group: worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      MAPA_GITHUB_TOKEN: ${{ secrets.MAPA_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Tem os segredos?
        id: seg
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Faltam os segredos CLOUDFLARE_API_TOKEN/CLOUDFLARE_ACCOUNT_ID; nada a fazer." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "ok=0" >> "$GITHUB_OUTPUT"
          else
            echo "ok=1" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.seg.outputs.ok == '1'
        with:
          node-version: "22"
      - name: Publicar o Worker
        if: steps.seg.outputs.ok == '1'
        working-directory: worker
        run: |
          npx --yes wrangler@4.150.0 deploy 2>&1 | tee ../deploy.log
          URL=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' ../deploy.log | head -1)
          [ -n "$URL" ] || { echo "não achei a URL do Worker no log"; exit 1; }
          echo "URL=$URL" >> "$GITHUB_ENV"
          echo "Worker no ar: $URL" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Token do botão do mapa
        if: steps.seg.outputs.ok == '1' && env.MAPA_GITHUB_TOKEN != ''
        working-directory: worker
        run: printf '%s' "$MAPA_GITHUB_TOKEN" | npx --yes wrangler@4.150.0 secret put GITHUB_TOKEN
      - name: Testar e ligar no site
        if: steps.seg.outputs.ok == '1'
        run: |
          sleep 5
          curl -s "$URL/saude" | tee -a "$GITHUB_STEP_SUMMARY" || true
          printf '{"coach": "%s"}\n' "$URL" > config.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config.json
          git diff --cached --quiet && exit 0
          git commit -m "Coach: liga o Worker ($URL)"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0; git rebase --abort 2>/dev/null; sleep 5; done; exit 1
