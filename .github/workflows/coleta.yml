name: Coleta de partidas (base para modelos)

# Baixa, com a análise do replay, as partidas do Suéter (conta 81918076) dos últimos 14 dias e as dos amigos
# (colegas de time em >= 3 partidas em >= 2 sessões diferentes, mais a lista do amigos.json) e guarda no branch órfão
# "dados" deste repositório, fora do site: partidas/<id>.json.gz, indice.json, amigos.json, estado.json.
# Gasta a cota grátis do OpenDota deixando ~200 consultas do dia livres (COLETA_RESERVA). Detalhes: coleta/LEIA-ME.md.
on:
  schedule:
    - cron: "17 * * * *"
    - cron: "47 * * * *"   # dois horários: o agendamento do GitHub pula muitas rodadas (chegou a 6 h sem rodar)
  workflow_dispatch:
  # o agendamento do GitHub demora (ou falha) neste repositório: um push em coleta/disparar (qualquer conteúdo) roda na hora
  push:
    branches: [main]
    paths: ["coleta/disparar", "coleta/coletar.py", ".github/workflows/coleta.yml", "ranking/pedido", "grupos/grupos.json"]   # "Atualizar agora" do ranking também coleta

permissions:
  contents: write

concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  coleta:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      COLETA_RESERVA: "200"                 # consultas do dia que o robô nunca usa
      COLETA_TETO_DIA: "3000"               # teto próprio por dia (UTC), menos a reserva (o OpenDota mostrou 3000/dia)
      COLETA_HISTORICO_ANOS: "2"            # histórico antigo só até 2 anos atrás
      COLETA_ORCAMENTO_SEM_CABECALHO: "80"  # por rodada, se o OpenDota não mandar os cabeçalhos de cota
      COLETA_TEMPO_MAX_S: "2100"            # para de chamar a API em 35 min (sobra tempo para salvar)
      COLETA_HISTORICO: "1"                 # com a sobra da cota, também partidas antigas já analisadas (0 desliga)
    steps:
      # o script vem sempre da ponta da main
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # clone parcial do branch dados: só os .json da raiz (partidas/ não é baixado); cria o branch se não existe;
      # falha (e a coleta nem roda) se o push não vai funcionar
      - name: Baixar o branch dados
        id: dados
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash coleta/dados.sh preparar dados
      - name: Coletar partidas
        id: coleta
        timeout-minutes: 42
        # exec: o Python é quem recebe o sinal do runner (cancelamento ou tempo do passo) e grava o que já baixou
        # a lista manual é o amigos.json do Marocas mais as contas de cada grupo da Liga (grupos/<id>/amigos.json)
        run: |
          python - <<'PY'
          import glob, json
          todos = json.load(open('amigos.json', encoding='utf-8'))
          for arq in sorted(glob.glob('grupos/*/amigos.json')):
              for conta, nome in json.load(open(arq, encoding='utf-8')).items():
                  todos.setdefault(conta, nome)
          json.dump(todos, open('/tmp/amigos-todos.json', 'w', encoding='utf-8'), ensure_ascii=False)
          print(f'lista manual: {len(todos)} contas')
          PY
          exec python coleta/coletar.py --dados dados --amigos /tmp/amigos-todos.json
      # mesmo se a coleta falhar ou estourar o tempo: o que já foi baixado vai para o branch
      - name: Salvar no branch dados
        if: always() && steps.dados.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          MENSAGEM: "Coleta: ${{ steps.coleta.outputs.novas || 0 }} partidas novas (rodada ${{ github.run_number }})"
        run: bash coleta/dados.sh salvar dados "$MENSAGEM"
