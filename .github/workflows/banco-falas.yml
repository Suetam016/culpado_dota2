name: Teste do banco de falas (voz do Mat)

# Banco de falas: monta o roteiro das partidas listadas em prototipos/banco-falas/partida (um id por linha), corta
# em frases (audio/banco.js) e grava na voz do Mat só as que ainda não estão em audios/banco/. O site emenda as
# frases na hora (?visao=zap&banco=1). As versões de teste antigas (emendar.py/emendar2.py) ficam para comparação.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["prototipos/banco-falas/partida", "prototipos/banco-falas/gravar_banco.py", "prototipos/banco-falas/faltam.js", "audio/banco.js", ".github/workflows/banco-falas.yml"]

permissions:
  contents: write

concurrency:
  group: banco-falas
  cancel-in-progress: false

jobs:
  gravar:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/checkout@v4
        with:
          ref: dados
          path: .dados
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Frases que faltam no banco
        env:
          OPENDOTA_API_KEY: ${{ secrets.OPENDOTA_API_KEY }}
        run: set -o pipefail; node prototipos/banco-falas/faltam.js $(grep -oE '^[0-9]{9,12}' prototipos/banco-falas/partida) | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-python@v5
        id: py
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        id: cache
        with:
          path: |
            ~/venv-voz
            ~/.cache/huggingface
          key: qwen-tts-0.6b-venv-${{ steps.py.outputs.python-version }}-v1
      - name: Instalar a voz
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v sox >/dev/null; then
            sudo apt-get install -y -qq ffmpeg sox >/dev/null 2>&1 || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg sox >/dev/null)
          fi
          if [ "${{ steps.cache.outputs.cache-hit }}" != "true" ]; then
            python -m venv ~/venv-voz
            ~/venv-voz/bin/pip install -q --index-url https://download.pytorch.org/whl/cpu torch torchaudio
            ~/venv-voz/bin/pip install -q qwen-tts==0.1.1 soundfile numpy
          fi
          echo "$HOME/venv-voz/bin" >> "$GITHUB_PATH"
      - name: Gravar as frases
        run: set -o pipefail; python prototipos/banco-falas/gravar_banco.py 2>&1 | grep -v -i -E "warn|pci_bus|pad_token" | tail -80 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Salvar
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -d audios/banco ] || exit 0
          git add audios/banco
          git diff --cached --quiet && exit 0
          git commit -m "Banco de falas: frases gravadas"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0; git rebase --abort 2>/dev/null; sleep 5; done; exit 1
