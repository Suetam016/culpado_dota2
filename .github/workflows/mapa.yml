name: Mapa (posições dos heróis)

# Baixa o replay das partidas de vocês, roda o parser do OpenDota e guarda a posição de cada herói
# segundo a segundo em mapas/<id>.json (o "lance animado" do site). A cada 10 min (sai em segundos se
# não tem partida nova), ou na hora com um
# push em mapa/pedidos/<id> (o Worker do coach cria esse arquivo quando alguém aperta "Gerar o mapa agora").
on:
  schedule:
    - cron: "*/10 * * * *"
  push:
    paths: ["mapa/pedidos/**", ".github/workflows/mapa.yml", "mapa/processar.py"]

permissions:
  contents: write

concurrency:
  group: mapa
  cancel-in-progress: false

jobs:
  mapa:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # sempre a ponta da main (num push o checkout pegaria o commit do evento: a rodada que esperou na fila
      # da concurrency refaria os pedidos que a anterior já atendeu e regravaria falhas.json de uma base velha)
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tem partida nova?
        id: fila
        run: python mapa/processar.py --amigos amigos.json --so-fila
      - uses: actions/setup-java@v4
        if: steps.fila.outputs.fila != '0'
        with:
          distribution: temurin
          java-version: "21"
      # o parser leva ~3 min para compilar: guarda o .jar pronto em cache, pela versão do parser
      - name: Versão do parser
        id: versao
        if: steps.fila.outputs.fila != '0'
        run: echo "sha=$(git ls-remote https://github.com/odota/parser.git HEAD | cut -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        if: steps.fila.outputs.fila != '0'
        with:
          path: parser-jar
          key: parser-jar-${{ steps.versao.outputs.sha }}
      - name: Parser de replays do OpenDota
        if: steps.fila.outputs.fila != '0'
        run: |
          if [ ! -f parser-jar/parser.jar ]; then
            echo "compilando o parser (sem cache)"
            git clone --depth 1 https://github.com/odota/parser.git parser
            (cd parser && mvn -q -DskipTests package)
            mkdir -p parser-jar
            cp "$(ls parser/target/*.jar | grep -v original | head -1)" parser-jar/parser.jar
          else
            echo "parser do cache"
          fi
          nohup java -Xmx5g -jar parser-jar/parser.jar 5600 > parser.log 2>&1 &
          for i in $(seq 1 60); do nc -z localhost 5600 && break; sleep 2; done
          nc -z localhost 5600 && echo "parser no ar" || { cat parser.log; exit 1; }
      - name: Dependências
        if: steps.fila.outputs.fila != '0'
        run: pip install -q zstandard
      # pedidos do botão "Gerar o mapa agora" primeiro, publicados na hora (quem pediu está esperando na página)
      - name: Processar os pedidos do site
        if: steps.fila.outputs.pedidos != '0' && steps.fila.outputs.pedidos != ''
        run: python mapa/processar.py --amigos amigos.json --so-pedidos | tee -a "$GITHUB_STEP_SUMMARY" mapa/ultimo-log.txt
      - name: Publicar os pedidos
        if: always() && steps.fila.outputs.pedidos != '0' && steps.fila.outputs.pedidos != ''
        run: |
          mkdir -p mapas
          tail -50 parser.log > mapa/parser-log.txt 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mapas mapa
          git diff --cached --quiet && exit 0
          git commit -m "Mapa: posições dos heróis"
          # conflito modify/delete (o Worker reescreveu um pedido que esta rodada já atendeu): o -X theirs não resolve;
          # o pedido atendido sai mesmo assim (se o mapa saiu, o próximo pedido vira "pronto")
          for i in 1 2 3; do
            if ! git pull --rebase -X theirs origin main; then
              git diff --name-only --diff-filter=U -- mapa/pedidos | xargs -r git rm -q --
              GIT_EDITOR=true git rebase --continue || { git rebase --abort; sleep 5; continue; }
            fi
            git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
      - name: Processar partidas
        if: steps.fila.outputs.fila != '0'
        run: python mapa/processar.py --amigos amigos.json | tee -a "$GITHUB_STEP_SUMMARY" mapa/ultimo-log.txt
      - name: Salvar
        if: always() && steps.fila.outputs.fila != '0'
        run: |
          mkdir -p mapas
          tail -50 parser.log > mapa/parser-log.txt 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mapas mapa
          git diff --cached --quiet && exit 0
          git commit -m "Mapa: posições dos heróis"
          # conflito modify/delete (o Worker reescreveu um pedido que esta rodada já atendeu): o -X theirs não resolve;
          # o pedido atendido sai mesmo assim (se o mapa saiu, o próximo pedido vira "pronto")
          for i in 1 2 3; do
            if ! git pull --rebase -X theirs origin main; then
              git diff --name-only --diff-filter=U -- mapa/pedidos | xargs -r git rm -q --
              GIT_EDITOR=true git rebase --continue || { git rebase --abort; sleep 5; continue; }
            fi
            git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
