name: Avatares do protótipo

# Só para protótipo: baixa os avatares da Steam dos amigos (prototipos/avatares/lista.txt) para o próprio branch.
on:
  push:
    branches: ["claude/project-thread-i5e9pz"]
    paths: ["prototipos/avatares/lista.txt", ".github/workflows/avatares-prototipo.yml"]

permissions:
  contents: write

jobs:
  baixar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Baixar
        run: |
          cd prototipos/avatares
          while read id url; do curl -fsSL "$url" -o "$id.jpg"; done < lista.txt
          ls -la
      - name: Salvar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prototipos/avatares
          git diff --cached --quiet && exit 0
          git commit -m "Avatares do protótipo"
          git push origin HEAD:claude/project-thread-i5e9pz
