name: Teste clones (temporário)
on:
  push:
    branches: [claude/project-thread-qqvdzx]
    paths: [".github/workflows/teste-clones.yml", "mapa/parser_clones.py", "mapa/processar.py"]
permissions:
  contents: write
jobs:
  teste:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q zstandard
      - name: Parser remendado
        run: |
          git clone --depth 1 https://github.com/odota/parser.git parser
          python mapa/parser_clones.py parser
          (cd parser && JAVA_HOME="$JAVA_HOME_21_X64" mvn -q -DskipTests package)
          nohup "$JAVA_HOME_21_X64/bin/java" -Xmx5g -jar "$(ls parser/target/*.jar | grep -v original | head -1)" 5600 > parser.log 2>&1 &
          for i in $(seq 1 120); do nc -z localhost 5600 && break; sleep 0.5; done
      - name: Processar a partida do Meepo
        run: |
          mkdir -p /tmp/replays
          python - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, "mapa")
          import processar
          d = processar.processar(9083532619, "http://localhost:5600", Path("/tmp/replays"))
          Path("mapas/9083532619.json").write_text(json.dumps(d, separators=(",", ":")))
          print("clones no mapa:", [(c[0], c[1], len(c[2]), sum(v is not None for v in c[2])) for c in d["clones"]])
          PY
          tail -20 parser.log
      - name: Gravar no branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mapas/9083532619.json
          git commit -m "Teste: mapa do Meepo com clones" && git push origin HEAD:claude/project-thread-qqvdzx
