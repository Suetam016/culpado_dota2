name: Falas dos heróis

# Baixa da wiki de Dota as falas de risada/alegria e morte/tristeza de cada herói (voz da revelação do veredito).
# Roda na mão ou com um push em falas/pedido (ex.: herói novo); salva no próprio branch.
on:
  workflow_dispatch:
  push:
    paths: ["falas/pedido"]

permissions:
  contents: write

concurrency:
  group: falas
  cancel-in-progress: false

jobs:
  falas:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Baixar falas
        run: python falas/baixar.py | tee falas/ultimo-log.txt
      - name: Salvar
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add falas
          git diff --cached --quiet && exit 0
          git commit -m "Falas: risada/alegria e morte/tristeza dos heróis"
          B="${GITHUB_REF_NAME}"
          for i in 1 2 3; do git pull --rebase -X theirs origin "$B" && git push origin HEAD:"$B" && exit 0; git rebase --abort 2>/dev/null; sleep 5; done; exit 1
