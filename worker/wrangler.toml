# Configuração do Worker do coach (usada pelo robô .github/workflows/worker.yml)
name = "culpado-coach"
main = "coach.js"
compatibility_date = "2026-09-01"
workers_dev = true

[ai]
binding = "AI"

# contador de visitas do site (Durable Object com SQLite: incluso no plano Free)
[[durable_objects.bindings]]
name = "VISITAS"
class_name = "Visitas"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Visitas"]
