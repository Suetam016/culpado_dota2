<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Quem é o Culpado?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: dossiê de julgamento em uma coluna — processo, linha do tempo, momentos decisivos, tribunal, time contra time. */
:root {
  color-scheme: dark;
  --bg: #0d1115;
  --surface: #141a20;
  --surface-2: #1a222a;
  --line: #26303a;
  --line-strong: #35424e;
  --ink: #e8edf1;
  --ink-2: #b3bfca;
  --muted: #7e8c98;
  --gold: #e3b448;          /* acento: o ouro do Dota, a cor do veredito */
  --on-gold: #1a1305;
  --nos: #3987e5;           /* vocês */
  --eles: #e66767;          /* o time inimigo */
  --nos-wash: rgba(57, 135, 229, 0.16);
  --eles-wash: rgba(230, 103, 103, 0.16);
  --gold-wash: rgba(227, 180, 72, 0.10);
  --good: #0ca30c;
  --warn: #fab219;
  --bad: #d03b3b;
  --good-ink: #3dbf3d;
  --warn-ink: #fab219;
  --bad-ink: #ff8a8a;
  --shadow: 0 1px 0 rgba(255, 255, 255, 0.03), 0 12px 32px rgba(0, 0, 0, 0.35);

  --font-display: "Big Shoulders Display", "Arial Narrow", "Roboto Condensed", Impact, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;

  --t-xs: 0.75rem;
  --t-sm: 0.875rem;
  --t-md: 1rem;
  --t-lg: 1.25rem;
  --t-xl: 1.75rem;
  --t-2xl: 2.5rem;
  --t-3xl: 4rem;
  --radius: 10px;
}

@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --bg: #eef1f4;
    --surface: #ffffff;
    --surface-2: #f5f7f9;
    --line: #dde3e8;
    --line-strong: #c6cfd7;
    --ink: #0f161c;
    --ink-2: #3a4853;
    --muted: #66747f;
    --gold: #8a5d00;
    --on-gold: #fff8e6;
    --nos: #2a78d6;
    --eles: #e34948;
    --nos-wash: rgba(42, 120, 214, 0.12);
    --eles-wash: rgba(227, 73, 72, 0.12);
    --gold-wash: rgba(138, 93, 0, 0.08);
    --good-ink: #006300;
    --warn-ink: #8a5d00;
    --bad-ink: #b42318;
    --shadow: 0 1px 2px rgba(15, 22, 28, 0.06), 0 10px 28px rgba(15, 22, 28, 0.08);
  }
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #eef1f4;
  --surface: #ffffff;
  --surface-2: #f5f7f9;
  --line: #dde3e8;
  --line-strong: #c6cfd7;
  --ink: #0f161c;
  --ink-2: #3a4853;
  --muted: #66747f;
  --gold: #8a5d00;
  --on-gold: #fff8e6;
  --nos: #2a78d6;
  --eles: #e34948;
  --nos-wash: rgba(42, 120, 214, 0.12);
  --eles-wash: rgba(227, 73, 72, 0.12);
  --gold-wash: rgba(138, 93, 0, 0.08);
  --good-ink: #006300;
  --warn-ink: #8a5d00;
  --bad-ink: #b42318;
  --shadow: 0 1px 2px rgba(15, 22, 28, 0.06), 0 10px 28px rgba(15, 22, 28, 0.08);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--t-md);
  line-height: 1.5;
}
a { color: inherit; text-decoration-color: var(--line-strong); text-underline-offset: 3px; }
a:hover { text-decoration-color: var(--gold); }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3, h4, h5 { margin: 0; text-wrap: balance; }
p { margin: 0; }
ul, ol { margin: 0; padding: 0; list-style: none; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------------------------------------------------------------- topo e busca */

.topo {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 20;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.topo-inner {
  max-width: 1160px;
  margin: 0 auto;
  padding-inline: 20px;
  padding-block: 12px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 12px 24px;
}
.marca { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.marca h1 {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 1.9rem;
  line-height: 1;
  letter-spacing: 0.01em;
  text-transform: uppercase;
}
.marca h1 em { font-style: normal; color: var(--gold); }
.marca .tag {
  font-family: var(--font-mono);
  font-size: var(--t-xs);
  color: var(--muted);
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.busca { display: flex; gap: 8px; flex: 1 1 360px; justify-content: flex-end; min-width: 0; }
.busca label { flex: 1 1 auto; max-width: 340px; min-width: 0; }
.busca input {
  width: 100%;
  height: 42px;
  padding: 0 14px;
  background: var(--surface);
  border: 1px solid var(--line-strong);
  border-radius: 8px;
  font-family: var(--font-mono);
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.02em;
}
.busca input::placeholder { color: var(--muted); }
.botao {
  height: 42px;
  padding: 0 18px;
  border-radius: 8px;
  border: 1px solid transparent;
  background: var(--gold);
  color: var(--on-gold);
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
}
.botao:hover { filter: brightness(1.06); }
.botao:disabled { opacity: 0.6; cursor: progress; }
.botao.secundario { background: transparent; color: var(--ink); border-color: var(--line-strong); }
.botao.secundario:hover { border-color: var(--gold); }

.status {
  max-width: 1160px;
  margin: 0 auto;
  padding-inline: 20px;
}
.status-msg {
  margin-top: 14px;
  padding: 10px 14px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink-2);
  font-size: var(--t-sm);
  display: flex;
  gap: 10px;
  align-items: flex-start;
}
.status-msg.erro { border-color: color-mix(in srgb, var(--bad) 55%, var(--line)); }
.status-msg.carregando::before {
  content: "";
  width: 12px;
  height: 12px;
  margin-top: 4px;
  flex: none;
  border-radius: 50%;
  border: 2px solid var(--line-strong);
  border-top-color: var(--gold);
  animation: gira 0.9s linear infinite;
}
@keyframes gira { to { transform: rotate(360deg); } }

/* ---------------------------------------------------------------- página */

.pagina {
  max-width: 1160px;
  margin: 0 auto;
  padding-inline: 20px;
  padding-block: 24px 72px;
  display: grid;
  gap: 56px;
}
.pagina.recarregando { opacity: 0.55; transition: opacity 0.2s; }
.bloco { display: grid; gap: 20px; min-width: 0; }
.bloco-cab { display: grid; gap: 6px; }
.bloco-cab h2 {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: var(--t-2xl);
  line-height: 1;
  text-transform: uppercase;
  letter-spacing: 0.01em;
}
.bloco-cab p { color: var(--ink-2); max-width: 68ch; }
.eyebrow {
  font-family: var(--font-mono);
  font-size: var(--t-xs);
  color: var(--muted);
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.cartao {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
}

/* ---------------------------------------------------------------- processo (cabeçalho da partida) */

.processo { display: grid; gap: 18px; }
.processo-linha {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  gap: 12px 32px;
}
.resultado {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: var(--t-3xl);
  line-height: 0.85;
  text-transform: uppercase;
  letter-spacing: 0.01em;
}
.resultado.is-derrota { color: var(--eles); }
.resultado.is-vitoria { color: var(--nos); }
.placar { display: flex; align-items: baseline; gap: 10px; font-weight: 600; font-size: var(--t-2xl); line-height: 1; }
.placar .x { color: var(--muted); font-weight: 400; font-size: var(--t-xl); }
.placar .nos { color: var(--nos); }
.placar .eles { color: var(--eles); }
.fato { display: grid; gap: 2px; }
.fato .rotulo { font-size: var(--t-xs); color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; font-family: var(--font-mono); }
.fato .valor { font-weight: 600; font-size: var(--t-lg); }
.resumo { font-size: var(--t-lg); color: var(--ink); max-width: 70ch; }
.exemplo-aviso {
  display: inline-flex;
  gap: 8px;
  align-items: center;
  font-size: var(--t-sm);
  color: var(--ink-2);
  padding: 6px 10px;
  border-radius: 999px;
  background: var(--gold-wash);
  border: 1px solid color-mix(in srgb, var(--gold) 35%, transparent);
  justify-self: start;
}

.seletor { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.seletor .eyebrow { margin-right: 4px; }
.segmentado {
  display: inline-flex;
  padding: 3px;
  border-radius: 10px;
  background: var(--surface);
  border: 1px solid var(--line);
}
.segmentado button {
  border: 0;
  background: transparent;
  padding: 6px 12px;
  border-radius: 7px;
  cursor: pointer;
  color: var(--ink-2);
  font-size: var(--t-sm);
  font-weight: 500;
}
.segmentado button[aria-pressed="true"] { background: var(--surface-2); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line-strong); }
.segmentado button:hover { color: var(--ink); }

.times { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.time { padding: 14px 16px; display: grid; gap: 8px; min-width: 0; }
.time-cab { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.time-cab h3 { font-size: var(--t-sm); font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; }
.time.nos .time-cab h3 { color: var(--nos); }
.time.eles .time-cab h3 { color: var(--eles); }
.time li {
  display: grid;
  grid-template-columns: 32px minmax(0, 1fr) auto;
  align-items: center;
  gap: 10px;
  padding: 6px 0;
  border-top: 1px solid var(--line);
  font-size: var(--t-sm);
}
.time li:first-child { border-top: 0; }
.time .quem { min-width: 0; display: grid; }
.time .quem strong { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.time .quem span { color: var(--muted); font-size: var(--t-xs); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.time .kda { font-family: var(--font-mono); font-variant-numeric: tabular-nums; color: var(--ink-2); text-align: right; }
.retrato {
  width: 32px;
  height: 32px;
  border-radius: 6px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  display: grid;
  place-items: center;
  overflow: hidden;
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 0.95rem;
  color: var(--ink-2);
}
.retrato img { width: 100%; height: 100%; object-fit: cover; display: block; }
.retrato.grande { width: 72px; height: 72px; border-radius: 10px; font-size: 1.6rem; }

.aviso-parse { padding: 14px 16px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
.aviso-parse p { color: var(--ink-2); font-size: var(--t-sm); max-width: 70ch; }

/* ---------------------------------------------------------------- linha do tempo */

.toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
.legenda { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: var(--t-xs); color: var(--ink-2); }
.legenda span { display: inline-flex; align-items: center; gap: 6px; }
.legenda svg { flex: none; }
.grafico-wrap { position: relative; padding: 12px 12px 8px; min-width: 0; }
.grafico { width: 100%; min-width: 0; touch-action: pan-y; }
.grafico svg { display: block; overflow: visible; max-width: 100%; height: auto; }
.grafico text { font-family: var(--font-mono); font-size: 11px; fill: var(--muted); }
.grafico .rotulo-raia { font-family: var(--font-body); font-size: 12px; fill: var(--ink-2); }
.grafico .grade { stroke: var(--line); stroke-width: 1; }
.grafico .zero { stroke: var(--line-strong); stroke-width: 1; }
.grafico .alvo { cursor: default; }
.tooltip {
  position: absolute;
  z-index: 5;
  pointer-events: none;
  min-width: 180px;
  max-width: 300px;
  padding: 10px 12px;
  border-radius: 8px;
  background: var(--surface-2);
  border: 1px solid var(--line-strong);
  box-shadow: var(--shadow);
  font-size: var(--t-sm);
  line-height: 1.4;
  display: grid;
  gap: 4px;
}
.tooltip .tt-valor { font-weight: 600; font-size: var(--t-md); }
.tooltip .tt-linha { display: flex; gap: 8px; align-items: baseline; color: var(--ink-2); }
.tooltip .tt-chave { width: 12px; height: 2px; flex: none; transform: translateY(-3px); }
.tooltip .tt-tempo { font-family: var(--font-mono); color: var(--muted); font-size: var(--t-xs); }

details.tabela { font-size: var(--t-sm); }
details.tabela summary { cursor: pointer; color: var(--ink-2); padding: 4px 0; }
.tabela-scroll { overflow-x: auto; margin-top: 8px; border: 1px solid var(--line); border-radius: 8px; }
table { border-collapse: collapse; width: 100%; font-size: var(--t-sm); }
th, td { padding: 6px 10px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; font-variant-numeric: tabular-nums; }
th:first-child, td:first-child { text-align: left; }
thead th { color: var(--muted); font-weight: 500; font-size: var(--t-xs); text-transform: uppercase; letter-spacing: 0.06em; background: var(--surface-2); position: sticky; top: 0; }

.eventos { display: grid; gap: 0; max-height: 360px; overflow: auto; border: 1px solid var(--line); border-radius: 8px; }
.eventos li {
  display: grid;
  grid-template-columns: 56px 18px minmax(0, 1fr);
  gap: 10px;
  align-items: baseline;
  padding: 7px 12px;
  border-bottom: 1px solid var(--line);
  font-size: var(--t-sm);
}
.eventos li:last-child { border-bottom: 0; }
.eventos .t { font-family: var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.eventos .marca-ev { width: 10px; height: 10px; border-radius: 2px; transform: translateY(1px); }
.eventos .marca-ev.nos { background: var(--nos); }
.eventos .marca-ev.eles { background: var(--eles); }
.eventos .marca-ev.neutro { background: var(--muted); }

/* ---------------------------------------------------------------- momentos decisivos */

.momentos { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 16px; }
.momento { padding: 18px; display: grid; gap: 14px; align-content: start; min-width: 0; }
.momento-cab { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.momento-cab h3 { font-family: var(--font-display); font-weight: 800; font-size: var(--t-xl); line-height: 1; text-transform: uppercase; }
.delta { font-weight: 600; font-size: var(--t-lg); white-space: nowrap; }
.delta.ruim { color: var(--eles); }
.delta.bom { color: var(--nos); }
.momento h4 { font-size: var(--t-xs); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 500; font-family: var(--font-mono); margin-bottom: 6px; }
.momento li { font-size: var(--t-sm); padding: 3px 0; display: flex; gap: 8px; align-items: baseline; min-width: 0; }
.momento li .t { font-family: var(--font-mono); color: var(--muted); flex: none; width: 44px; font-variant-numeric: tabular-nums; }
.chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 1px 8px;
  border-radius: 999px;
  font-size: var(--t-xs);
  font-weight: 600;
  border: 1px solid var(--line-strong);
  color: var(--ink-2);
  white-space: nowrap;
}
.chip.nos { border-color: color-mix(in srgb, var(--nos) 60%, transparent); color: var(--nos); }
.chip.eles { border-color: color-mix(in srgb, var(--eles) 60%, transparent); color: var(--eles); }
.chip.ouro { border-color: color-mix(in srgb, var(--gold) 60%, transparent); color: var(--gold); }

/* ---------------------------------------------------------------- tribunal */

.veredito {
  position: relative;
  padding: 24px;
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  gap: 20px;
  align-items: center;
  overflow: hidden;
  border-color: color-mix(in srgb, var(--eles) 45%, var(--line));
  background:
    radial-gradient(120% 140% at 100% 0%, var(--eles-wash), transparent 55%),
    var(--surface);
}
.veredito .quem-e { display: grid; gap: 6px; min-width: 0; }
.veredito h3 { font-family: var(--font-display); font-weight: 800; font-size: var(--t-2xl); line-height: 1; overflow-wrap: anywhere; }
.veredito .heroi { color: var(--ink-2); }
.veredito .frase { font-size: var(--t-lg); max-width: 60ch; }
.veredito .numeros { display: flex; flex-wrap: wrap; gap: 8px 24px; margin-top: 6px; }
.carimbo {
  position: absolute;
  right: 18px;
  top: 14px;
  transform: rotate(-9deg);
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 1.9rem;
  letter-spacing: 0.12em;
  color: var(--eles);
  border: 3px solid var(--eles);
  border-radius: 6px;
  padding: 2px 12px 0;
  opacity: 0.9;
  mix-blend-mode: normal;
  animation: carimbar 0.5s cubic-bezier(.2, 1.4, .5, 1) 0.15s both;
}
@keyframes carimbar { from { transform: rotate(-9deg) scale(1.6); opacity: 0; } to { transform: rotate(-9deg) scale(1); opacity: 0.9; } }

.ranking { padding: 8px 16px; }
.ranking button {
  width: 100%;
  display: grid;
  grid-template-columns: minmax(0, 220px) minmax(0, 1fr) 56px;
  gap: 14px;
  align-items: center;
  padding: 10px 0;
  border: 0;
  border-top: 1px solid var(--line);
  background: transparent;
  cursor: pointer;
  text-align: left;
}
.ranking li:first-child button { border-top: 0; }
.ranking button:hover .barra-fill { filter: brightness(1.15); }
.ranking .nome { display: grid; min-width: 0; }
.ranking .nome strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.ranking .nome span { color: var(--muted); font-size: var(--t-xs); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.barra { height: 12px; background: transparent; position: relative; }
.barra-fill { height: 12px; border-radius: 0 4px 4px 0; background: var(--line-strong); }
.ranking li:first-child .barra-fill { background: var(--eles); }
.ranking .valor { font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }

.dossies { display: grid; gap: 20px; }
.dossie { padding: 22px; display: grid; gap: 20px; min-width: 0; scroll-margin-top: 96px; }
.dossie-topo { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 16px; align-items: center; }
.dossie-topo h3 { font-size: var(--t-xl); font-weight: 600; line-height: 1.15; overflow-wrap: anywhere; }
.dossie-topo .sub { color: var(--ink-2); font-size: var(--t-sm); }
.nota { text-align: right; display: grid; justify-items: end; }
.nota-valor { font-weight: 600; font-size: var(--t-2xl); line-height: 1; }
.nota-rotulo { color: var(--muted); font-size: var(--t-xs); white-space: nowrap; }
.zoeira { font-style: italic; color: var(--ink-2); }
.dossie-grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 24px; }
.dossie h4 {
  font-family: var(--font-mono);
  font-size: var(--t-xs);
  font-weight: 500;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: 10px;
}
.provas li { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 10px; padding: 6px 0; font-size: var(--t-sm); border-top: 1px solid var(--line); }
.provas li:first-child { border-top: 0; }
.icone-prova { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 700; margin-top: 1px; }
.icone-prova.ruim { background: color-mix(in srgb, var(--bad) 22%, transparent); color: var(--bad-ink); }
.icone-prova.bom { background: color-mix(in srgb, var(--good) 22%, transparent); color: var(--good-ink); }
.icone-prova.neutro { background: var(--surface-2); color: var(--muted); }

.medidores li { display: grid; gap: 4px; padding: 6px 0; }
.medidor-cab { display: flex; justify-content: space-between; gap: 10px; font-size: var(--t-sm); }
.medidor-cab span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; }
.medidor { height: 6px; border-radius: 3px; background: var(--eles-wash); overflow: hidden; }
.medidor div { height: 100%; border-radius: 3px; background: var(--eles); }
.medidores .evid { font-size: var(--t-xs); color: var(--muted); }

.itens { display: grid; gap: 16px; padding-top: 18px; border-top: 1px solid var(--line); }
.trilha { width: 100%; min-width: 0; position: relative; }
.trilha svg { display: block; overflow: visible; max-width: 100%; height: auto; }
.trilha text { font-family: var(--font-mono); font-size: 10px; fill: var(--muted); }
.itens-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px; }
.build li { display: grid; grid-template-columns: 48px minmax(0, 1fr); gap: 10px; padding: 7px 0; border-top: 1px solid var(--line); font-size: var(--t-sm); }
.build li:first-child { border-top: 0; }
.build .t { font-family: var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.build .item-nome { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.build .timing-texto { grid-column: 2; color: var(--muted); font-size: var(--t-xs); }
.icone-item { width: 22px; height: 16px; border-radius: 3px; object-fit: cover; }
.chip.bom { border-color: color-mix(in srgb, var(--good) 60%, transparent); color: var(--good-ink); }
.chip.atrasado { border-color: color-mix(in srgb, var(--warn) 70%, transparent); color: var(--warn-ink); }
.sugestoes { display: grid; gap: 10px; }
.sugestao { min-width: 0; padding: 12px 14px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--line); display: grid; gap: 4px; }
.sugestao-cab { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.sugestao strong { font-weight: 600; }
.sugestao .quando { font-family: var(--font-mono); font-size: var(--t-xs); color: var(--gold); overflow-wrap: anywhere; }
.sugestao p { font-size: var(--t-sm); color: var(--ink-2); }
.acertos li { font-size: var(--t-sm); color: var(--ink-2); padding: 4px 0 4px 22px; position: relative; }
.acertos li::before { content: "✓"; position: absolute; left: 2px; color: var(--good-ink); font-weight: 700; }
.vazio { color: var(--muted); font-size: var(--t-sm); }
.conselho {
  padding: 14px 16px;
  border-radius: 8px;
  background: var(--gold-wash);
  border: 1px solid color-mix(in srgb, var(--gold) 30%, transparent);
  font-size: var(--t-sm);
}
.conselho strong { color: var(--gold); }

/* ---------------------------------------------------------------- time contra time */

.comparativo { padding: 8px 18px 14px; }
.comparativo .linha { display: grid; grid-template-columns: minmax(0, 200px) minmax(0, 1fr); gap: 16px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.comparativo .linha:first-of-type { border-top: 0; }
.comparativo .rotulo { font-size: var(--t-sm); color: var(--ink-2); }
.pares { display: grid; gap: 4px; min-width: 0; }
.par { display: grid; grid-template-columns: minmax(0, 1fr) 64px; gap: 10px; align-items: center; }
.par .barra-fill { height: 10px; }
.par.nos .barra-fill { background: var(--nos); }
.par.eles .barra-fill { background: var(--eles); }
.par .v { font-size: var(--t-xs); font-variant-numeric: tabular-nums; color: var(--ink-2); text-align: right; }
.rotas { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 16px; }
.rota { padding: 14px 16px; display: grid; gap: 8px; }
.rota .lados { display: flex; justify-content: space-between; gap: 10px; font-size: var(--t-sm); }
.rota .lados div { display: grid; min-width: 0; }
.rota .lados div:last-child { text-align: right; }
.rota .lados strong { font-size: var(--t-lg); }
.rota .lados .nos strong { color: var(--nos); }
.rota .lados .eles strong { color: var(--eles); }
.rota .lados span { color: var(--muted); font-size: var(--t-xs); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.barra-rota { height: 8px; border-radius: 4px; overflow: hidden; display: flex; gap: 2px; background: transparent; }
.barra-rota .n { background: var(--nos); }
.barra-rota .e { background: var(--eles); }

.rodape { color: var(--muted); font-size: var(--t-sm); display: grid; gap: 8px; border-top: 1px solid var(--line); padding-top: 24px; max-width: 80ch; min-width: 0; }
.rodape .mono { overflow-wrap: anywhere; word-break: break-all; }
details.mais { margin-top: 6px; }
details.mais summary { cursor: pointer; color: var(--muted); font-size: var(--t-xs); padding: 4px 0; }

/* ---------------------------------------------------------------- responsivo */

@media (max-width: 860px) {
  .dossie-grid, .itens-grid { grid-template-columns: minmax(0, 1fr); }
  .ranking button { grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr) 48px; }
}
@media (max-width: 640px) {
  .topo-inner, .pagina, .status { padding-inline: 16px; }
  .marca h1 { font-size: 1.5rem; }
  .busca { flex-basis: 100%; }
  .busca label { max-width: none; }
  .times { grid-template-columns: minmax(0, 1fr); }
  .resultado { font-size: 3rem; }
  .placar { font-size: var(--t-xl); }
  .veredito { grid-template-columns: minmax(0, 1fr); padding: 20px; }
  .carimbo { font-size: 1.35rem; top: 12px; right: 12px; }
  .dossie { padding: 16px; }
  .dossie-topo { grid-template-columns: auto minmax(0, 1fr); }
  .dossie-topo .nota { grid-column: 1 / -1; justify-items: start; text-align: left; display: flex; gap: 10px; align-items: baseline; }
  .comparativo .linha { grid-template-columns: minmax(0, 1fr); gap: 6px; }
  .bloco-cab h2 { font-size: 2rem; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* diagnóstico e ameaças */
.diagnostico { padding: 14px 16px; border-radius: 8px; background: var(--gold-wash); border: 1px solid color-mix(in srgb, var(--gold) 30%, transparent); font-size: var(--t-md); line-height: 1.55; }
.diagnostico strong { color: var(--gold); }
.ameacas ul { display: grid; gap: 10px; }
.ameacas li { display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 12px; align-items: start; }
.ameaca-corpo { display: grid; gap: 4px; min-width: 0; }
.ameaca-cab { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px; font-size: var(--t-sm); }
.ameaca-cab span { color: var(--muted); }
.ameacas .barra { height: 6px; }
.ameacas .barra-fill { height: 6px; }
.barra-fill.eles { background: var(--eles); }
.ameacas .evid { font-size: var(--t-xs); color: var(--muted); }
.ameaca-itens { display: flex; flex-wrap: wrap; gap: 4px; }
.observacoes li { font-size: var(--t-sm); color: var(--ink-2); padding: 5px 0 5px 18px; position: relative; border-top: 1px solid var(--line); }
.observacoes li:first-child { border-top: 0; }
.observacoes li::before { content: "›"; position: absolute; left: 4px; color: var(--gold); font-weight: 700; }
.itens-deles { padding: 16px 18px; display: grid; gap: 10px; }
.itens-deles h3 { font-size: var(--t-sm); text-transform: uppercase; letter-spacing: 0.06em; color: var(--eles); }
.itens-deles li { display: grid; grid-template-columns: 48px minmax(0, 1fr); gap: 10px; font-size: var(--t-sm); padding: 4px 0; }
.itens-deles .t { font-family: var(--font-mono); color: var(--muted); }

/* momentos: manchete e grade de presença */
.manchete { font-size: var(--t-md); line-height: 1.5; }
.grade { display: grid; gap: 4px; overflow-x: auto; }
.grade-linha { display: grid; grid-template-columns: minmax(84px, 1.4fr) repeat(var(--cols), minmax(42px, 1fr)) minmax(54px, 1fr); gap: 4px; align-items: center; }
.grade-linha.cab span { font-family: var(--font-mono); font-size: var(--t-xs); color: var(--muted); text-align: center; padding-bottom: 4px; border-bottom: 2px solid var(--line); }
.grade-linha.cab .col-luta.perdeu { border-bottom-color: var(--eles); }
.grade-linha.cab .col-luta.venceu { border-bottom-color: var(--nos); }
.nome-grade { font-size: var(--t-sm); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cel { text-align: center; font-size: 15px; line-height: 26px; border-radius: 6px; background: var(--surface-2); }
.cel.presente { color: var(--nos); }
.cel.morreu { color: var(--eles); background: var(--eles-wash); font-weight: 700; }
.cel.ausente { color: var(--muted); }
.cel.pick { font-size: var(--t-sm); color: var(--muted); }
.cel.pick.tem { color: var(--eles); background: var(--eles-wash); font-weight: 700; }
.legenda-grade { font-size: var(--t-xs); color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips .chip { white-space: normal; }
.momento details.mais li { font-size: var(--t-xs); }

/* tribunal em formato de parecer */
.ranking-texto { padding: 6px 16px; }
.ranking-texto button { width: 100%; display: grid; grid-template-columns: 28px 32px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 0; border: 0; border-top: 1px solid var(--line); background: transparent; cursor: pointer; text-align: left; }
.ranking-texto li:first-child button { border-top: 0; }
.ranking-texto .pos { font-family: var(--font-display); font-weight: 800; font-size: var(--t-lg); color: var(--muted); }
.ranking-texto li.e-culpado .pos { color: var(--eles); }
.ranking-texto .quem { display: grid; min-width: 0; }
.ranking-texto .quem strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ranking-texto .quem span { color: var(--muted); font-size: var(--t-xs); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ranking-texto .fatia { font-weight: 600; font-size: var(--t-lg); text-align: right; display: grid; line-height: 1.1; }
.ranking-texto .fatia small { font-size: var(--t-xs); color: var(--muted); font-weight: 400; }
.parecer { font-size: var(--t-lg); line-height: 1.5; max-width: 75ch; }
.coach { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 16px; }
.coach-col { padding: 14px 16px; border-radius: 8px; background: var(--surface-2); border-top: 3px solid var(--line-strong); }
.coach-col.ruim { border-top-color: var(--eles); }
.coach-col.bom { border-top-color: var(--good); }
.coach-col.plano { border-top-color: var(--gold); }
.pontos { display: grid; gap: 8px; font-size: var(--t-sm); line-height: 1.5; }
ul.pontos li { padding-left: 16px; position: relative; }
ul.pontos li::before { content: "•"; position: absolute; left: 2px; color: var(--muted); }
ol.pontos { list-style: decimal; padding-left: 20px; }
ol.pontos li::marker { color: var(--gold); font-weight: 700; }
.build-texto .t { font-family: var(--font-mono); color: var(--muted); }
details.detalhes summary { cursor: pointer; color: var(--ink-2); font-size: var(--t-sm); padding: 6px 0; }
.detalhes-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 20px; margin-top: 12px; }
.detalhes-grid .pontos { line-height: 1.6; }
.detalhes-largo { grid-column: 1 / -1; }
.leitura-build { padding: 14px 18px; border-radius: 8px; background: var(--surface-2); border-left: 3px solid var(--gold); display: grid; gap: 8px; max-width: 80ch; }
.leitura-build h4 { font-size: var(--t-sm); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.leitura-build p { line-height: 1.6; }
.ordem-build { display: flex; flex-wrap: wrap; gap: 8px; counter-reset: none; }
.ordem-build li { display: inline-grid; grid-template-columns: auto auto; grid-template-rows: auto auto; column-gap: 8px; align-items: center; padding: 6px 10px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--line); font-size: var(--t-sm); }
.ordem-build li .icone-item { grid-row: 1 / 3; width: 32px; height: 24px; }
.ordem-build li small { color: var(--muted); font-size: var(--t-xs); }
.ordem-build li.selo-tarde { border-color: var(--eles); }
.ordem-build li.selo-tarde small { color: var(--eles); }
.ordem-build li.selo-bom { border-color: var(--good); }

/* ficha de RPG */
.ficha-e-parecer { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 20px; align-items: center; }
.ficha { display: grid; justify-items: center; gap: 2px; padding: 12px 10px 4px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); }
.ficha .classe { font-family: var(--font-display); font-weight: 800; font-size: var(--t-xl); line-height: 1; text-transform: uppercase; color: var(--eles); text-align: center; }
.ficha-svg svg { display: block; max-width: 100%; height: auto; overflow: visible; }
.rpg-rotulo { font-size: 11px; fill: var(--ink-2); }
.rpg-nome { font-family: var(--font-body); }
.rpg-valor { font-family: var(--font-mono); font-weight: 600; fill: var(--ink); }
@media (max-width: 640px) { .ficha-e-parecer { grid-template-columns: minmax(0, 1fr); } }

/* figurinhas */
.figurinhas { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 205px), 1fr)); gap: 12px; }
.figurinha { padding: 14px; display: grid; gap: 10px; align-content: start; position: relative; border-width: 2px; background: linear-gradient(180deg, var(--surface-2), var(--surface) 45%); }
.figurinha.e-culpado { border-color: var(--eles); box-shadow: 0 0 0 1px var(--eles-wash), var(--shadow); }
.fig-topo { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: var(--t-xs); color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
.figurinha.e-culpado .fig-culpa { color: var(--eles); font-weight: 600; }
.fig-id { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: center; }
.fig-id h3 { font-size: var(--t-md); line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fig-id > div { min-width: 0; }
.fig-id p { color: var(--muted); font-size: var(--t-xs); }
.fig-classe { font-family: var(--font-display); font-weight: 800; font-size: 1.3rem; line-height: 1; text-transform: uppercase; color: var(--gold); }
.figurinha.e-culpado .fig-classe { color: var(--eles); }
.mini-wrap { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 10px; align-items: center; }
.mini-wrap svg { display: block; max-width: 100%; height: auto; }
.mini-attrs { display: grid; gap: 4px; font-size: var(--t-xs); }
.mini-attrs li { display: flex; justify-content: space-between; gap: 8px; color: var(--ink-2); }
.mini-attrs b { font-family: var(--font-mono); color: var(--ink); }
.fig-zoeira { font-style: italic; color: var(--ink); font-size: var(--t-sm); line-height: 1.45; }
.fig-linha { font-size: var(--t-sm); line-height: 1.45; color: var(--ink-2); }
.fig-linha strong { color: var(--ink); }
.fig-linha.bom strong { color: var(--good-ink); }
.fig-linha.ruim strong { color: var(--bad-ink); }
.fig-linha.plano strong { color: var(--gold); }
.fig-ver { justify-self: start; margin-top: 2px; background: none; border: 0; padding: 0; color: var(--ink-2); font-size: var(--t-xs); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }

/* veredito simples ou dividido */
.veredito { grid-template-columns: minmax(0, 1fr); gap: 14px; }
.veredito-titulo { padding-right: 160px; }
.reus { display: grid; gap: 24px; }
.veredito.dividido .reus { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.reu { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 18px; align-items: start; min-width: 0; }
.veredito.dividido .reu + .reu { border-left: 1px solid var(--line); padding-left: 24px; }
.veredito.dividido h3 { font-size: var(--t-xl); }
.veredito.dividido .frase { font-size: var(--t-md); }
@media (max-width: 860px) {
  .veredito.dividido .reus { grid-template-columns: minmax(0, 1fr); }
  .veredito.dividido .reu + .reu { border-left: 0; padding-left: 0; border-top: 1px solid var(--line); padding-top: 20px; }
  .veredito-titulo { padding-right: 120px; }
}

/* fase de rotas */
.lanes { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 16px; }
.lane { padding: 16px 18px; display: grid; gap: 14px; border-top-width: 3px; }
.lane.ganhou { border-top-color: var(--nos); }
.lane.perdeu { border-top-color: var(--eles); }
.lane-cab { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.selo { font-family: var(--font-display); font-weight: 800; font-size: 1.35rem; line-height: 1; text-transform: uppercase; letter-spacing: 0.04em; padding: 4px 10px 2px; border-radius: 6px; border: 2px solid currentColor; }
.selo.ganhou { color: var(--nos); }
.selo.perdeu { color: var(--eles); }
.selo.empate { color: var(--muted); }
.confronto { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 10px; align-items: center; }
.confronto .vs { font-family: var(--font-display); font-weight: 800; color: var(--muted); font-size: var(--t-lg); }
.lado { display: grid; gap: 8px; min-width: 0; }
.lado.eles .heroi-rota { grid-template-columns: minmax(0, 1fr) 32px; text-align: right; }
.lado.eles .heroi-rota .retrato { order: 2; }
.heroi-rota { display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 8px; align-items: center; }
.heroi-rota span { display: grid; min-width: 0; }
.heroi-rota strong { font-size: var(--t-sm); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.heroi-rota small { font-size: var(--t-xs); color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lado.nos strong { color: var(--nos); }
.lado.eles strong { color: var(--eles); }
.cabo { display: flex; gap: 3px; height: 10px; }
.cabo .n { background: var(--nos); border-radius: 5px 0 0 5px; }
.cabo .e { background: var(--eles); border-radius: 0 5px 5px 0; }
.placares { display: grid; gap: 4px; }
.placar-rota { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; font-variant-numeric: tabular-nums; font-size: var(--t-sm); color: var(--ink-2); }
.placar-rota span:first-child { text-align: left; }
.placar-rota span:last-child { text-align: right; }
.placar-rota .rot { color: var(--muted); font-size: var(--t-xs); text-transform: uppercase; letter-spacing: 0.06em; font-family: var(--font-mono); align-self: center; }
.placar-rota .vence { color: var(--ink); font-weight: 700; }
.placar-rota .rot { display: grid; justify-items: center; text-align: center; }
.placar-rota .rot small { text-transform: none; letter-spacing: 0; font-family: var(--font-body); font-size: var(--t-xs); color: var(--muted); opacity: 0.85; }
.lane-frase { font-size: var(--t-sm); color: var(--ink-2); border-top: 1px solid var(--line); padding-top: 10px; }

/* dicas de rota */
.lane-dicas { display: grid; gap: 8px; font-size: var(--t-sm); line-height: 1.45; color: var(--ink-2); }
.lane-dicas li { padding-left: 16px; position: relative; }
.lane-dicas li::before { content: "›"; position: absolute; left: 3px; font-weight: 700; color: var(--bad-ink); }
.lane-dicas li.bom::before { content: "✓"; left: 1px; color: var(--good-ink); }
.lane-dicas strong { color: var(--ink); }

/* itens do time */
.debates { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 360px), 1fr)); gap: 16px; }
.debate { padding: 18px; display: grid; gap: 12px; align-content: start; }
.debate-cab { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: center; }
.debate-cab h3 { font-family: var(--font-display); font-weight: 800; font-size: var(--t-xl); line-height: 1; text-transform: uppercase; color: var(--eles); }
.debate-veredito { padding: 12px 14px; border-radius: 8px; background: var(--gold-wash); border: 1px solid color-mix(in srgb, var(--gold) 30%, transparent); font-size: var(--t-sm); font-weight: 600; line-height: 1.45; }
.plano-time { padding: 16px 18px; display: grid; gap: 10px; }
.plano-time h3 { font-size: var(--t-sm); text-transform: uppercase; letter-spacing: 0.06em; color: var(--gold); }
.plano-time ol { display: grid; gap: 0; }
.plano-time li { display: grid; grid-template-columns: 52px minmax(0, 0.8fr) minmax(0, 1.6fr) auto; gap: 12px; align-items: center; padding: 9px 0; border-top: 1px solid var(--line); }
.plano-time li:first-child { border-top: 0; }
.pos-chip { font-family: var(--font-mono); font-size: var(--t-xs); color: var(--muted); text-transform: uppercase; }
.plano-time .quem, .plano-time .item { display: grid; min-width: 0; }
.plano-time .item { grid-template-columns: auto minmax(0, 1fr); column-gap: 8px; align-items: center; }
.plano-time .item .icone-item { grid-row: span 2; }
.plano-time small { color: var(--muted); font-size: var(--t-xs); overflow: hidden; text-overflow: ellipsis; }
.plano-time .ate { font-family: var(--font-mono); font-size: var(--t-xs); color: var(--gold); white-space: nowrap; }
@media (max-width: 640px) {
  .plano-time li { grid-template-columns: 44px minmax(0, 1fr); }
  .plano-time .item, .plano-time .ate { grid-column: 2; }
}

/* conta da culpa: pontos por cenário */
.conta-culpa { display: grid; gap: 8px; font-size: var(--t-sm); line-height: 1.5; }
.conta-culpa li { display: grid; grid-template-columns: 3.2em minmax(0, 1fr); gap: 10px; align-items: baseline; }
.conta-culpa .pts { font-family: var(--font-mono); font-weight: 700; text-align: right; color: var(--eles); font-variant-numeric: tabular-nums; }
.conta-culpa li.credito .pts { color: var(--good); }
.nota-culpa { margin-top: 8px; font-size: var(--t-xs); color: var(--muted); max-width: 75ch; }

/* a história da partida */
.historia { display: grid; gap: 0; padding: 4px 20px; counter-reset: cap; }
.historia .cap { padding: 16px 0 16px 18px; border-top: 1px solid var(--line); position: relative; display: grid; gap: 4px; }
.historia .cap:first-child { border-top: 0; }
.historia .cap::before { content: ""; position: absolute; left: 0; top: 20px; bottom: 20px; width: 3px; border-radius: 2px; background: var(--line-strong); }

.historia .cap.cap-ganhou::before { background: var(--nos); }
.historia .cap h3 { font-size: var(--t-md); line-height: 1.3; }
.historia .cap p:last-child { line-height: 1.6; max-width: 80ch; }

<script>
/* Quem é o Culpado? — motor de análise de partidas de Dota 2.
 *
 * Funções puras sobre o JSON do OpenDota (/api/matches/{id}) e suas constantes.
 * Roda no navegador (window.CulpadoEngine) e no Node (require) para testes.
 * O índice de culpa replica culpado/blame.py para que painel e chat concordem.
 */
(function (root, factory) {
  const api = factory();
  if (typeof module === 'object' && module.exports) module.exports = api;
  else root.CulpadoEngine = api;
})(typeof globalThis !== 'undefined' ? globalThis : this, function () {
  'use strict';

  const THROW_LEAD = 2000; // vantagem de ouro para uma morte contar como "jogando fora"
  const LATE = 30 * 60;
  const JANELA = 5; // minutos de cada janela de "momento decisivo"
  const MIN_JOGOS = 30; // amostra mínima para citar taxa de vitória por horário de item
  const DIF_TIMING = 0.07; // diferença de taxa de vitória para chamar um horário de bom ou atrasado

  const CONSUMIVEIS = new Set([
    'tpscroll', 'ward_observer', 'ward_sentry', 'ward_dispenser', 'smoke_of_deceit', 'dust', 'clarity',
    'flask', 'tango', 'tango_single', 'enchanted_mango', 'faerie_fire', 'blood_grenade', 'tome_of_knowledge',
    'cheese', 'aegis', 'refresher_shard', 'famango', 'great_famango', 'greater_famango', 'royal_jelly', 'bottle',
  ]);
  // Itens ativos que salvam o dono numa luta: morrer com um deles sem ativar é prova.
  const ITENS_SALVAMENTO = new Set([
    'black_king_bar', 'glimmer_cape', 'force_staff', 'hurricane_pike', 'cyclone', 'wind_waker', 'ghost',
    'lotus_orb', 'manta', 'satanic', 'ethereal_blade',
  ]);
  // Itens finais que não têm receita mas encerram a build de muita gente.
  const FINAIS_SEM_RECEITA = new Set(['blink', 'ghost', 'aghanims_shard']);
  const HEROIS_INVISIVEIS = new Set([32, 56, 62, 63, 88]); // Riki, Clinkz, Bounty Hunter, Weaver, Nyx Assassin
  const ITENS_INVIS = new Set(['invis_sword', 'silver_edge']);
  const ITENS_CORTE_CURA = new Set(['spirit_vessel', 'skadi', 'shivas_guard']);

  // Índice de culpa em pontos de impacto (= culpado/blame.py). 1 ponto = 100 de ouro que o jogador
  // custou ao time em um cenário comum de Dota; créditos (rota ganha, abates) abatem até 65% da culpa.
  const CULPA = {
    escala: 100, rotaMin: 10, rotaMult: 1.5, rotaCredito: 0.5, rotaEsperado: { safe: 200, off: -200, mid: 0 }, xpPeso: 0.5,
    rotacaoAte: 12 * 60, rotacaoFracao: 0.5, snowballAbates: 5, snowballAte: 25 * 60, snowballExtra: 0.3,
    pickoffExtra: 0.25, pickoffJanela: 20, throwLead: 2000, throwExtra: 0.5, troca: 0.6,
    objetivos: { tower1: 300, tower2: 500, tower3: 700, tower4: 600, melee_rax: 900, range_rax: 600 }, roshan: 800,
    ausencia: 400, creditoAbates: 0.25, creditoMax: 0.65,
    rotaTolerancia: 400, expForca: 4000, expMatchup: 12000, matchupPrior: 50,
  };

  // Vitória em jogos curtos (até 25 min) menos vitória em jogos longos (40+ min): positivo = forte cedo.
  function forcaCedo(rows) {
    if (!Array.isArray(rows) || !rows.length) return 0;
    const wr = (f) => {
      const xs = rows.filter((x) => f(Number(x.duration_bin) || 0));
      const g = soma(xs, (x) => x.games_played);
      return [g ? soma(xs, (x) => x.wins) / g : 0, g];
    };
    const [curto, gc] = wr((b) => b <= 1500);
    const [longo, gl] = wr((b) => b >= 2400);
    return gc >= 200 && gl >= 200 ? curto - longo : 0;
  }
  // Vitória do herói a contra b, puxada para 50% quando a amostra é pequena (null sem dado).
  function matchupDe(ctxDados, a, b) {
    for (const [x, y, inv] of [[a, b, false], [b, a, true]]) {
      const lista = (ctxDados.matchups || {})[x] || (ctxDados.matchups || {})[String(x)];
      for (const row of (Array.isArray(lista) ? lista : [])) {
        if (row.hero_id === y) {
          const g = Number(row.games_played) || 0;
          const w = Number(row.wins) || 0;
          const v = (w + CULPA.matchupPrior / 2) / (g + CULPA.matchupPrior);
          return inv ? 1 - v : v;
        }
      }
    }
    return null;
  }
  // O que a rota prometia aos 10 min (patrimônio + XP/2, média por herói) e por quê.
  function expectativaDaRota(ctxDados, nossos, deles, tipo) {
    const dur = ctxDados.duracoes || {};
    const fDe = (p) => forcaCedo(dur[p.heroi.id] || dur[String(p.heroi.id)]);
    const fNos = soma(nossos, fDe) / nossos.length;
    const fEles = soma(deles, fDe) / deles.length;
    const pares = [];
    for (const a of nossos) for (const b of deles) { const m = matchupDe(ctxDados, a.heroi.id, b.heroi.id); if (m != null) pares.push({ a, b, m }); }
    const mu = pares.length ? soma(pares, (x) => x.m) / pares.length : 0.5;
    const esperado = CULPA.rotaEsperado[tipo] + CULPA.expForca * (fNos - fEles) + CULPA.expMatchup * (mu - 0.5);
    // os fatores que mais pesaram, em palavras
    const fatores = [];
    for (const p of nossos) { const f = fDe(p); if (f <= -0.07) fatores.push(`${p.heroi.nome} é herói de jogo longo, vence bem menos em partidas curtas`); }
    for (const p of deles) { const f = fDe(p); if (f >= 0.05) fatores.push(`${p.heroi.nome} é forte cedo`); }
    for (const x of [...pares].sort((u, v) => Math.abs(v.m - 0.5) - Math.abs(u.m - 0.5)).slice(0, 2)) {
      if (x.m <= 0.47) fatores.push(`${x.a.heroi.nome} vence só ${pct(x.m)} contra ${x.b.heroi.nome}`);
      else if (x.m >= 0.53) fatores.push(`${x.a.heroi.nome} vence ${pct(x.m)} contra ${x.b.heroi.nome}`);
    }
    for (const p of deles) { const f = fDe(p); if (f <= -0.07) fatores.push(`${p.heroi.nome}, do lado deles, é de jogo longo`); }
    const lado = Math.abs(esperado) < 150 ? 'equilibrada' : esperado < 0 ? 'desfavorável' : 'favorável';
    const quanto = Math.abs(esperado) < 150 ? '' : `: o esperado era sair uns ${fmtK(Math.abs(Math.round(esperado / 10) * 10))} ${esperado < 0 ? 'atrás' : 'na frente'} aos 10 min`;
    const texto = `No papel, rota ${lado}${fatores.length ? ` (${fatores.slice(0, 3).join('; ')})` : ''}${quanto}.`;
    return { esperado, fNos, fEles, mu, fatores, lado, texto, curto: `No papel: ${lado}${Math.abs(esperado) < 150 ? '' : ` · esperado ${esperado < 0 ? '−' : '+'}${fmtK(Math.abs(Math.round(esperado / 10) * 10))}`}` };
  }
  const esperadoTxt = (esperado) => (Math.abs(esperado) < 150 ? 'no papel era rota equilibrada' : `pelo matchup, o esperado era uns ${fmtK(Math.abs(Math.round(esperado / 10) * 10))} ${esperado < 0 ? 'atrás' : 'na frente'}`);
  const tempoMorte = (t) => (t < 600 ? 0.6 : t < 1200 ? 1.3 : 1.0);
  const ouroEstimado = (t) => 150 + (10 * t) / 60;

  const LABELS = {
    rota: 'Rota perdida',
    rotacoes: 'Mid deles rotacionou livre',
    mortes: 'Ouro entregue morrendo',
    snowball: 'Alimentou quem disparou',
    pickoff: 'Pego sozinho',
    throw: 'Morreu com o jogo ganho',
    objetivos: 'Morto quando caíram objetivos',
    ausencia: 'Fora das lutas perdidas',
    farm: 'Farm abaixo do herói',
    dano: 'Pouco dano para o herói',
    visao: 'Pouca visão',
    participacao: 'Pouca participação nos abates',
    credito_rota: 'Ganhou a rota',
    credito_abates: 'Abates que fez',
  };

  const ZOEIRAS = {
    rota: 'perdeu a rota antes do primeiro Bounty',
    rotacoes: 'deixou o mid deles passear pelo mapa',
    mortes: 'virou patrocinador oficial do time adversário',
    snowball: 'criou o monstro que matou o time',
    pickoff: 'andava sozinho como se tivesse Aegis',
    throw: 'recebeu o jogo ganho e devolveu com juros',
    objetivos: 'assistiu às torres caírem da tela cinza',
    ausencia: 'esteve presente nas lutas só em espírito',
    farm: 'farm de suporte jogando de core',
    dano: 'batia com a força de uma folha caindo',
    visao: 'jogou o mapa inteiro no escuro',
    participacao: 'esteve presente nas lutas só em espírito',
  };

  // ---------------------------------------------------------------- utilidades

  const clamp = (x) => Math.max(0, Math.min(1, x));
  const soma = (arr, f = (x) => x) => arr.reduce((a, x) => a + (Number(f(x)) || 0), 0);
  const fatia = (v, total) => (total ? v / total : 0);
  const notaFatia = (s) => clamp((s - 0.12) / 0.28); // 1/5 (a parte justa) ~0.3; 40% ou mais = 1
  const mmss = (t) => {
    const s = Math.round(t);
    const a = Math.abs(s);
    return `${s < 0 ? '-' : ''}${Math.floor(a / 60)}:${String(a % 60).padStart(2, '0')}`;
  };
  const fmtInt = (n) => Math.round(n).toLocaleString('pt-BR');
  const fmtK = (n) => {
    const a = Math.abs(n);
    if (a >= 1000) return `${(n / 1000).toLocaleString('pt-BR', { maximumFractionDigits: 1 })}k`;

  const pct = (x) => `${Math.round(x * 100)}%`;
  const plural = (n, um, varios) => `${n} ${n === 1 ? um : varios}`;
  const ehRadiant = (p) => (typeof p.isRadiant === 'boolean' ? p.isRadiant : p.player_slot < 128);
  const prettyKey = (k) => String(k).replace(/_/g, ' ').replace(/\b\w/g, (c) => c.toUpperCase());

  function heroInfo(heroes, id, raw) {
    const h = (heroes && (heroes[id] || heroes[String(id)])) || null;
    return {
      id: Number(id) || 0,
      nome: (h && h.localized_name) || (raw && raw.hero_localized_name) || `Herói #${id}`,
      npc: (h && h.name) || (raw && raw.hero_name) || null,
      img: (h && h.img) || null,
      icon: (h && h.icon) || null,
      atributo: (h && h.primary_attr) || null,
      ataque: (h && h.attack_type) || null,
    };
  }

  function itemInfo(items, key) {
    const it = (items && items[key]) || null;
    return {
      key,
      nome: (it && it.dname) || prettyKey(key),
      custo: it && typeof it.cost === 'number' ? it.cost : null,
      componentes: (it && it.components) || null,
      img: (it && it.img) || null,
    };
  }

  // ---------------------------------------------------------------- jogadores

  function montarJogadores(match, heroes, amigos) {
    const raw = match.players || [];
    const npcParaIdx = {};
    const jog = raw.map((p, i) => {
      const heroi = heroInfo(heroes, p.hero_id, p);
      if (heroi.npc) npcParaIdx[heroi.npc] = i;
      return {
        idx: i,
        slot: p.player_slot,
        radiant: ehRadiant(p),
        conta: p.account_id == null ? null : p.account_id,
        nome: (amigos && p.account_id != null && amigos[p.account_id]) || p.personaname || p.name || 'Anônimo',
        heroi,
        raw: p,
      };
    });
    return { jog, npcParaIdx };
  }

  function timelineMortes(raw, npcParaIdx) {
    if (raw.length && raw.every((p) => Array.isArray(p.deaths_log))) {
      return raw.map((p) =>
        p.deaths_log
          .map((d) => ({
            t: Number(d.time) || 0,
            assassino: d.key in npcParaIdx ? npcParaIdx[d.key] : null,
            assassinoKey: d.key || null,
            ouro: d.gold_fed == null ? null : Number(d.gold_fed),

      );
    }
    if (!raw.some((p) => p.kills_log && p.kills_log.length) || Object.keys(npcParaIdx).length < raw.length) return null;
    const out = raw.map(() => []);
    raw.forEach((killer, k) =>
      (killer.kills_log || []).forEach((ev) => {
        const v = npcParaIdx[ev.key];
        if (v != null) out[v].push({ t: Number(ev.time) || 0, assassino: k, assassinoKey: null, ouro: null, morto: null });
      }),
    );
    out.forEach((l) => l.sort((a, b) => a.t - b.t));
    return out;
  }

  function nomeAssassino(morte, jog) {
    if (morte.assassino != null) return jog[morte.assassino].heroi.nome;
    const k = morte.assassinoKey || '';
    if (k.includes('fountain')) return 'a fonte';
    if (k.includes('tower') || k.includes('fort')) return 'torre';
    if (k.includes('roshan')) return 'Roshan';
    if (k.includes('neutral')) return 'neutros';
    if (k.includes('creep') || k.includes('siege')) return 'creeps';
    return k ? prettyKey(k.replace('npc_dota_', '')) : 'desconhecido';
  }

  function atribuirFuncoes(time) {
    const est = time.map((p) => p.raw.position_est);
    const validos = est.filter((e) => e).sort((a, b) => a - b);
    const permutacao = validos.length === time.length && validos.every((e, i) => e === i + 1);
    if (permutacao) {
      time.forEach((p, i) => { p.posicao = est[i]; });
    } else {
      [...time]
        .sort((a, b) => (b.raw.gold_per_min || 0) - (a.raw.gold_per_min || 0) || (b.raw.last_hits || 0) - (a.raw.last_hits || 0))
        .forEach((p, i) => { p.posicao = i + 1; });
    }
    time.forEach((p) => { p.funcao = p.posicao <= 3 ? 'core' : 'suporte'; });
  }

  // ---------------------------------------------------------------- lutas e linha do tempo

  function analisarLutas(match, jog, ladoRadiant) {
    return (match.teamfights || [])
      .map((f, n) => {
        const fp = f.players || [];
        if (fp.length !== jog.length) return null;
        let nos = 0;
        let eles = 0;
        let mortesNos = 0;
        let mortesEles = 0;
        fp.forEach((x, i) => {
          if (jog[i].radiant === ladoRadiant) {
            nos += x.gold_delta || 0;
            mortesNos += x.deaths || 0;
          } else {
            eles += x.gold_delta || 0;
            mortesEles += x.deaths || 0;
          }
        });
        return {
          n,
          inicio: f.start,
          fim: f.end,
          saldoNos: nos,
          saldoEles: eles,
          mortesNos,
          mortesEles,
          resultado: nos > eles ? 'venceu' : nos < eles ? 'perdeu' : 'empate',
          swing: nos - eles, // positivo = bom para nós
          jogadores: fp,
        };
      })
      .filter(Boolean);
  }

  const presenteNaLuta = (x) =>
    (x.damage || 0) > 0 || (x.healing || 0) > 0 || (x.deaths || 0) > 0 ||
    Object.keys(x.ability_uses || {}).length > 0 || Object.keys(x.item_uses || {}).length > 0 ||
    Object.keys(x.killed || {}).length > 0;

  function descreverEstrutura(key) {
    const k = key || '';
    let tipo = 'estrutura';
    let nome = 'estrutura';
    const lane = k.includes('_top') ? 'do topo' : k.includes('_mid') ? 'do meio' : k.includes('_bot') ? 'de baixo' : '';
    const tier = (k.match(/tower(\d)/) || [])[1];
    let artigo = 'a';
    if (k.includes('tower')) { tipo = 'torre'; nome = tier === '4' ? 'torre T4' : `torre T${tier} ${lane}`.trim(); }
    else if (k.includes('rax')) { tipo = 'quartel'; artigo = 'o'; nome = `quartel ${k.includes('melee') ? 'corpo a corpo' : 'à distância'} ${lane}`.trim(); }
    else if (k.includes('fort')) { tipo = 'ancestral'; artigo = 'o'; nome = 'Ancestral'; }
    return { tipo, nome, artigo, deRadiant: k.includes('goodguys') };
  }

  function eventosObjetivos(match, jog, npcParaIdx, ladoRadiant) {
    const ev = [];
    const quem = (o) => {
      if (o.player_slot != null) {
        const j = jog.find((p) => p.slot === o.player_slot);
        if (j) return j;
      }
      if (o.unit && o.unit in npcParaIdx) return jog[npcParaIdx[o.unit]];
      return null;
    };
    for (const o of match.objectives || []) {
      const t = Number(o.time) || 0;
      if (o.type === 'building_kill') {
        const est = descreverEstrutura(o.key);
        const nossa = est.deRadiant === ladoRadiant;
        const autor = quem(o);
        const dono = nossa ? 'de vocês' : 'deles';
        const verbo = est.tipo === 'ancestral' ? 'destruiu' : 'derrubou';
        const texto = autor
          ? `${autor.heroi.nome} ${verbo} ${est.artigo} ${est.nome} ${dono}`
          : `${est.artigo.toUpperCase()} ${est.nome} ${dono} caiu para os creeps`;
        ev.push({ t, tipo: est.tipo, favor: nossa ? 'eles' : 'nos', texto });
      } else if (o.type === 'CHAT_MESSAGE_FIRSTBLOOD') {
        const autor = quem(o);
        const vit = jog.find((p) => p.slot === o.victim_player_slot);
        const favor = autor ? (autor.radiant === ladoRadiant ? 'nos' : 'eles') : 'neutro';
        ev.push({ t, tipo: 'primeiro_sangue', favor, texto: `Primeiro sangue: ${autor ? autor.heroi.nome : '?'} matou ${vit ? vit.nome : '?'}` });
      } else if (o.type === 'CHAT_MESSAGE_MINIBOSS_KILL') {
        const radiantTeam = o.team === 2;
        ev.push({ t, tipo: 'tormentor', favor: radiantTeam === ladoRadiant ? 'nos' : 'eles', texto: `${radiantTeam === ladoRadiant ? 'Vocês' : 'Eles'} mataram o Tormentor` });
      } else if (o.type === 'CHAT_MESSAGE_ROSHAN_KILL') {
        const radiantTeam = o.team === 2;
        ev.push({ t, tipo: 'roshan', favor: radiantTeam === ladoRadiant ? 'nos' : 'eles', texto: `${radiantTeam === ladoRadiant ? 'Vocês' : 'Eles'} mataram o Roshan` });
      } else if (o.type === 'CHAT_MESSAGE_AEGIS') {
        const autor = quem(o);
        ev.push({ t, tipo: 'aegis', favor: autor && autor.radiant === ladoRadiant ? 'nos' : 'eles', texto: `${autor ? autor.heroi.nome : '?'} pegou o Aegis` });
      } else if (o.type === 'CHAT_MESSAGE_COURIER_LOST') {
        const radiantTeam = o.team === 2;
        ev.push({ t, tipo: 'courier', favor: radiantTeam === ladoRadiant ? 'eles' : 'nos', texto: `Courier ${radiantTeam === ladoRadiant ? 'de vocês' : 'deles'} morreu` });
      }
    }
    return ev.sort((a, b) => a.t - b.t);
  }

  // ---------------------------------------------------------------- itens

  function conjuntoComponentes(items) {
    const s = new Set();
    for (const k in items || {}) for (const c of (items[k] && items[k].components) || []) s.add(c);
    return s;
  }

  function ehItemDeBuild(key, items, componentes) {
    if (!key || key.startsWith('recipe_') || CONSUMIVEIS.has(key)) return false;
    const it = items && items[key];
    if (!it) return false;
    const custo = it.cost || 0;
    if (it.components && it.components.length) return custo >= 1000;
    if (FINAIS_SEM_RECEITA.has(key)) return true;
    return custo >= 2000 && !componentes.has(key);
  }

  function buildDe(p, items, componentes) {
    const log = p.raw.purchase_log || [];
    const virouOutro = (e, i) =>
      log.slice(i + 1).some((f) => Math.abs((f.time || 0) - (e.time || 0)) <= 5 && ((items[f.key] && items[f.key].components) || []).includes(e.key));
    return log
      .filter((e, i) => ehItemDeBuild(e.key, items, componentes) && !virouOutro(e, i))
      .map((e) => ({ t: Number(e.time) || 0, ...itemInfo(items, e.key) }));
  }

  // Intervalos em que o jogador tinha cada item de salvamento (até virar componente de outro).
  function posseDeItens(p, items) {
    const log = (p.raw.purchase_log || []).map((e) => ({ t: Number(e.time) || 0, key: e.key }));
    const posse = [];
    log.forEach((e, i) => {
      if (!ITENS_SALVAMENTO.has(e.key)) return;
      const fim = log.slice(i + 1).find((x) => ((items[x.key] && items[x.key].components) || []).includes(e.key));
      posse.push({ key: e.key, de: e.t, ate: fim ? fim.t : Infinity });
    });
    return posse;
  }

  function linhasTiming(timings, heroId, key) {
    const rows = ((timings && (timings[heroId] || timings[String(heroId)])) || [])
      .filter((r) => r.item === key)
      .map((r) => ({ ate: Number(r.time), jogos: Number(r.games) || 0, vitorias: Number(r.wins) || 0 }))
      .filter((r) => r.ate > 0)
      .sort((a, b) => a.ate - b.ate);
    return rows.map((r) => ({ ...r, wr: r.jogos ? r.vitorias / r.jogos : null }));
  }

  function horarioTipico(timings, heroId, key) {
    const rows = linhasTiming(timings, heroId, key);
    if (!rows.length || agregado(rows).jogos < MIN_JOGOS) return null;
    return [...rows].sort((a, b) => b.jogos - a.jogos)[0].ate;
  }

  function agregado(rows) {
    const jogos = soma(rows, (r) => r.jogos);
    const vitorias = soma(rows, (r) => r.vitorias);
    return { jogos, vitorias, wr: jogos ? vitorias / jogos : null };
  }

  function analisarTiming(jogador, compra, timings) {
    const rows = linhasTiming(timings, jogador.heroi.id, compra.key);
    if (!rows.length || agregado(rows).jogos < MIN_JOGOS) return null;
    const idx = rows.findIndex((r) => compra.t <= r.ate);
    const ultimo = rows[rows.length - 1];
    const heroi = jogador.heroi.nome;
    let veredito = 'neutro';
    let texto;
    if (idx === -1) {
      const todos = agregado(rows);
      veredito = 'atrasado';
      texto = `${compra.nome} aos ${mmss(compra.t)}. Quem joga de ${heroi} e fecha até ${mmss(ultimo.ate)} vence ${pct(todos.wr)} (${fmtInt(todos.jogos)} partidas); depois disso não há registro.`;
    } else {
      const minha = rows[idx];
      const antes = agregado(rows.slice(0, idx));
      const depois = agregado(rows.slice(idx + 1));
      const faixa = idx === 0 ? `até ${mmss(minha.ate)}` : `entre ${mmss(rows[idx - 1].ate)} e ${mmss(minha.ate)}`;
      const partes = [`${compra.nome} aos ${mmss(compra.t)}.`];
      if (minha.jogos >= MIN_JOGOS) partes.push(`Com ${heroi}, quem fecha ${faixa} vence ${pct(minha.wr)} (${fmtInt(minha.jogos)} partidas).`);
      if (antes.jogos >= MIN_JOGOS && minha.jogos >= MIN_JOGOS && antes.wr - minha.wr >= DIF_TIMING) {
        veredito = 'atrasado';
        partes.push(`Antes disso, ${pct(antes.wr)} (${fmtInt(antes.jogos)}).`);
      } else if (minha.jogos >= MIN_JOGOS && depois.jogos >= MIN_JOGOS && minha.wr - depois.wr >= DIF_TIMING) {
        veredito = 'bom';
        partes.push(`Mais tarde cai para ${pct(depois.wr)} (${fmtInt(depois.jogos)}).`);
      } else if (minha.jogos >= MIN_JOGOS && minha.wr >= agregado(rows).wr) {
        veredito = 'bom';
      }
      if (partes.length === 1) return null;
      texto = partes.join(' ');
    }
    return { item: compra.key, nome: compra.nome, t: compra.t, faixas: rows, faixaJogador: idx, veredito, texto };
  }

  function popularesDoHeroi(pop, itemIds, items, componentes, heroId) {
    const p = pop && (pop[heroId] || pop[String(heroId)]);
    if (!p) return null;
    const fase = (obj) =>
      Object.entries(obj || {})
        .map(([id, n]) => ({ key: itemIds[id] || itemIds[Number(id)], n: Number(n) || 0 }))
        .filter((x) => x.key && ehItemDeBuild(x.key, items, componentes))
        .sort((a, b) => b.n - a.n)
        .slice(0, 6)
        .map((x) => ({ ...itemInfo(items, x.key), n: x.n }));
    return { inicio: fase(p.early_game_items), meio: fase(p.mid_game_items), fim: fase(p.late_game_items) };
  }

  // ---------------------------------------------------------------- índice de culpa (= culpado/blame.py)

  function statsDoJogador(p, mortes, lutas, lead, resultadoRuim) {
    const r = p.raw;
    const bench = {};
    for (const [k, v] of Object.entries(r.benchmarks || {})) if (v && v.pct != null) bench[k] = Number(v.pct);
    const s = {
      kills: r.kills || 0, deaths: r.deaths || 0, assists: r.assists || 0,
      gpm: r.gold_per_min || 0, xpm: r.xp_per_min || 0, lastHits: r.last_hits || 0, denies: r.denies || 0,
      netWorth: r.net_worth || r.total_gold || 0, heroDamage: r.hero_damage || 0, towerDamage: r.tower_damage || 0,
      heroHealing: r.hero_healing || 0, level: r.level || 0, bench,
      timeDead: r.life_state_dead == null ? null : Number(r.life_state_dead),
      tfp: r.teamfight_participation == null ? null : Number(r.teamfight_participation),
      laneEff: r.lane_efficiency_pct == null ? null : Number(r.lane_efficiency_pct),
      obs: r.obs_placed == null ? null : Number(r.obs_placed),
      sen: r.sen_placed == null ? null : Number(r.sen_placed),
      stuns: r.stuns == null ? null : Number(r.stuns),
      buybacks: r.buyback_count == null ? null : Number(r.buyback_count),
      goldFed: Array.isArray(r.deaths_log) ? soma(r.deaths_log, (d) => d.gold_fed) : null,
      deathTimes: mortes ? mortes[p.idx].map((d) => d.t) : null,
      lateDeaths: null, deathsAhead: null, lostFightDeaths: null,
    };
    if (s.deathTimes) {
      s.lateDeaths = s.deathTimes.filter((t) => t >= LATE).length;
      if (lead) s.deathsAhead = s.deathTimes.filter((t) => { const m = Math.floor(t / 60); return m >= 0 && m < lead.length && lead[m] >= THROW_LEAD; }).length;
    }
    if (lutas.length) s.lostFightDeaths = soma(lutas.filter((l) => l.resultado === resultadoRuim), (l) => l.jogadores[p.idx].deaths);
    return s;
  }

  function laneDe(raw, radiant) {
    if (raw.lane >= 1 && raw.lane <= 3) return raw.lane;
    if (raw.lane_role === 2) return 2;
    if (raw.lane_role === 1) return radiant ? 1 : 3;
    if (raw.lane_role === 3) return radiant ? 3 : 1;
    return null;
  }

  function serie(raw, key, minuto) {
    const sr = raw[key] || (key === 'networth_t' ? raw.gold_t : null);
    if (!sr || !sr.length) return null;
    return Number(sr[Math.min(minuto, sr.length - 1)]);
  }

  // {idx: {chave: {ouro, infos[]}}} para o time julgado. Mesmas regras e mesma ordem de culpado/blame.py.
  function cenariosDeCulpa(ctx, match) {
    const C = CULPA;
    const { nos, eles, duracao } = ctx;
    const minutos = duracao / 60;
    const lead = ctx.lead || [];
    const acc = Object.fromEntries(nos.map((p) => [p.idx, {}]));
    const add = (i, k, ouro, info) => {
      const slot = acc[i][k] || (acc[i][k] = { ouro: 0, infos: [] });
      slot.ouro += ouro;
      if (info !== undefined) slot.infos.push(info);
    };
    const mortesDe = (i) => (ctx.mortes ? ctx.mortes[i] : []).map((d) => ({ ...d, ouro: d.ouro == null ? ouroEstimado(d.t) : d.ouro, morto: d.morto || 0 }));
    const nosIdx = nos.map((p) => p.idx);
    const elesIdx = eles.map((p) => p.idx);
    const lutas = (match.teamfights || []).filter((tf) => (tf.players || []).length >= 10 && tf.start != null).map((tf) => {
      const dn = soma(nosIdx, (i) => tf.players[i].deaths);
      const de = soma(elesIdx, (j) => tf.players[j].deaths);
      return { ini: tf.start - 10, fim: (tf.end ?? tf.start) + 10, start: tf.start, res: de > dn ? 'venceu' : dn > de ? 'perdeu' : 'empate', mortos: dn, players: tf.players };
    });
    const radiant = nos[0] ? nos[0].radiant : true;

    // rota (10 min)
    let deficitMid = 0;
    const midNos = nos.filter((p) => laneDe(p.raw, radiant) === 2).map((p) => p.idx);
    const midEles = eles.filter((p) => laneDe(p.raw, !radiant) === 2).map((p) => p.idx);
    for (const lane of [1, 2, 3]) {
      const a = nos.filter((p) => laneDe(p.raw, radiant) === lane);
      const b = eles.filter((p) => laneDe(p.raw, !radiant) === lane);
      if (!a.length || !b.length) continue;
      if ([...a, ...b].some((x) => serie(x.raw, 'networth_t', C.rotaMin) == null || serie(x.raw, 'xp_t', C.rotaMin) == null)) continue;
      const med = (xs, key) => soma(xs, (x) => serie(x.raw, key, C.rotaMin)) / xs.length;
      const nwDiff = med(a, 'networth_t') - med(b, 'networth_t');
      const xpDiff = med(a, 'xp_t') - med(b, 'xp_t');
      const diff = nwDiff + C.xpPeso * xpDiff;
      const tipo = lane === 2 ? 'mid' : a[0].raw.lane_role === 1 ? 'safe' : 'off';
      const { esperado } = expectativaDaRota(ctx.contexto || {}, a, b, tipo);
      const falta = esperado - diff; // positivo = pior do que o matchup pedia
      const d = (Math.max(0, falta - C.rotaTolerancia) - Math.max(0, -falta - C.rotaTolerancia)) * a.length;
      const cedo = Object.fromEntries(a.map((p) => [p.idx, mortesDe(p.idx).filter((x) => x.t < 600).length]));
      const w = Object.fromEntries(a.map((p) => [p.idx, 1 + 0.2 * cedo[p.idx]]));
      const sw = soma(Object.values(w));
      const rivais = b.map((x) => x.heroi.nome).join(' e ');
      for (const p of a) {
        if (d > 0) add(p.idx, 'rota', (C.rotaMult * d * w[p.idx]) / sw, { tipo, nwDiff, xpDiff, rivais, cedo: cedo[p.idx], esperado });
        else if (d < 0) add(p.idx, 'credito_rota', (-C.rotaCredito * -d * w[p.idx]) / sw, { tipo, nwDiff, xpDiff, rivais, esperado });
      }
      if (lane === 2) deficitMid = Math.max(d, 0);
    }

    if (ctx.mortes) {
      const abates20 = Object.fromEntries(elesIdx.map((j) => [j, soma(nosIdx, (i) => mortesDe(i).filter((x) => x.assassino === j && x.t < 1200).length)]));
      const disparou = new Set(elesIdx.filter((j) => abates20[j] >= C.snowballAbates));
      const todas = nosIdx.flatMap((i) => mortesDe(i).map((x) => ({ t: x.t, v: i })));
      for (const i of nosIdx) {
        for (const x of mortesDe(i)) {
          const luta = lutas.find((l) => l.ini <= x.t && x.t <= l.fim) || null;
          let base = x.ouro * tempoMorte(x.t) * (luta && luta.res === 'venceu' ? C.troca : 1);
          if (midEles.includes(x.assassino) && !midNos.includes(i) && x.t < C.rotacaoAte && deficitMid > 0 && midNos.length) {
            add(midNos[0], 'rotacoes', C.rotacaoFracao * base, { t: x.t, assassino: x.assassino, vitima: i });
            base *= 1 - C.rotacaoFracao;
          }
          add(i, 'mortes', base, x.t);
          if (disparou.has(x.assassino) && x.t < C.snowballAte) add(i, 'snowball', C.snowballExtra * base, x.assassino);
          const sozinho = x.t >= 600 && !luta && !todas.some((o) => Math.abs(o.t - x.t) <= C.pickoffJanela && !(o.t === x.t && o.v === i));
          if (sozinho) add(i, 'pickoff', C.pickoffExtra * base, x.t);
          const minuto = Math.floor(x.t / 60);
          if (minuto >= 0 && minuto < lead.length && lead[minuto] >= C.throwLead) add(i, 'throw', C.throwExtra * base, x.t);
        }
      }
      // objetivos que caíram com o jogador morto
      const meu = radiant ? 'goodguys' : 'badguys';
      const timeInimigo = radiant ? 3 : 2;
      for (const o of match.objectives || []) {
        let valor = 0;
        let nome = null;
        if (o.type === 'building_kill' && (o.key || '').includes(meu)) {
          const k = Object.keys(C.objetivos).find((x) => o.key.includes(x));
          if (k) { valor = C.objetivos[k]; nome = k.includes('rax') ? 'quartel' : 'torre'; }
        } else if (o.type === 'CHAT_MESSAGE_ROSHAN_KILL' && o.team === timeInimigo) {
          valor = C.roshan; nome = 'Roshan';
        }
        if (!valor) continue;
        const T = o.time || 0;
        const mortos = nosIdx.filter((i) => mortesDe(i).some((x) => x.t <= T && T < x.t + x.morto));
        for (const i of mortos) add(i, 'objetivos', valor / mortos.length, nome);
      }
      // vivo e fora de luta perdida
      for (const l of lutas) {
        if (l.res !== 'perdeu' || l.mortos < 3) continue;
        for (const p of nos) {
          const fp = l.players[p.idx];
          const mortoAntes = mortesDe(p.idx).some((x) => x.t <= l.start && l.start < x.t + x.morto);
          const usou = fp.ability_uses && Object.keys(fp.ability_uses).length;
          if (!fp.deaths && !mortoAntes && !fp.damage && !usou) add(p.idx, 'ausencia', C.ausencia * (p.posicao <= 3 ? 1.2 : 1), l.start);
        }
      }
      // créditos: ouro tirado do inimigo nos próprios abates
      for (const j of elesIdx) for (const x of mortesDe(j)) if (x.assassino in acc) add(x.assassino, 'credito_abates', -C.creditoAbates * x.ouro, 1);
    } else {
      const tMedio = duracao / 2;
      const totalAbates = soma(nos, (p) => p.raw.kills) || 1;
      for (const p of nos) {
        const s = p.stats;
        if (s.deaths) add(p.idx, 'mortes', s.deaths * ouroEstimado(tMedio), null);
        if (s.kills) add(p.idx, 'credito_abates', -C.creditoAbates * s.kills * ouroEstimado(tMedio), null);
        if (!lutas.length) {
          const kp = (s.kills + s.assists) / totalAbates;
          add(p.idx, 'participacao', Math.max(0, 0.55 - kp) * minutos * 40, kp);
        }
      }
    }

    // farm, dano (cores) e visão (suportes)
    const l20 = lead.length > 20 ? lead[20] : lead.length ? lead[lead.length - 1] : 0;
    const espaco = l20 <= -5000 ? 0.7 : l20 <= -2500 ? 0.85 : 1;
    for (const p of nos) {
      const s = p.stats;
      if (p.posicao <= 3) {
        let pc = s.bench.gold_per_min;
        if (pc != null) add(p.idx, 'farm', Math.max(0, 0.45 - pc) * 2 * minutos * 60 * ({ 1: 1, 2: 0.8, 3: 0.5 }[p.posicao] ?? 0.5) * espaco, { pc, espaco });
        pc = s.bench.hero_damage_per_min;
        if (pc != null) add(p.idx, 'dano', Math.max(0, 0.4 - pc) * 2 * minutos * 25 * espaco, { pc, espaco });
      } else if (s.obs != null && s.sen != null) {
        const wards = s.obs + s.sen;
        const esperado = Math.max(minutos * 0.35, 1);
        add(p.idx, 'visao', Math.max(0, 1 - wards / esperado) * minutos * 30, { wards, esperado });
      }
    }
    return acc;
  }

  function evidenciaDeCulpa(k, ouro, infos, p, ctx) {
    const heroiDe = (i) => ctx.jog[i].heroi.nome;
    const n = infos.length;
    switch (k) {
      case 'rota': {
        const { tipo, nwDiff, xpDiff, rivais, cedo, esperado } = infos[0];
        const nome = { mid: 'a mid', safe: 'a safe lane', off: 'a offlane' }[tipo];
        return `perdeu ${nome} contra ${rivais}: aos 10 min, ${nwDiff < 0 ? fmtK(-nwDiff) : 'nada'} de patrimônio${xpDiff < 0 ? ` e ${fmtK(-xpDiff)} de XP atrás` : ' atrás'} (média por herói)${cedo ? `, com ${plural(cedo, 'morte', 'mortes')} antes dos 10 min` : ''}; ${esperadoTxt(esperado)}`;
      }
      case 'credito_rota': {
        const { nwDiff, rivais, esperado } = infos[0];
        return `saiu da rota contra ${rivais} com ${fmtK(Math.abs(nwDiff))} de patrimônio ${nwDiff >= 0 ? 'na frente' : 'atrás'} aos 10 min (média por herói); ${esperadoTxt(esperado)}`;
      }
      case 'rotacoes': {
        const quem = [...new Set(infos.map((x) => heroiDe(x.assassino)))].sort().join(' e ');
        return `com a mid perdida, ${quem} rotacionou e matou ${plural(n, 'vez', 'vezes')} em outras rotas antes dos 12 min`;
      }
      case 'mortes': {
        const total = infos.length === 1 && infos[0] === null ? p.stats.deaths : n;
        const meio = infos.filter((t) => t != null && t >= 600 && t < 1200).length;
        return `${plural(total, 'morte', 'mortes')}${meio ? `, ${meio} entre os 10 e os 20 min, quando o ouro vira item decisivo` : ''}`;
      }
      case 'snowball': {
        const quem = [...new Set(infos.map(heroiDe))].sort();
        return `${plural(n, 'morte', 'mortes')} antes dos 25 min para ${quem.join(' e ')}, que ${quem.length > 1 ? 'dispararam' : 'disparou'} no jogo`;
      }
      case 'pickoff': return `${plural(n, 'morte', 'mortes')} sozinho, fora de luta`;
      case 'throw': return `${plural(n, 'morte', 'mortes')} com o time 2k+ na frente`;
      case 'objetivos': {
        const c = (x) => infos.filter((y) => y === x).length;
        const partes = [c('torre') ? plural(c('torre'), 'torre', 'torres') : '', c('quartel') ? plural(c('quartel'), 'quartel', 'quartéis') : '', c('Roshan') ? 'Roshan' : ''].filter(Boolean);
        return `estava morto quando caíram ${partes.join(' e ')}`;
      }
      case 'ausencia': return `vivo e fora de ${plural(n, 'luta perdida', 'lutas perdidas')} em que o time levou 3+ mortes`;
      case 'farm':
      case 'dano': {
        const { pc, espaco } = infos[0];
        return `${k === 'farm' ? 'GPM' : 'dano em heróis'} no percentil ${pct(pc)} de quem joga de ${p.heroi.nome}${espaco < 1 ? ' (o time estava muito atrás aos 20 min: pesa menos)' : ''}`;
      }
      case 'visao': {
        const { wards, esperado } = infos[0];
        return `${plural(wards, 'ward', 'wards')} na partida; o esperado para suporte era umas ${Math.round(esperado)}`;
      }
      case 'participacao': return `esteve em ${pct(infos[0])} dos abates do time`;
      case 'credito_abates': return `${fmtK(-ouro / CULPA.creditoAbates)} de ouro tirado do inimigo nos próprios abates`;
      default: return '';
    }
  }

  function julgar(ctx, match) {
    const acc = cenariosDeCulpa(ctx, match);
    const arred = (x) => Math.round(x * 10) / 10;
    const vereditos = ctx.nos.map((p) => {
      const cs = Object.entries(acc[p.idx])
        .filter(([, c]) => Math.abs(c.ouro) >= CULPA.escala * 0.05)
        .map(([key, c]) => {
          const pontos = arred(c.ouro / CULPA.escala);
          return { key, label: LABELS[key], pontos, valor: pontos, evidencia: evidenciaDeCulpa(key, c.ouro, c.infos, p, ctx) };
        })
        .sort((a, b) => b.pontos - a.pontos);
      const culpa = soma(Object.values(acc[p.idx]).filter((c) => c.ouro > 0), (c) => c.ouro);
      const credito = -soma(Object.values(acc[p.idx]).filter((c) => c.ouro < 0), (c) => c.ouro);
      const liquido = Math.max((1 - CULPA.creditoMax) * culpa, culpa - credito);
      return { jogador: p, score: arred(liquido / CULPA.escala), fatia: 0, componentes: cs };
    });
    const total = soma(vereditos, (v) => v.score) || 1;
    vereditos.forEach((v) => {
      v.fatia = v.score / total;
      v.pesou = v.componentes.filter((c) => c.pontos >= 1).slice(0, 3);
      v.atenuantes = v.componentes.filter((c) => c.pontos <= -1).sort((a, b) => a.pontos - b.pontos).slice(0, 2);
    });
    return vereditos.sort((a, b) => b.score - a.score);
  }

  // ---------------------------------------------------------------- momentos decisivos

  function janelas(lead, sinal, max) {
    if (!lead || lead.length <= JANELA) return [];
    const cand = [];
    for (let t = 0; t + JANELA < lead.length; t++) cand.push({ inicio: t, fim: t + JANELA, delta: lead[t + JANELA] - lead[t] });
    cand.sort((a, b) => sinal * (b.delta - a.delta));
    const escolhidas = [];
    for (const c of cand) {
      if (sinal * c.delta < 3000) break;
      if (escolhidas.every((e) => c.fim <= e.inicio || c.inicio >= e.fim)) escolhidas.push(c);
      if (escolhidas.length >= max) break;
    }
    return escolhidas.sort((a, b) => a.inicio - b.inicio);
  }

  function detalharMomento(w, tipo, ctx) {
    const de = w.inicio * 60;
    const ate = w.fim * 60;
    const dentro = (t) => t >= de && t <= ate;
    const lutasNa = ctx.lutas.filter((l) => l.fim >= de && l.inicio <= ate);
    const mortes = [];
    for (const p of ctx.nos) for (const d of ctx.mortes ? ctx.mortes[p.idx] : []) if (dentro(d.t)) mortes.push({ jogador: p, t: d.t, assassino: nomeAssassino(d, ctx.jog), ouro: d.ouro });
    mortes.sort((a, b) => a.t - b.t);
    const objetivos = ctx.eventos.filter((e) => dentro(e.t) && ['torre', 'quartel', 'ancestral', 'roshan', 'tormentor', 'aegis'].includes(e.tipo));
    const porTempo = (a, b) => a.t - b.t;
    const itensDeles = ctx.itensEles.filter((i) => i.t >= de - 120 && i.t <= ate && (i.custo || 0) >= 2500).sort(porTempo);
    const itensNossos = ctx.itensNos.filter((i) => dentro(i.t) && (i.custo || 0) >= 2500).sort(porTempo);
    const mortesEles = [];
