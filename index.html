    const tatica = TATICA[top[0]] ? TATICA[top[0]](core) : null;
    v.tatica = tatica ? tatica.charAt(0).toUpperCase() + tatica.slice(1) + '.' : null;
    return frases.join(' ');
  }

  function acertosDeItens(p, ctx, inimigo, timings) {
    const ac = [];
    for (const c of inimigo.corteCuraNosso.filter((x) => x.jogador === p)) {
      ac.push(`${itemInfo(ctx.items, c.key).nome} aos ${mmss(c.t)} contra ${fmtK(inimigo.curaTotal)} de cura do time inimigo.`);
    }
    for (const t of timings.filter((x) => x.veredito === 'bom')) ac.push(t.texto);
    return ac;
  }

  const CONSELHOS = {
    rota: (p) => (p.posicao === 2 ? 'Mid perdida contamina o mapa inteiro: se a rota estiver ruim, peça um suporte cedo, empurre a wave antes de recuar e avise sempre que o mid deles sumir.' : 'Rota perdida aos 10 min é desvantagem que o jogo cobra depois: combinem o plano de rota (nível 2, quem bate, quando recuar) e peçam rotação antes de perder a lane.'),
    rotacoes: () => 'Com a mid perdida, o mid deles fica livre para matar nas outras rotas. Empurre a wave e avise o time na hora em que ele sumir.',
    mortes: (p) => `Antes de avançar, conte quantos inimigos estão fora do mapa. ${p.stats.deaths} mortes viram ${p.stats.goldFed != null ? `${fmtK(p.stats.goldFed)} de ouro` : 'muito ouro'} para o outro time.`,
    snowball: () => 'Cada morte para o herói que já está na frente vira o próximo item dele. Contra quem disparou, só lute junto com o time.',
    pickoff: () => 'Morrer sozinho é a morte mais cara: o time luta 4x5 e o inimigo ganha o mapa. Farme com visão e perto de alguém.',
    throw: (p) => `Com o time na frente você morreu ${p.stats.deathsAhead} vezes. Com vantagem, agrupe e derrube torre em vez de caçar abate no lado deles do mapa.`,
    objetivos: (p) => (p.funcao === 'core' ? 'Torre cai quando core está morto. Do mid game em diante, guarde ouro de buyback e não lute em desvantagem perto de objetivo.' : 'As torres caíram com você morto: no mid e late, entre na luta depois do iniciador e não morra primeiro.'),
    ausencia: () => 'O time perdeu lutas com você vivo e longe. Tenha TP sempre e acompanhe os timings do time (smoke, Roshan, torres).',
    participacao: (p) => `Participou de ${pct(p.stats.tfp != null ? p.stats.tfp : 0)} dos abates. Acompanhe os timings do time (smoke, Roshan, torres) e use TP nas lutas.`,
    farm: (p) => `GPM de ${p.stats.gpm}, abaixo do esperado para ${p.heroi.nome}. Mantenha sempre uma wave ou camp no caminho entre uma luta e outra.`,
    dano: (p) => `${fmtK(p.stats.heroDamage)} de dano é pouco para ${p.heroi.nome}. Posicione-se para bater do começo ao fim da luta.`,
    visao: (p) => `${p.stats.obs} obs e ${p.stats.sen} sentries em ${Math.round(p.stats.duracao / 60)} min. Compre obs a cada recarga e coloque sentry antes de Roshan e de lutas em torre.`,
  };

  // ---------------------------------------------------------------- análise completa

  function escolherLado(match, jog, amigos, ladoPedido) {
    if (ladoPedido === 'radiant') return true;
    if (ladoPedido === 'dire') return false;
    const ids = new Set(Object.keys(amigos || {}).map(Number));
    const rad = jog.filter((p) => p.radiant && ids.has(p.conta)).length;
    const dire = jog.filter((p) => !p.radiant && ids.has(p.conta)).length;
    if (rad || dire) return rad >= dire;
    return !match.radiant_win; // sem amigos: julga quem perdeu
  }

  function analisar(dados, opcoes = {}) {
    const match = dados.match;
    if (!match || !Array.isArray(match.players) || !match.players.length) throw new Error('Partida sem jogadores.');
    const items = dados.items || {};
    const itemIds = dados.itemIds || {};
    const comps = conjuntoComponentes(items);
    const duracao = Number(match.duration) || 1;
    const parseado = match.version != null;
    const { jog, npcParaIdx } = montarJogadores(match, dados.heroes, dados.amigos);
    const ladoRadiant = escolherLado(match, jog, dados.amigos, opcoes.lado);
    const venceu = ladoRadiant === Boolean(match.radiant_win);
    const nos = jog.filter((p) => p.radiant === ladoRadiant);
    const eles = jog.filter((p) => p.radiant !== ladoRadiant);
    atribuirFuncoes(nos);
    atribuirFuncoes(eles);

    const sinal = ladoRadiant ? 1 : -1;
    const lead = Array.isArray(match.radiant_gold_adv) ? match.radiant_gold_adv.map((g) => sinal * g) : null;
    const leadXp = Array.isArray(match.radiant_xp_adv) ? match.radiant_xp_adv.map((g) => sinal * g) : null;
    const mortes = timelineMortes(match.players, npcParaIdx);
    const lutas = analisarLutas(match, jog, ladoRadiant);
    const eventos = eventosObjetivos(match, jog, npcParaIdx, ladoRadiant);

    const comprasPor = new Map(jog.map((p) => [p.idx, buildDe(p, items, comps)]));
    const itensNos = nos.flatMap((p) => comprasPor.get(p.idx).map((c) => ({ ...c, jogador: p })));
    const itensEles = eles.flatMap((p) => comprasPor.get(p.idx).map((c) => ({ ...c, jogador: p })));
    for (const p of jog) for (const b of p.raw.buyback_log || []) {
      eventos.push({ t: Number(b.time) || 0, tipo: 'buyback', favor: p.radiant === ladoRadiant ? 'nos' : 'eles', texto: `${p.nome} (${p.heroi.nome}) comprou buyback`, jogador: p });
    }
    eventos.sort((a, b) => a.t - b.t);

    for (const p of jog) {
      const meu = p.radiant === ladoRadiant;
      p.stats = statsDoJogador(p, mortes, lutas, meu ? lead : lead && lead.map((g) => -g), meu ? 'perdeu' : 'venceu');
      p.stats.duracao = duracao;
    }

    const ctx = { jog, nos, eles, mortes, lutas, eventos, lead, items, duracao, itensNos, itensEles };
    ctx.quedas = janelas(lead, -1, 3).map((w) => detalharMomento(w, 'queda', ctx)).sort((a, b) => a.delta - b.delta);
    ctx.viradas = janelas(lead, 1, 2).map((w) => detalharMomento(w, 'virada', ctx)).sort((a, b) => b.delta - a.delta);
    const primeiraPerdida = lutas.find((l) => l.resultado === 'perdeu' && l.inicio >= 15 * 60 && l.mortesNos >= 3);
    ctx.ancora = ctx.quedas[0] ? ctx.quedas[0].inicio * 60 : primeiraPerdida ? primeiraPerdida.inicio : null;
    ctx.ancoraMotivo = ctx.quedas[0] ? 'colapso' : primeiraPerdida ? 'luta' : null;
    ctx.timings = dados.timings || {};
    ctx.matchups = dados.matchups || {};
    // curva de força e matchups: salvos com a partida (culpado_contexto) ou buscados ao vivo pelo painel
    ctx.contexto = match.culpado_contexto || { duracoes: dados.duracoes || {}, matchups: dados.matchups || {} };

    const vereditos = julgar(ctx, match);
    ctx.vereditosTime = vereditos;
    const inimigo = contextoInimigo(ctx);
    ctx.alocacao = alocarItensDoTime(ctx, inimigo);
    const dados_ = { timings: dados.timings || {}, popularidade: dados.popularidade || {} };
    const dadosDeItens = Object.keys(dados_.timings).length > 0 || Object.keys(dados_.popularidade).length > 0;
    const dadoConselho = new Set();
    for (const v of vereditos) {
      const p = v.jogador;
      const compras = comprasPor.get(p.idx);
      const timings = compras.filter((c) => (c.custo || 0) >= 2000).map((c) => analisarTiming(p, c, dados_.timings)).filter(Boolean);
      const populares = popularesDoHeroi(dados_.popularidade, itemIds, items, comps, p.heroi.id);
      v.zoeira = v.pesou[0] ? ZOEIRAS[v.pesou[0].key] : null;
      v.provas = provasDoJogador(v, ctx);
      v.itens = {
        compras,
        timings,
        populares,
        dano: perfilDeDano(p, ctx),
        acertos: acertosDeItens(p, ctx, inimigo, timings),
      };
      Object.assign(v.itens, parecerDeItens(p, ctx, inimigo, compras, populares));
      v.itens.acertos = [...v.itens.acertosContra, ...v.itens.acertos];
      v.diagnostico = diagnostico(v, ctx);
      v.plano = planoDeJogo(v);
      v.itens.leitura = leituraDaBuild(v, ctx);
      const usados = {};
      v.itens.ameacasTexto = v.itens.ameacas.map((a, i) => frasesDeAmeaca(a, p, i, usados));
      v.ficha = fichaRPG(v, ctx);
      v.custou = v.provas.filter((x) => x.tipo === 'ruim').slice(0, 3).map((x) => x.texto);
      const timingsBons = v.itens.timings.filter((x) => x.veredito === 'bom').map((x) => {
        const f = x.faixas[x.faixaJogador];
        return `${x.nome} aos ${mmss(x.t)}: horário de quem vence ${pct(f.wr)} com ${p.heroi.nome}.`;
      });
      v.fezBem = [...v.provas.filter((x) => x.tipo === 'bom').map((x) => x.texto), ...(v.itens.acertosContra || []), ...timingsBons].slice(0, 3);
      const ranked = v.componentes.filter((c) => c.pontos >= 1 && CONSELHOS[c.key]);
      const chave = (ranked.find((c) => !dadoConselho.has(c.key)) || ranked[0] || {}).key;
      if (chave) {
        dadoConselho.add(chave);
        try { v.conselho = CONSELHOS[chave](p); } catch (e) { v.conselho = null; }
      }
    }

    // Time contra time.
    const lado = (time, f) => soma(time, f);
    const comparativo = [
      { label: 'Dano em heróis', nos: lado(nos, (p) => p.raw.hero_damage), eles: lado(eles, (p) => p.raw.hero_damage) },
      { label: 'Cura em heróis', nos: lado(nos, (p) => p.raw.hero_healing), eles: lado(eles, (p) => p.raw.hero_healing) },
      { label: 'Dano em torres', nos: lado(nos, (p) => p.raw.tower_damage), eles: lado(eles, (p) => p.raw.tower_damage) },
      { label: 'Wards colocadas', nos: lado(nos, (p) => (p.raw.obs_placed || 0) + (p.raw.sen_placed || 0)), eles: lado(eles, (p) => (p.raw.obs_placed || 0) + (p.raw.sen_placed || 0)) },
      { label: 'Wards inimigas destruídas', nos: lado(nos, (p) => (p.raw.observer_kills || 0) + (p.raw.sentry_kills || 0)), eles: lado(eles, (p) => (p.raw.observer_kills || 0) + (p.raw.sentry_kills || 0)) },
      { label: 'Smokes compradas', nos: lado(nos, (p) => (p.raw.purchase || {}).smoke_of_deceit), eles: lado(eles, (p) => (p.raw.purchase || {}).smoke_of_deceit) },
      { label: 'Camps stackados', nos: lado(nos, (p) => p.raw.camps_stacked), eles: lado(eles, (p) => p.raw.camps_stacked) },
      { label: 'Segundos de controle (stun)', nos: Math.round(lado(nos, (p) => p.raw.stuns)), eles: Math.round(lado(eles, (p) => p.raw.stuns)) },
    ].filter((c) => c.nos || c.eles);

    const rotas = [];
    // rota física (1 baixo, 2 meio, 3 cima); sem o campo, deduz pela função na rota
    const laneDe = (p) => {
      if (p.raw.lane >= 1 && p.raw.lane <= 3) return p.raw.lane;
      const papel = p.raw.lane_role;
      if (papel === 2) return 2;
      if (papel === 1) return p.radiant ? 1 : 3;
      if (papel === 3) return p.radiant ? 3 : 1;
      return null;
    };
    for (const lane of [1, 2, 3]) {
      const a = nos.filter((p) => laneDe(p) === lane);
      const b = eles.filter((p) => laneDe(p) === lane);
      const nw = (j) => (j.raw.networth_t || j.raw.gold_t || [])[10];
      if (!a.length || !b.length || [...a, ...b].some((j) => nw(j) == null)) continue;
      const lh = (j) => (j.raw.lh_t || [])[10] || 0;
      // abates entre os jogadores da rota nos primeiros 10 min
      const abates = (vitimas, matadores) => soma(vitimas, (v) => (mortes ? mortes[v.idx] : []).filter((d) => d.t < 600 && matadores.some((m) => m.idx === d.assassino)).length);
      const nwNos = soma(a, nw);
      const nwEles = soma(b, nw);
      const diff = nwNos - nwEles;
      const resultado = diff > 500 ? 'ganhou' : diff < -500 ? 'perdeu' : 'empate';
      // quem decidiu: o jogador com a maior diferença de patrimônio para o rival direto mais rico
      // pareia por importância: o mais rico de cada lado entre si, suporte com suporte
      const ordA = [...a].sort((x, y) => nw(y) - nw(x));
      const ordB = [...b].sort((x, y) => nw(y) - nw(x));
      const duelos = ordA.map((j, i) => { const rival = ordB[Math.min(i, ordB.length - 1)]; return { jogador: j, rival, diff: nw(j) - nw(rival) }; });
      const destaque = resultado === 'perdeu' ? [...duelos].sort((x, y) => x.diff - y.diff)[0] : [...duelos].sort((x, y) => y.diff - x.diff)[0];
      const papel = { 1: 'Safe lane', 2: 'Mid', 3: 'Offlane' }[a[0].raw.lane_role] || 'Rota';
      const dicas = [];
      const lh10 = (j) => (j.raw.lh_t || [])[10];
      const dn10 = (j) => (j.raw.dn_t || [])[10];
      for (const dl of duelos) {
        const j = dl.jogador;
        const rv = dl.rival;
        const minhas = [];
        const morteCedo = (mortes ? mortes[j.idx] : []).filter((d) => d.t < 600);
        const quemMatou = juntar([...new Set(morteCedo.map((d) => nomeAssassino(d, jog)))]);
        if (j.funcao === 'core') {
          const xp10 = (x) => (x.raw.xp_t || [])[10];
          if (j.posicao === 3 && xp10(j) != null && xp10(rv) != null && xp10(j) < xp10(rv) - 800) minhas.push({ tipo: 'ruim', texto: `Experiência aos 10 min: ${fmtK(xp10(j))} contra ${fmtK(xp10(rv))} de ${rv.heroi.nome}. Na offlane o objetivo é não ficar atrás em nível: puxe a wave para o seu lado e fique no alcance de XP mesmo sem farmar.` });
          if (j.posicao !== 3 && lh10(j) != null && lh10(rv) != null && lh10(j) < lh10(rv) - 8) minhas.push({ tipo: 'ruim', texto: `Last hit: ${lh10(j)} contra ${lh10(rv)} de ${rv.heroi.nome} aos 10 min. Priorize o último golpe e peça ao suporte para tirar o rival da wave.` });
          if (j.posicao !== 3 && dn10(j) != null && dn10(rv) != null && dn10(j) <= 3 && dn10(rv) >= 8) minhas.push({ tipo: 'ruim', texto: `Negou ${dn10(j)} creeps, contra ${dn10(rv)} do rival: negar tira ouro e XP de quem está na sua frente.` });
          if (morteCedo.length >= 2) minhas.push({ tipo: 'ruim', texto: `Morreu ${morteCedo.length} vezes antes dos 10 min (${quemMatou}): respeite os níveis 2 e 6 deles e recue quando o suporte inimigo sumir.` });
          if (j.posicao === 2) {
            const runas = (x) => (x.raw.runes_log || []).filter((r_) => (Number(r_.time) || 0) < 600).length;
            if (runas(rv) - runas(j) >= 2) minhas.push({ tipo: 'ruim', texto: `Pegou ${runas(j)} runas até os 10 min, contra ${runas(rv)} de ${rv.heroi.nome}: controlar as runas do rio é metade da mid.` });
          }
        } else {
          const obsCedo = (j.raw.obs_log || []).filter((w) => (Number(w.time) || 0) < 600).length;
          if (Array.isArray(j.raw.obs_log) && obsCedo === 0) minhas.push({ tipo: 'ruim', texto: 'Nenhuma observer nos primeiros 10 min: uma ward no rio mostra as rotações deles antes de chegarem.' });
          if (morteCedo.length >= 2) minhas.push({ tipo: 'ruim', texto: `Morreu ${morteCedo.length} vezes antes dos 10 min (${quemMatou}): ande atrás do seu core e não fique na frente da wave sem visão.` });
          if (resultado === 'perdeu' && abates(a, b) > abates(b, a) + 1) minhas.push({ tipo: 'ruim', texto: `A rota deu ${abates(a, b)} abates para eles e ${abates(b, a)} para vocês: busquem o nível 2 primeiro e combinem o combo com o core.` });
          if (j.raw.camps_stacked === 0 && j.posicao >= 4) minhas.push({ tipo: 'ruim', texto: 'Nenhum stack no jogo: stackar o camp grande entre uma wave e outra acelera o seu core.' });
        }
        if (!minhas.length && dl.diff > 500) minhas.push({ tipo: 'bom', texto: `Ganhou o duelo com ${rv.heroi.nome} por ${fmtK(dl.diff)}: use a vantagem para derrubar a torre ou rotacionar para outra rota.` });
        for (const d of minhas.slice(0, 2)) dicas.push({ jogador: j, ...d });
      }
      rotas.push({
        lane, papel, nos: a, eles: b, nwNos, nwEles, diff, resultado, destaque, dicas,
        tipo: lane === 2 ? 'mid' : a[0].raw.lane_role === 1 ? 'safe' : 'off',
        diffMedia: nwNos / a.length - nwEles / b.length,
        diffComXp: nwNos / a.length - nwEles / b.length + CULPA.xpPeso * (soma(a, (j) => (j.raw.xp_t || [])[10] || 0) / a.length - soma(b, (j) => (j.raw.xp_t || [])[10] || 0) / b.length),
        expectativa: expectativaDaRota(ctx.contexto, a, b, lane === 2 ? 'mid' : a[0].raw.lane_role === 1 ? 'safe' : 'off'),
        lhNos: soma(a, lh), lhEles: soma(b, lh),
        // last hit é métrica de core: compara o core de cada lado (menor posição na rota), não a soma com o suporte
        coreNos: [...a].sort((x, y) => x.posicao - y.posicao)[0], coreEles: [...b].sort((x, y) => x.posicao - y.posicao)[0],
        abatesNos: abates(b, a), abatesEles: abates(a, b),
        eficiencia: a.map((j) => j.raw.lane_efficiency_pct).filter((x) => x != null),
      });
    }

    const itensQueMudamALuta = ctx.itensEles
      .filter((it) => NOTAS_ITEM_INIMIGO[it.key] && it.key !== 'blade_mail')
      .sort((a, b) => a.t - b.t)
      .map((it) => ({ t: it.t, heroi: it.jogador.heroi.nome, item: it.nome, texto: NOTAS_ITEM_INIMIGO[it.key](it.jogador.heroi.nome, it.t) }));
    const pior = ctx.quedas[0];
    const maxLead = lead && lead.length ? Math.max(...lead) : null;
    const resumo = [];
    resumo.push(`${venceu ? 'Vitória' : 'Derrota'} em ${mmss(duracao)}, placar ${ladoRadiant ? match.radiant_score : match.dire_score} x ${ladoRadiant ? match.dire_score : match.radiant_score}.`);
    if (lead && maxLead > 0 && !venceu) resumo.push(`Vocês chegaram a estar ${fmtK(maxLead)} na frente (min ${lead.indexOf(maxLead)}).`);
    if (pior && !venceu) resumo.push(`O jogo virou entre os min ${pior.inicio} e ${pior.fim}: −${fmtK(-pior.delta)} de ouro.`);
    if (venceu && ctx.viradas[0]) resumo.push(`A vitória se desenhou entre os min ${ctx.viradas[0].inicio} e ${ctx.viradas[0].fim}: +${fmtK(ctx.viradas[0].delta)} de ouro.`);

    return {
      partida: {
        id: match.match_id, duracao, parseado, venceu, ladoRadiant,
        placarNos: ladoRadiant ? match.radiant_score : match.dire_score,
        placarEles: ladoRadiant ? match.dire_score : match.radiant_score,
        inicio: match.start_time || null, patch: match.patch || null, replay: match.replay_url || null,
        resumo: resumo.join(' '),
      },
      nos, eles, lead, leadXp, lutas, eventos, mortes,
      itensNos, itensEles,
      quedas: ctx.quedas, viradas: ctx.viradas,
      vereditos, comparativo, rotas, inimigo, dadosDeItens, itensQueMudamALuta,
      planoDoTime: ctx.alocacao.plano, ameacasDoTime: ctx.alocacao.ameacas, debates: debatesDeItens(ctx),
      historia: parseado && ctx.mortes ? historiaDaPartida(ctx, rotas, venceu) : [],
    };
  }

  return { analisar, LABELS, ZOEIRAS, util: { mmss, fmtInt, fmtK, pct, plural } };
});

</script>
<script>
/* Quem é o Culpado? — interface do painel.
 * Busca a partida no OpenDota direto do navegador (CORS liberado pela API), roda o motor
 * (engine.js) e desenha tudo em HTML/SVG. Dentro de um artifact do Claude a busca ao vivo é
 * bloqueada pela política de segurança; ali o painel mostra as partidas embutidas.
 */
(function () {
  'use strict';

  const E = window.CulpadoEngine;
  const { mmss, fmtInt, fmtK, pct } = E.util;
  const API = 'https://api.opendota.com/api';
  const CDN = 'https://cdn.cloudflare.steamstatic.com';

  const EMBUTIDO = lerJsonDoDom('dados-embutidos') || {};
  const AMIGOS = lerJsonDoDom('amigos') || {};
  const NO_CLAUDE = typeof window.claude === 'object' && window.claude !== null && typeof window.claude.use === 'function';
  const SO_EMBUTIDO = NO_CLAUDE || Boolean(EMBUTIDO.somenteEmbutido);
  const MOSTRAR_IMAGENS = !SO_EMBUTIDO;

  const estado = { id: null, dados: null, lado: null, resultado: null, metrica: 'ouro', exemplo: false, carregando: false };
  const el = {
    pagina: document.getElementById('pagina'),
    status: document.getElementById('status'),
    form: document.getElementById('busca'),
    input: document.getElementById('match-id'),
    botao: document.getElementById('botao-buscar'),
  };
  let idSvg = 0;

  // ---------------------------------------------------------------- utilidades

  function lerJsonDoDom(id) {
    const no = document.getElementById(id);
    if (!no) return null;
    try { return JSON.parse(no.textContent); } catch (e) { return null; }
  }
  const guardar = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* armazenamento indisponível */ } };
  const ler = (k) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } };

  function h(tag, attrs, ...filhos) {
    const no = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v == null || v === false) continue;
      if (k === 'class') no.className = v;
      else if (k.startsWith('on') && typeof v === 'function') no.addEventListener(k.slice(2), v);
      else no.setAttribute(k, v === true ? '' : String(v));
    }
    for (const f of filhos.flat(Infinity)) {
      if (f == null || f === false) continue;
      no.append(f instanceof Node ? f : document.createTextNode(String(f)));
    }
    return no;
  }
  const SVGNS = 'http://www.w3.org/2000/svg';
  function s(tag, attrs, ...filhos) {
    const no = document.createElementNS(SVGNS, tag);
    for (const [k, v] of Object.entries(attrs || {})) if (v != null) no.setAttribute(k, String(v));
    for (const f of filhos.flat(Infinity)) if (f != null) no.append(f instanceof Node ? f : document.createTextNode(String(f)));
    return no;
  }
  const cor = (nome) => getComputedStyle(document.documentElement).getPropertyValue(`--${nome}`).trim();
  const ladoNome = (radiant) => (radiant ? 'Iluminados' : 'Temidos');
  const dataBR = (t) => new Date(t * 1000).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' });
  const iniciais = (nome) => nome.split(/[\s-]+/).filter(Boolean).slice(0, 2).map((p) => p[0]).join('').toUpperCase();
  const LANES = { 1: 'Rota de baixo', 2: 'Meio', 3: 'Rota de cima' };

  function retrato(heroi, grande) {
    const box = h('span', { class: `retrato${grande ? ' grande' : ''}`, 'aria-hidden': 'true' });
    if (MOSTRAR_IMAGENS && heroi.img) {
      const img = h('img', { src: CDN + heroi.img.replace(/\?$/, ''), alt: '', loading: 'lazy' });
      img.addEventListener('error', () => { box.textContent = iniciais(heroi.nome); });
      box.append(img);
    } else box.textContent = iniciais(heroi.nome);
    return box;
  }
  function iconeItem(item) {
    if (!MOSTRAR_IMAGENS || !item.img) return null;
    const img = h('img', { class: 'icone-item', src: CDN + item.img.replace(/\?t=\d+$/, ''), alt: '', loading: 'lazy' });
    img.addEventListener('error', () => img.remove());
    return img;
  }

  // ---------------------------------------------------------------- status

  function mostrarStatus(texto, tipo) {
    el.status.textContent = '';
    if (!texto) return;
    el.status.append(h('p', { class: `status-msg ${tipo || ''}`, role: tipo === 'erro' ? 'alert' : 'status' }, texto));
  }

  const MENSAGENS = {
    rede: 'Não consegui falar com o OpenDota. Confira a internet e tente de novo.',
    limite: 'O OpenDota limitou as consultas por agora (60 por minuto sem chave). Espere um minuto e tente de novo.',
    'nao-encontrada': (id) => `O OpenDota não encontrou a partida ${id}. Confira o ID: são só números, no fim do placar do Dota ("Partida 9041118764").`,
    bloqueado: 'Neste link do Claude a busca ao vivo é bloqueada por segurança. Para julgar qualquer partida, abra o arquivo painel.html no navegador do seu PC, ou mande o ID no chat.',
    http: 'O OpenDota respondeu com erro. Tente de novo em alguns segundos.',
  };
  function mensagemDeErro(err, id) {
    const m = MENSAGENS[err && err.code];
    if (typeof m === 'function') return m(id);
    return m || `Não deu para analisar a partida: ${err && err.message ? err.message : err}`;
  }

  // ---------------------------------------------------------------- dados (OpenDota)

  async function api(caminho, opcoes) {
    let r;
    try { r = await fetch(API + caminho, opcoes); } catch (e) { throw Object.assign(new Error('rede'), { code: SO_EMBUTIDO ? 'bloqueado' : 'rede' }); }
    if (r.status === 429) throw Object.assign(new Error('limite'), { code: 'limite' });
    if (r.status === 404) throw Object.assign(new Error('não encontrada'), { code: 'nao-encontrada' });
    if (!r.ok) throw Object.assign(new Error(`HTTP ${r.status}`), { code: 'http' });
    return r.json();
  }
  async function constante(nome) {
    const chave = `culpado:constante:${nome}`;
    const cache = ler(chave);
    if (cache && cache.v && Date.now() - cache.t < 7 * 864e5) return cache.v;
    const v = await api(`/constants/${nome}`);
    guardar(chave, { t: Date.now(), v });
    return v;
  }
  async function emLotes(itens, n, f) {
    for (let i = 0; i < itens.length; i += n) await Promise.all(itens.slice(i, i + n).map(f));
  }

  async function buscarDados(id, progresso) {
    const embutida = EMBUTIDO.partidas && EMBUTIDO.partidas[id];
    if (embutida) return embutida;
    if (SO_EMBUTIDO) throw Object.assign(new Error('bloqueado'), { code: 'bloqueado' });
    progresso('Buscando a partida no OpenDota…');
    const match = await api(`/matches/${id}`);
    if (!match || !Array.isArray(match.players) || !match.players.length) throw Object.assign(new Error('vazia'), { code: 'nao-encontrada' });
    progresso('Carregando heróis e itens…');
    const [heroes, items, itemIds] = await Promise.all([constante('heroes'), constante('items'), constante('item_ids')]);
    progresso('Comparando com quem joga os mesmos heróis…');
    const popularidade = {};
    const timings = {};
    const matchups = {};
    const duracoes = {};
    const herois = [...new Set(match.players.map((p) => p.hero_id))];
    await emLotes(herois, 3, async (hid) => {
      const [pop, tim, mu, du] = await Promise.all([
        api(`/heroes/${hid}/itemPopularity`).catch(() => null),
        api(`/scenarios/itemTimings?hero_id=${hid}`).catch(() => null),
        api(`/heroes/${hid}/matchups`).catch(() => null),
        api(`/heroes/${hid}/durations`).catch(() => null),
      ]);
      if (pop) popularidade[hid] = pop;
      if (Array.isArray(tim)) timings[hid] = tim;
      if (Array.isArray(mu)) matchups[hid] = mu;
      if (Array.isArray(du)) duracoes[hid] = du;
    });
    return { match, heroes, items, itemIds, popularidade, timings, matchups, duracoes };
  }

  async function pedirParse(id) {
    mostrarStatus('Esta partida ainda não teve o replay analisado, então por enquanto só aparecem placar e farm. Já pedi a análise ao OpenDota: costuma levar de 1 a 10 minutos e esta página recarrega sozinha quando ficar pronta. Deixe a aba aberta.', 'carregando');
    await api(`/request/${id}`, { method: 'POST' });
    const limite = Date.now() + 15 * 60e3;
    while (Date.now() < limite) {
      await new Promise((r) => setTimeout(r, 15000));
      const m = await api(`/matches/${id}`).catch(() => null);
      if (m && m.version != null) { await carregar(id); return; }
    }
    mostrarStatus('O replay ainda não foi analisado. Replays ficam disponíveis por cerca de 2 semanas; tente de novo mais tarde.', 'erro');
  }

  // ---------------------------------------------------------------- fluxo principal

  const parseJaPedido = new Set();

  async function carregar(id, { exemplo = false } = {}) {
    if (estado.carregando) return;
    let pedirAnalise = false;
    estado.carregando = true;
    el.botao.disabled = true;
    el.pagina.classList.add('recarregando');
    try {
      const dados = await buscarDados(id, (t) => mostrarStatus(t, 'carregando'));
      dados.amigos = AMIGOS;
      estado.id = String(id);
      estado.dados = dados;
      estado.lado = null;
      estado.exemplo = exemplo;
      analisarERender();
      mostrarStatus('');
      pedirAnalise = !exemplo && !SO_EMBUTIDO && dados.match.version == null && !parseJaPedido.has(estado.id);
      if (!exemplo) {
        guardar('culpado:ultimo', estado.id);
        try { history.replaceState(null, '', `#${estado.id}`); } catch (e) { /* frame sem history */ }
      }
    } catch (err) {
      mostrarStatus(mensagemDeErro(err, id), 'erro');
    } finally {
      estado.carregando = false;
      el.botao.disabled = false;
      el.pagina.classList.remove('recarregando');
    }
    // partida recém-jogada: pede a análise do replay sozinho e recarrega quando ficar pronta
    if (pedirAnalise) {
      parseJaPedido.add(String(id));
      pedirParse(id).catch((e) => mostrarStatus(`Não deu para pedir a análise do replay: ${mensagemDeErro(e, id)}`, 'erro'));
    }
  }

  function analisarERender() {
    estado.resultado = E.analisar(estado.dados, { lado: estado.lado });
    render(estado.resultado);
  }

  el.form.addEventListener('submit', (ev) => {
    ev.preventDefault();
    const id = (el.input.value.match(/\d{6,}/) || [])[0];
    if (!id) { mostrarStatus('Cole o ID da partida: o número que aparece no fim do placar do Dota (ex.: 9041118764).', 'erro'); return; }
    el.input.value = id;
    carregar(id);
  });

  // ---------------------------------------------------------------- render

  const desenhos = []; // funções que redesenham SVGs quando a largura muda
  let observador = null;

  function render(r) {
    desenhos.length = 0;
    el.pagina.textContent = '';
    el.pagina.append(
      secaoProcesso(r),
      secaoFigurinhas(r),
      secaoHistoria(r),
      secaoRotas(r),
      secaoLinhaDoTempo(r),
      secaoMomentos(r),
      secaoItensDoTime(r),
      secaoTribunal(r),
      secaoTime(r),
      rodape(r),
    );
    requestAnimationFrame(() => desenhos.forEach((f) => f()));
    if (observador) observador.disconnect();
    if ('ResizeObserver' in window) {
      let ultimo = el.pagina.clientWidth;
      observador = new ResizeObserver(() => {
        const w = el.pagina.clientWidth;
        if (Math.abs(w - ultimo) < 4) return;
        ultimo = w;
        desenhos.forEach((f) => f());
      });
      observador.observe(el.pagina);
    }
  }

  function cabecalho(titulo, texto, id) {
    return h('div', { class: 'bloco-cab' }, h('h2', { id }, titulo), texto ? h('p', {}, texto) : null);
  }

  // -------- processo

  function secaoProcesso(r) {
    const p = r.partida;
    const ladoNos = p.ladoRadiant;
    return h('section', { class: 'processo', 'aria-labelledby': 'titulo-processo' },
      h('p', { class: 'eyebrow' }, `Processo nº ${p.id}`, p.inicio ? ` · ${dataBR(p.inicio)}` : '', ` · ${ladoNome(ladoNos)} contra ${ladoNome(!ladoNos)}`),
      estado.exemplo ? h('p', { class: 'exemplo-aviso' }, 'Exemplo: a partida de vocês de 12/10. Cole outro ID no topo para julgar outra.') : null,
      h('div', { class: 'processo-linha' },
        h('h2', { id: 'titulo-processo', class: `resultado ${p.venceu ? 'is-vitoria' : 'is-derrota'}` }, p.venceu ? 'Vitória' : 'Derrota'),
        h('div', { class: 'placar', 'aria-label': `Placar ${p.placarNos} a ${p.placarEles}` },
          h('span', { class: 'nos' }, p.placarNos), h('span', { class: 'x' }, '×'), h('span', { class: 'eles' }, p.placarEles)),
        h('div', { class: 'fato' }, h('span', { class: 'rotulo' }, 'Duração'), h('span', { class: 'valor' }, mmss(p.duracao))),
        h('div', { class: 'fato' }, h('span', { class: 'rotulo' }, 'Replay'), h('span', { class: 'valor' }, p.parseado ? 'analisado' : 'sem análise'))),
      h('p', { class: 'resumo' }, p.resumo),
      seletorDeTime(r),
      h('div', { class: 'times' }, cartaoTime(r.nos, 'nos', `Vocês · ${ladoNome(ladoNos)}`), cartaoTime(r.eles, 'eles', `Eles · ${ladoNome(!ladoNos)}`)),
      !p.parseado ? avisoParse(p) : null);
  }

  function seletorDeTime(r) {
    const atual = r.partida.ladoRadiant;
    const botao = (radiant) => h('button', {
      type: 'button',
      'aria-pressed': String(atual === radiant),
      onclick: () => { if (atual !== radiant) { estado.lado = radiant ? 'radiant' : 'dire'; analisarERender(); } },
    }, ladoNome(radiant));
    return h('div', { class: 'seletor' },
      h('span', { class: 'eyebrow' }, 'Julgar o time'),
      h('div', { class: 'segmentado', role: 'group', 'aria-label': 'Time julgado' }, botao(true), botao(false)));
  }

  function cartaoTime(time, classe, titulo) {
    const ordenado = [...time].sort((a, b) => a.posicao - b.posicao);
    return h('div', { class: `cartao time ${classe}` },
      h('div', { class: 'time-cab' }, h('h3', {}, titulo), h('span', { class: 'eyebrow' }, 'K / M / A')),
      h('ul', {}, ordenado.map((p) => h('li', {},
        retrato(p.heroi),
        h('span', { class: 'quem' }, h('strong', {}, p.heroi.nome), h('span', {}, `${p.nome} · pos ${p.posicao}`)),
        h('span', { class: 'kda' }, `${p.raw.kills}/${p.raw.deaths}/${p.raw.assists}`)))));
  }

  function avisoParse(p) {
    const pode = !SO_EMBUTIDO;
    return h('div', { class: 'cartao aviso-parse' },
      h('p', {}, 'O replay desta partida ainda não foi analisado pelo OpenDota. Sem ele, o painel só tem placar, farm e comparação por herói: faltam lutas, wards, tempo morto, horário das mortes e itens.'),
      pode ? h('button', { class: 'botao secundario', type: 'button', onclick: () => { parseJaPedido.add(String(p.id)); pedirParse(p.id).catch((e) => mostrarStatus(mensagemDeErro(e, p.id), 'erro')); } }, parseJaPedido.has(String(p.id)) ? 'Pedir de novo' : 'Pedir análise do replay') : null);
  }

  // -------- fase de rotas: quem ganhou cada lane aos 10 min

  // -------- a história da partida

  function secaoHistoria(r) {
    const caps = r.historia || [];
    if (!caps.length) return null;
    const FASE = { rotas: 'Fase de rotas', rotacoes: 'Rotações', snowball: 'Bola de neve', virada: 'Virada', fim: 'Final' };
    return h('section', { class: 'bloco', 'aria-labelledby': 'titulo-historia' },
      cabecalho('A história da partida', 'O que cada matchup prometia, o que aconteceu de verdade, quem rotacionou, quem disparou e onde o jogo virou.', 'titulo-historia'),
      h('ol', { class: 'cartao historia' }, caps.map((c) => h('li', { class: `cap cap-${c.fase}${c.resultado ? ` cap-${c.resultado}` : ''}` },
        h('p', { class: 'eyebrow' }, FASE[c.fase] || ''),
        h('h3', {}, c.titulo),
        h('p', {}, c.texto)))));
  }

  function secaoRotas(r) {
    if (!r.rotas.length) return null;
    const ganhas = r.rotas.filter((l) => l.resultado === 'ganhou').length;
    const perdidas = r.rotas.filter((l) => l.resultado === 'perdeu').length;
    const resumo = ganhas > perdidas ? `Vocês ganharam ${ganhas} de ${r.rotas.length} rotas.` : perdidas > ganhas ? `Vocês perderam ${perdidas} de ${r.rotas.length} rotas.` : 'Fase de rotas equilibrada.';
    return h('section', { class: 'bloco', 'aria-labelledby': 'titulo-rotas' },
      cabecalho('Fase de rotas', `${resumo} Quem saiu na frente aos 10 minutos: patrimônio somado da rota, last hits de core contra core e abates entre quem jogou nela.`, 'titulo-rotas'),
      h('div', { class: 'lanes' }, r.rotas.map(cartaoRota)));
  }

  function cartaoRota(l) {
    const selo = { ganhou: 'Ganharam', perdeu: 'Perderam', empate: 'Empate' }[l.resultado];
    const lado = (time, classe) => h('div', { class: `lado ${classe}` }, [...time].sort((x, y) => x.posicao - y.posicao).map((p) => h('div', { class: 'heroi-rota' },
      retrato(p.heroi), h('span', {}, h('strong', {}, p.heroi.nome), h('small', {}, p.nome)))));
    const total = l.nwNos + l.nwEles || 1;
    const linha = (rotulo, a, b, fmt = String, sub = null) => h('div', { class: 'placar-rota' },
      h('span', { class: a > b ? 'vence' : '' }, fmt(a)), h('span', { class: 'rot' }, rotulo, sub ? h('small', {}, sub) : null), h('span', { class: b > a ? 'vence' : '' }, fmt(b)));
    const dupla = l.nos.length > 1 || l.eles.length > 1;
    const lhDe = (p) => ((p && p.raw.lh_t) || [])[10] ?? 0;
    const d = l.destaque;
    let frase = '';
    if (d) {
      const quem = `${d.jogador.nome} (${d.jogador.heroi.nome})`;
      if (l.resultado === 'perdeu') frase = d.diff < 0 ? `${quem} saiu ${fmtK(-d.diff)} atrás de ${d.rival.heroi.nome}.` : `A rota foi perdida no conjunto, não no duelo de ${quem}.`;
      else if (l.resultado === 'ganhou') frase = d.diff > 0 ? `${quem} saiu ${fmtK(d.diff)} na frente de ${d.rival.heroi.nome}.` : `Ganharam no conjunto, mesmo com ${quem} atrás no duelo.`;
      else frase = `Empate no total da rota (diferença de ${fmtK(Math.abs(l.diff))} de patrimônio)${d.diff > 500 ? `, com ${quem} ${fmtK(d.diff)} na frente de ${d.rival.heroi.nome}` : d.diff < -500 ? `, com ${quem} ${fmtK(-d.diff)} atrás de ${d.rival.heroi.nome}` : ''}.`;
    }
    return h('article', { class: `cartao lane ${l.resultado}` },
      h('div', { class: 'lane-cab' },
        h('p', { class: 'eyebrow' }, `${l.papel} · ${LANES[l.lane] || ''}`),
        h('span', { class: `selo ${l.resultado}` }, selo)),
      h('div', { class: 'confronto' }, lado(l.nos, 'nos'), h('span', { class: 'vs' }, 'vs'), lado(l.eles, 'eles')),
      l.expectativa ? h('p', { class: `lane-papel ${l.expectativa.lado}`, title: l.expectativa.texto }, l.expectativa.curto) : null,
      h('div', { class: 'cabo', role: 'img', 'aria-label': `Patrimônio aos 10 min: vocês ${fmtInt(l.nwNos)}, eles ${fmtInt(l.nwEles)}` },
        h('span', { class: 'n', style: `flex:${l.nwNos / total}` }), h('span', { class: 'e', style: `flex:${l.nwEles / total}` })),
      h('div', { class: 'placares' },
        linha(dupla ? 'patrimônio da rota' : 'patrimônio', l.nwNos, l.nwEles, fmtK, dupla ? 'soma de quem jogou nela' : null),
        dupla && l.coreNos && l.coreEles
          ? linha('last hits dos cores', lhDe(l.coreNos), lhDe(l.coreEles), String, `${l.coreNos.heroi.nome} × ${l.coreEles.heroi.nome}`)
          : linha('last hits', l.lhNos, l.lhEles),
        linha('abates na rota', l.abatesNos, l.abatesEles)),
      frase ? h('p', { class: 'lane-frase' }, frase) : null,
      l.dicas && l.dicas.length ? h('ul', { class: 'lane-dicas' }, l.dicas.map((d) => h('li', { class: d.tipo },
        h('strong', {}, `${d.jogador.heroi.nome}: `), d.texto))) : null);
  }

  // -------- linha do tempo

  function secaoLinhaDoTempo(r) {
    const alvo = h('div', { class: 'grafico', id: 'grafico-tempo' });
    const wrap = h('div', { class: 'cartao grafico-wrap' }, alvo);
    desenhos.push(() => desenharLinhaDoTempo(alvo, wrap, r));
    const temXp = Array.isArray(r.leadXp) && r.leadXp.length > 1;
    return h('section', { class: 'bloco', 'aria-labelledby': 'titulo-tempo' },
      cabecalho('Linha do tempo', 'Vantagem minuto a minuto (acima da linha, vocês na frente), com as lutas, os objetivos, as mortes e os itens de cada um. Passe o mouse para ver os detalhes.', 'titulo-tempo'),
      h('div', { class: 'toolbar' },
        temXp ? h('div', { class: 'segmentado', role: 'group', 'aria-label': 'Métrica do gráfico' },
          ['ouro', 'xp'].map((m) => h('button', { type: 'button', 'aria-pressed': String(estado.metrica === m), onclick: (ev) => {
            estado.metrica = m;
            ev.currentTarget.parentElement.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b === ev.currentTarget)));
            desenharLinhaDoTempo(alvo, wrap, r);
          } }, m === 'ouro' ? 'Ouro' : 'XP'))) : h('span'),
        legendaTempo()),
      r.lead ? wrap : h('p', { class: 'vazio' }, 'Sem a vantagem minuto a minuto: o replay desta partida não foi analisado.'),
      tabelaVantagem(r),
      listaEventos(r));
  }

  function legendaTempo() {
    const item = (svgFilho, texto) => h('span', {}, s('svg', { width: 14, height: 14, viewBox: '0 0 14 14', 'aria-hidden': 'true' }, svgFilho), texto);
    return h('div', { class: 'legenda' },
      item(s('rect', { x: 1, y: 4, width: 12, height: 6, rx: 2, fill: 'var(--nos)' }), 'Vocês'),
      item(s('rect', { x: 1, y: 4, width: 12, height: 6, rx: 2, fill: 'var(--eles)' }), 'Eles'),
      item(s('path', { d: 'M7 2 L12 7 L7 12 L2 7 Z', fill: 'var(--ink-2)' }), 'Item'),
      item(s('path', { d: 'M3 3 L11 11 M11 3 L3 11', stroke: 'var(--eles)', 'stroke-width': 2, 'stroke-linecap': 'round' }), 'Morte'),
      item(s('path', { d: 'M7 2 L12 12 L2 12 Z', fill: 'var(--ink-2)' }), 'Torre'),
      item(s('rect', { x: 2.5, y: 2.5, width: 9, height: 9, fill: 'var(--ink-2)' }), 'Quartel'),
      item(s('rect', { x: 1, y: 1, width: 12, height: 12, fill: 'var(--gold-wash)', stroke: 'var(--gold)', 'stroke-width': 1 }), 'Momento decisivo'));
  }

  function passoBonito(ext) {
    for (const p of [500, 1000, 2000, 2500, 5000, 10000, 20000, 25000, 50000]) if (ext / p <= 4) return p;
    return 100000;
  }

  // Um SVG só: gráfico de vantagem em cima e raias (lutas, objetivos, jogadores, itens deles) embaixo,
  // na mesma escala de tempo, para a mira vertical atravessar tudo.
  function desenharLinhaDoTempo(alvo, wrap, r) {
    if (!r.lead) return;
    alvo.textContent = '';
    wrap.querySelectorAll('.tooltip').forEach((t) => t.remove());
    const serie = estado.metrica === 'xp' && r.leadXp ? r.leadXp : r.lead;
    const W = Math.max(300, Math.floor(alvo.clientWidth));
    const estreito = W < 600;
    const padL = estreito ? 86 : 136;
    const padR = 12;
    const padT = 18;
    const chartH = estreito ? 170 : 220;
    const eixoH = 26;
    const linhaH = estreito ? 24 : 26;
    const nosOrdenados = [...r.nos].sort((a, b) => a.posicao - b.posicao);
    const raias = [
      { id: 'lutas', rotulo: 'Lutas' },
      { id: 'objetivos', rotulo: 'Objetivos' },
      ...nosOrdenados.map((p) => ({ id: `p${p.idx}`, rotulo: p.nome, jogador: p })),
      { id: 'eles', rotulo: 'Itens deles' },
    ];
    const H = padT + chartH + eixoH + raias.length * linhaH + 6;
    const minutos = Math.max(serie.length - 1, Math.ceil(r.partida.duracao / 60));
    const x = (seg) => padL + (seg / 60 / minutos) * (W - padL - padR);
    const minV = Math.min(-1000, ...serie);
    const maxV = Math.max(1000, ...serie);
    const passo = passoBonito((maxV - minV) / 1.5);
    const lo = Math.floor(minV / passo) * passo;
    const hi = Math.ceil(maxV / passo) * passo;
    const y = (v) => padT + ((hi - v) / (hi - lo)) * chartH;
    const y0 = y(0);
    const id = ++idSvg;

    const svg = s('svg', { width: W, height: H, viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': `Vantagem de ${estado.metrica === 'xp' ? 'experiência' : 'ouro'} minuto a minuto e eventos da partida` });
    const defs = s('defs', {},
      s('clipPath', { id: `acima-${id}` }, s('rect', { x: 0, y: 0, width: W, height: y0 })),
      s('clipPath', { id: `abaixo-${id}` }, s('rect', { x: 0, y: y0, width: W, height: H })));
    svg.append(defs);

    // momentos decisivos ao fundo
    const momentos = [...r.quedas, ...r.viradas];
    // rótulos das janelas em até duas linhas, para janelas vizinhas não se atropelarem
    const mostraNos = hi > 0 && y0 - padT > 26;
    const rotuloNos = estreito ? '▲ vocês' : '▲ vocês na frente';
    let fimLinha = [mostraNos ? padL + 6 + rotuloNos.length * 6.7 + 8 : -Infinity, -Infinity];
    for (const m of [...momentos].sort((a, b) => a.inicio - b.inicio)) {
      const x1 = x(m.inicio * 60);
      const larg = Math.max(2, x(m.fim * 60) - x1);
      svg.append(s('rect', { x: x1, y: padT, width: larg, height: chartH, fill: 'var(--gold-wash)' }));
      const rotulo = estreito ? `${m.inicio}–${m.fim}` : `${m.inicio}–${m.fim} · ${m.delta > 0 ? '+' : '−'}${fmtK(Math.abs(m.delta))}`;
      const largTexto = rotulo.length * 6.7 + 8;
      const linha = x1 + 4 >= fimLinha[0] ? 0 : x1 + 4 >= fimLinha[1] ? 1 : 1;
      fimLinha[linha] = x1 + 4 + largTexto;
      svg.append(s('text', { x: x1 + 4, y: padT + 12 + linha * 13, fill: 'var(--gold)' }, rotulo));
    }

    // grade e eixo y
    for (let v = lo; v <= hi; v += passo) {
      svg.append(s('line', { class: v === 0 ? 'zero' : 'grade', x1: padL, x2: W - padR, y1: y(v), y2: y(v) }));
      svg.append(s('text', { x: padL - 8, y: y(v) + 4, 'text-anchor': 'end' }, v === 0 ? '0' : `${v > 0 ? '+' : '−'}${fmtK(Math.abs(v))}`));
    }
    // quem está na frente: dentro do gráfico, colado à esquerda, longe dos números do eixo
    if (mostraNos) svg.append(s('text', { x: padL + 6, y: padT + 12, fill: 'var(--nos)' }, rotuloNos));
    if (lo < 0 && padT + chartH - y0 > 26) svg.append(s('text', { x: padL + 6, y: padT + chartH - 6, fill: 'var(--eles)' }, estreito ? '▼ eles' : '▼ eles na frente'));

    // eixo x (minutos)
    const passoX = minutos > 50 ? 10 : 5;
    for (let m = 0; m <= minutos; m += passoX) {
      svg.append(s('line', { class: 'grade', x1: x(m * 60), x2: x(m * 60), y1: padT + chartH, y2: padT + chartH + 4 }));
      svg.append(s('text', { x: x(m * 60), y: padT + chartH + 17, 'text-anchor': m === 0 ? 'start' : 'middle' }, m === 0 && !estreito ? '0 min' : String(m)));
    }

    // área e linha, cortadas na linha do zero para colorir quem estava na frente
    const pts = serie.map((v, m) => [x(m * 60), y(v)]);
    const linha = pts.map(([px, py], i) => `${i ? 'L' : 'M'}${px.toFixed(1)},${py.toFixed(1)}`).join(' ');
    const area = `${linha} L${pts[pts.length - 1][0].toFixed(1)},${y0} L${pts[0][0].toFixed(1)},${y0} Z`;
    svg.append(s('path', { d: area, fill: 'var(--nos-wash)', 'clip-path': `url(#acima-${id})` }));
    svg.append(s('path', { d: area, fill: 'var(--eles-wash)', 'clip-path': `url(#abaixo-${id})` }));
    svg.append(s('path', { d: linha, fill: 'none', stroke: 'var(--nos)', 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round', 'clip-path': `url(#acima-${id})` }));
    svg.append(s('path', { d: linha, fill: 'none', stroke: 'var(--eles)', 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round', 'clip-path': `url(#abaixo-${id})` }));
    // ponto final rotulado
    const ult = serie[serie.length - 1];
    svg.append(s('circle', { cx: pts[pts.length - 1][0], cy: pts[pts.length - 1][1], r: 4, fill: ult >= 0 ? 'var(--nos)' : 'var(--eles)', stroke: 'var(--surface)', 'stroke-width': 2 }));

    // raias
    const topoRaias = padT + chartH + eixoH;
    const yRaia = (i) => topoRaias + i * linhaH + linhaH / 2;
    raias.forEach((raia, i) => {
      const yc = yRaia(i);
      svg.append(s('line', { class: 'grade', x1: padL, x2: W - padR, y1: yc + linhaH / 2, y2: yc + linhaH / 2 }));
      const maxCar = estreito ? 11 : 17;
      const rot = raia.rotulo.length > maxCar ? `${raia.rotulo.slice(0, maxCar - 1)}…` : raia.rotulo;
      svg.append(s('text', { class: 'rotulo-raia', x: padL - 10, y: yc + 4, 'text-anchor': 'end' }, rot));
    });
    const marcas = s('g', {});
    svg.append(marcas);
    const alvoTip = (no, texto) => { no.setAttribute('data-tip', texto); no.classList.add('alvo'); return no; };

    // lutas
    r.lutas.forEach((l) => {
      const x1 = x(l.inicio);
      const largura = Math.max(5, x(l.fim) - x1);
      const fill = l.resultado === 'venceu' ? 'var(--nos)' : l.resultado === 'perdeu' ? 'var(--eles)' : 'var(--muted)';
      const texto = `${mmss(l.inicio)}–${mmss(l.fim)} · luta ${l.resultado === 'venceu' ? 'vencida' : l.resultado === 'perdeu' ? 'perdida' : 'empatada'}\nMortes: vocês ${l.mortesNos}, eles ${l.mortesEles}\nSaldo de ouro: ${l.swing > 0 ? '+' : ''}${fmtInt(l.swing)}`;
      marcas.append(alvoTip(s('rect', { x: x1, y: yRaia(0) - 6, width: largura, height: 12, rx: 3, fill }), texto));
    });

    // objetivos
    const simbolo = (tipo, cx, cy, fill) => {
      const r_ = 5;
      if (tipo === 'torre') return s('path', { d: `M${cx} ${cy - r_} L${cx + r_} ${cy + r_ - 1} L${cx - r_} ${cy + r_ - 1} Z`, fill });
      if (tipo === 'quartel' || tipo === 'ancestral') return s('rect', { x: cx - 4.5, y: cy - 4.5, width: 9, height: 9, fill });
      if (tipo === 'tormentor' || tipo === 'roshan' || tipo === 'aegis') return s('path', { d: `M${cx} ${cy - 6} L${cx + 6} ${cy} L${cx} ${cy + 6} L${cx - 6} ${cy} Z`, fill, stroke: 'var(--gold)', 'stroke-width': 1.5 });
      return s('circle', { cx, cy, r: 4, fill });
    };
    r.eventos.filter((e) => e.tipo !== 'buyback').forEach((e) => {
      const fill = e.favor === 'nos' ? 'var(--nos)' : e.favor === 'eles' ? 'var(--eles)' : 'var(--muted)';
      marcas.append(alvoTip(simbolo(e.tipo, x(e.t), yRaia(1), fill), `${mmss(e.t)} · ${e.texto}`));
    });

    // jogadores: itens (losango azul), mortes (x vermelho), buybacks (anel)
    nosOrdenados.forEach((p, k) => {
      const yc = yRaia(2 + k);
      r.itensNos.filter((it) => it.jogador === p).forEach((it) => {
        const cx = x(Math.max(0, it.t));
        marcas.append(alvoTip(s('path', { d: `M${cx} ${yc - 5} L${cx + 5} ${yc} L${cx} ${yc + 5} L${cx - 5} ${yc} Z`, fill: 'var(--nos)', stroke: 'var(--surface)', 'stroke-width': 1.5 }), `${mmss(it.t)} · ${p.nome} comprou ${it.nome}`));
      });
      (r.mortes ? r.mortes[p.idx] : []).forEach((d) => {
        const cx = x(d.t);
        const g = s('g', {},
          s('path', { d: `M${cx - 4} ${yc - 4} L${cx + 4} ${yc + 4} M${cx + 4} ${yc - 4} L${cx - 4} ${yc + 4}`, stroke: 'var(--eles)', 'stroke-width': 2, 'stroke-linecap': 'round' }),
          s('rect', { x: cx - 6, y: yc - 6, width: 12, height: 12, fill: 'transparent' }));
        const assassino = d.assassino != null ? [...r.nos, ...r.eles].find((j) => j.idx === d.assassino) : null;
        marcas.append(alvoTip(g, `${mmss(d.t)} · ${p.nome} morreu${assassino ? ` para ${assassino.heroi.nome}` : ''}${d.ouro != null ? ` (${fmtInt(d.ouro)} de ouro para eles)` : ''}`));
      });
      (p.raw.buyback_log || []).forEach((b) => {
        const cx = x(b.time);
        marcas.append(alvoTip(s('circle', { cx, cy: yc, r: 4.5, fill: 'none', stroke: 'var(--gold)', 'stroke-width': 2 }), `${mmss(b.time)} · ${p.nome} comprou buyback`));
      });
    });

    // itens deles
    const yEles = yRaia(raias.length - 1);
    r.itensEles.filter((it) => (it.custo || 0) >= 2500).forEach((it) => {
      const cx = x(it.t);
      marcas.append(alvoTip(s('path', { d: `M${cx} ${yEles - 5} L${cx + 5} ${yEles} L${cx} ${yEles + 5} L${cx - 5} ${yEles} Z`, fill: 'var(--eles)', stroke: 'var(--surface)', 'stroke-width': 1.5 }), `${mmss(it.t)} · ${it.jogador.heroi.nome} fechou ${it.nome}`));
    });

    // mira
    const mira = s('line', { x1: 0, x2: 0, y1: padT, y2: H - 6, stroke: 'var(--ink-2)', 'stroke-width': 1, opacity: 0 });
    const ponto = s('circle', { r: 4, fill: 'var(--ink)', stroke: 'var(--surface)', 'stroke-width': 2, opacity: 0 });
    svg.append(mira, ponto);
    alvo.append(svg);

    const tip = h('div', { class: 'tooltip', hidden: true });
    wrap.append(tip);
    const mostrar = (linhas, px, py) => {
      tip.textContent = '';
      linhas.forEach((l, i) => tip.append(typeof l === 'string' ? h('div', { class: i === 0 ? 'tt-valor' : 'tt-linha' }, l) : l));
      tip.hidden = false;
      const caixa = wrap.getBoundingClientRect();
      const larg = tip.offsetWidth;
      const alt = tip.offsetHeight;
      let left = px + 16;
      if (left + larg > caixa.width - 8) left = px - larg - 16;
      let top = py + 16;
      if (top + alt > caixa.height) top = Math.max(4, py - alt - 12);
      tip.style.left = `${Math.max(4, left)}px`;
      tip.style.top = `${top}px`;
    };
    const esconder = () => { tip.hidden = true; mira.setAttribute('opacity', 0); ponto.setAttribute('opacity', 0); };

    svg.addEventListener('pointermove', (ev) => {
      const caixaSvg = svg.getBoundingClientRect();
      const caixaWrap = wrap.getBoundingClientRect();
      const px = ev.clientX - caixaSvg.left;
      const py = ev.clientY - caixaSvg.top;
      const ox = caixaSvg.left - caixaWrap.left;
      const oy = caixaSvg.top - caixaWrap.top;
      if (px < padL - 4 || px > W - padR + 4) { esconder(); return; }
      const m = Math.max(0, Math.min(serie.length - 1, Math.round(((px - padL) / (W - padL - padR)) * minutos)));
      mira.setAttribute('x1', x(m * 60)); mira.setAttribute('x2', x(m * 60)); mira.setAttribute('opacity', 0.5);
      ponto.setAttribute('cx', x(m * 60)); ponto.setAttribute('cy', y(serie[m])); ponto.setAttribute('opacity', 1);
      const alvoTxt = ev.target && ev.target.closest && ev.target.closest('[data-tip]');
      if (alvoTxt) {
        const linhas = alvoTxt.getAttribute('data-tip').split('\n');
        mostrar(linhas, px + ox, py + oy);
        return;
      }
      const v = serie[m];
      const nomeM = estado.metrica === 'xp' ? 'XP' : 'ouro';
      const linhas = [
        h('div', { class: 'tt-tempo' }, `min ${m}`),
        h('div', { class: 'tt-valor' }, v === 0 ? 'Empate' : `${v > 0 ? 'Vocês' : 'Eles'} +${fmtInt(Math.abs(v))} de ${nomeM}`),
      ];
      const outra = estado.metrica === 'xp' ? r.lead : r.leadXp;
      if (outra && outra[m] != null) linhas.push(h('div', { class: 'tt-linha' }, `${estado.metrica === 'xp' ? 'Ouro' : 'XP'}: ${outra[m] >= 0 ? 'vocês' : 'eles'} +${fmtInt(Math.abs(outra[m]))}`));
      const perto = r.lutas.filter((l) => l.inicio <= m * 60 + 30 && l.fim >= m * 60 - 30);
      for (const l of perto) linhas.push(h('div', { class: 'tt-linha' }, h('span', { class: 'tt-chave', style: `background:${l.resultado === 'venceu' ? 'var(--nos)' : 'var(--eles)'}` }), `Luta ${l.resultado === 'venceu' ? 'vencida' : 'perdida'}: ${l.mortesNos} × ${l.mortesEles} mortes`));
      mostrar(linhas, px + ox, py + oy);
    });
    svg.addEventListener('pointerleave', esconder);
  }

  function tabelaVantagem(r) {
    if (!r.lead) return null;
    const linhas = r.lead.map((v, m) => h('tr', {}, h('td', {}, `${m}`), h('td', {}, `${v > 0 ? '+' : ''}${fmtInt(v)}`), h('td', {}, r.leadXp && r.leadXp[m] != null ? `${r.leadXp[m] > 0 ? '+' : ''}${fmtInt(r.leadXp[m])}` : '–')));
    return h('details', { class: 'tabela' },
      h('summary', {}, 'Ver a vantagem em tabela'),
      h('div', { class: 'tabela-scroll' }, h('table', {},
        h('thead', {}, h('tr', {}, h('th', {}, 'Minuto'), h('th', {}, 'Ouro (vocês − eles)'), h('th', {}, 'XP (vocês − eles)'))),
        h('tbody', {}, linhas))));
  }

  function listaEventos(r) {
    const itens = [
      ...r.eventos.map((e) => ({ t: e.t, favor: e.favor, texto: e.texto })),
      ...r.lutas.map((l) => ({ t: l.inicio, favor: l.resultado === 'venceu' ? 'nos' : l.resultado === 'perdeu' ? 'eles' : 'neutro', texto: `Luta ${l.resultado === 'venceu' ? 'vencida' : l.resultado === 'perdeu' ? 'perdida' : 'empatada'}: ${l.mortesNos} mortes de vocês, ${l.mortesEles} deles (saldo ${l.swing > 0 ? '+' : ''}${fmtInt(l.swing)})` })),
    ].sort((a, b) => a.t - b.t);
    if (!itens.length) return null;
    return h('details', { class: 'tabela' },
      h('summary', {}, `Ver os ${itens.length} eventos em lista`),
      h('ul', { class: 'eventos' }, itens.map((e) => h('li', {}, h('span', { class: 't' }, mmss(e.t)), h('span', { class: `marca-ev ${e.favor}`, 'aria-label': e.favor === 'nos' ? 'a favor de vocês' : e.favor === 'eles' ? 'a favor deles' : '' }), h('span', {}, e.texto)))));
  }

  // -------- momentos decisivos

  function secaoMomentos(r) {
    const cards = [
      ...r.quedas.map((m) => cartaoMomento(m, r)),
      ...r.viradas.slice(0, r.partida.venceu ? 2 : 1).map((m) => cartaoMomento(m, r)),
    ];
    return h('section', { class: 'bloco', 'aria-labelledby': 'titulo-momentos' },
      cabecalho('Momentos decisivos', r.partida.venceu
        ? 'As janelas de 5 minutos em que o jogo mais mudou: onde vocês abriram vantagem e onde deixaram escapar.'
        : 'As janelas de 5 minutos em que vocês mais perderam ouro de vantagem, com quem morreu, o que caiu e o que o time inimigo fechou de item.', 'titulo-momentos'),
      cards.length ? h('div', { class: 'momentos' }, cards) : h('p', { class: 'vazio' }, !r.lead ? 'Aparece quando o replay estiver analisado: sem ele não há ouro minuto a minuto.' : 'Nenhuma janela de 5 minutos mudou mais de 3 mil de ouro: foi um jogo equilibrado do começo ao fim.'));
  }

  function cartaoMomento(m, r) {
    const ruim = m.tipo === 'queda';
    const titulo = ruim ? (m === r.quedas[0] ? 'Onde o jogo escapou' : 'Outra queda') : 'Onde vocês jogaram bem';
    // grade: linhas = jogadores de vocês, colunas = lutas da janela + mortes fora de luta
    const simbolo = { presente: '●', morreu: '✕', ausente: '○' };
    const rotulo = { presente: 'estava na luta', morreu: 'morreu na luta', ausente: 'não apareceu' };
    const cab = h('div', { class: 'grade-linha cab' },
      h('span', {}),
      m.lutas.map((l) => h('span', { class: `col-luta ${l.resultado}`, title: `${l.resultado === 'venceu' ? 'Vencida' : 'Perdida'}: ${l.mortesNos} × ${l.mortesEles} mortes` }, mmss(l.inicio))),
      h('span', { class: 'col-pick', title: 'Mortes fora de qualquer luta' }, 'sozinho'));
    const linhas = [...m.presenca].sort((a, b) => a.jogador.posicao - b.jogador.posicao).map((x) => h('div', { class: 'grade-linha' },
      h('span', { class: 'nome-grade', title: x.jogador.nome }, x.jogador.heroi.nome),
      x.lutas.map((c, i) => h('span', { class: `cel ${c}`, title: `${x.jogador.nome} ${rotulo[c]} (${mmss(m.lutas[i].inicio)})`, 'aria-label': rotulo[c] }, simbolo[c])),
      h('span', { class: `cel pick${x.pickoffs ? ' tem' : ''}`, 'aria-label': `${x.pickoffs} mortes fora de luta` }, x.pickoffs ? `${x.pickoffs}✕` : '–')));
    const grade = m.lutas.length || m.presenca.some((x) => x.pickoffs)
      ? h('div', { class: 'grade', style: `--cols:${m.lutas.length}` }, cab, linhas)
      : null;
    const chips = [];
    if (ruim && m.estruturas.perdidas) chips.push(h('span', { class: 'chip eles' }, `Perderam ${m.estruturas.perdidas}`));
    if (!ruim && m.estruturas.tomadas) chips.push(h('span', { class: 'chip nos' }, `Derrubaram ${m.estruturas.tomadas}`));
    for (const o of m.objetivos.filter((o) => ['roshan', 'aegis', 'tormentor'].includes(o.tipo))) chips.push(h('span', { class: `chip ${o.favor}` }, `${mmss(o.t)} ${o.texto}`));
    for (const i of (ruim ? m.itensDeles : m.itensNossos).filter((i) => (i.custo || 0) >= 4000).slice(0, 3)) chips.push(h('span', { class: `chip ${ruim ? 'eles' : 'nos'}` }, `${mmss(i.t)} ${ruim ? i.jogador.heroi.nome : i.jogador.nome}: ${i.nome}`));
    const mortes = ruim ? m.mortes : m.mortesEles;
    return h('article', { class: 'cartao momento' },
      h('div', { class: 'momento-cab' },
        h('div', {}, h('p', { class: 'eyebrow' }, titulo), h('h3', {}, `Min ${m.inicio}–${m.fim}`)),
        h('span', { class: `delta ${ruim ? 'ruim' : 'bom'}` }, `${ruim ? '−' : '+'}${fmtK(Math.abs(m.delta))} de ouro`)),
      m.manchete ? h('p', { class: 'manchete' }, m.manchete) : null,
      grade,
      grade ? h('p', { class: 'legenda-grade' }, '● estava na luta · ✕ morreu · ○ não apareceu · “sozinho” = mortes fora de qualquer luta') : null,
      chips.length ? h('div', { class: 'chips' }, chips) : null,
      mortes.length ? h('details', { class: 'mais' }, h('summary', {}, `Ver as ${mortes.length} mortes`),
        h('ul', {}, mortes.map((d) => h('li', {}, h('span', { class: 't' }, mmss(d.t)), h('span', {}, `${ruim ? d.jogador.nome : d.jogador.heroi.nome} para ${d.assassino}`))))) : null);
  }

  // -------- itens do time: quem devia ter comprado o quê, e a divisão para a próxima

  function secaoItensDoTime(r) {
    const debates = r.debates || [];
    const plano = r.planoDoTime || [];
    if (!debates.length && !plano.length) return null;
    const cartaoDebate = (d) => h('article', { class: 'cartao debate' },
      h('div', { class: 'debate-cab' },
        retrato(d.ameaca.heroi),
        h('div', {}, h('p', { class: 'eyebrow' }, `Ameaça ${d.tipo === 'magico' ? 'mágica' : 'física'}`), h('h3', {}, d.ameaca.heroi.nome))),
      h('ul', { class: 'pontos' }, d.fatos.map((x) => h('li', {}, x))),
      h('p', { class: 'debate-veredito' }, d.veredito));
    const linhaPlano = (x) => h('li', {},
      h('span', { class: 'pos-chip' }, `pos ${x.jogador.posicao}`),
      h('span', { class: 'quem' }, h('strong', {}, x.jogador.heroi.nome), h('small', {}, x.jogador.nome)),
      h('span', { class: 'item' }, iconeItem(x), h('strong', {}, x.nome), h('small', {}, `${x.papel} · contra ${x.contra}`)),
      h('span', { class: 'ate' }, x.quando != null ? `até ${mmss(x.quando)}` : ''));
    return h('section', { class: 'bloco', 'aria-labelledby': 'titulo-itens-time' },
      cabecalho('Itens do time', 'Contra as duas maiores ameaças do jogo: quem devia ter respondido com item, quem respondeu e o que dividir na próxima. Item de aura é um por time, e cada posição tem a sua parte.', 'titulo-itens-time'),
      debates.length ? h('div', { class: 'debates' }, debates.map(cartaoDebate)) : null,
      plano.length ? h('div', { class: 'cartao plano-time' },
        h('h3', {}, 'Divisão de itens para a próxima'),
        h('ol', {}, plano.map(linhaPlano))) : null);
  }

  // -------- tribunal

  function secaoTribunal(r) {
    const vs = r.vereditos;
    return h('section', { class: 'bloco', 'aria-labelledby': 'titulo-tribunal' },
      cabecalho('O tribunal', 'O parecer do coach para cada um: o que custou o jogo, o que deu certo e o plano para a próxima.', 'titulo-tribunal'),
      h('ol', { class: 'cartao ranking-texto', 'aria-label': 'Ranking de culpa' }, vs.map((v, i) => h('li', { class: culpados(r).includes(v) ? 'e-culpado' : null },
        h('button', { type: 'button', onclick: () => document.getElementById(`dossie-${v.jogador.idx}`).scrollIntoView({ behavior: 'smooth', block: 'start' }) },
          h('span', { class: 'pos' }, `${i + 1}º`),
          retrato(v.jogador.heroi),
          h('span', { class: 'quem' }, h('strong', {}, v.jogador.nome), h('span', {}, `${v.jogador.heroi.nome} · ${v.pesou[0] ? v.pesou[0].label.toLowerCase() : 'sem destaque'}`)),
          h('span', { class: 'fatia' }, pct(v.fatia), h('small', {}, 'da culpa')))))),
      h('div', { class: 'dossies' }, vs.map((v, i) => dossie(v, i, r))));
  }

  // Topo: o culpado e uma figurinha de cada jogador do time
  // Culpa dividida: se o 2º está a menos de 5 pontos percentuais do 1º, os dois dividem o veredito.
  const EMPATE_TECNICO = 0.05;
  function culpados(r) {
    const vs = r.vereditos;
    return vs.length > 1 && vs[0].fatia - vs[1].fatia < EMPATE_TECNICO ? [vs[0], vs[1]] : [vs[0]];
  }

  function secaoFigurinhas(r) {
    const vs = r.vereditos;
    const cs = culpados(r);
    return h('section', { class: 'bloco', 'aria-label': 'Veredito e figurinhas do time' },
      cartaoVeredito(cs, r),
      h('div', { class: 'figurinhas' }, vs.map((v, i) => figurinha(v, i, cs.includes(v)))));
  }

  function figurinha(v, i, eCulpado) {
    const p = v.jogador;
    const linha = (rotulo, texto, classe) => (texto ? h('p', { class: `fig-linha ${classe}` }, h('strong', {}, rotulo), texto) : null);
    return h('article', { class: `cartao figurinha${eCulpado ? ' e-culpado' : ''}` },
      h('div', { class: 'fig-topo' },
        h('span', { class: 'fig-num' }, `Nº ${i + 1}`),
        h('span', { class: 'fig-culpa' }, `${pct(v.fatia)} da culpa`)),
      h('div', { class: 'fig-id' }, retrato(p.heroi), h('div', {}, h('h3', {}, p.nome), h('p', {}, `${p.heroi.nome} · ${p.raw.kills}/${p.raw.deaths}/${p.raw.assists}`))),
      h('p', { class: 'fig-classe' }, v.ficha.classe),
      h('div', { class: 'fig-mini' }, miniHexagono(v.ficha)),
      h('p', { class: 'fig-zoeira' }, v.ficha.zoeira),
      linha('Ajudou: ', v.fezBem[0], 'bom'),
      linha('Atrapalhou: ', v.custou[0], 'ruim'),
      linha('Pra próxima: ', v.plano[0], 'plano'),
      h('button', { class: 'fig-ver', type: 'button', onclick: () => document.getElementById(`dossie-${p.idx}`).scrollIntoView({ behavior: 'smooth', block: 'start' }) }, 'Ver parecer completo'));
  }

  function miniHexagono(f) {
    const W = 92;
    const R = 38;
    const c = W / 2;
    const n = f.atributos.length;
    const pt = (i, raio) => { const a = -Math.PI / 2 + (i * 2 * Math.PI) / n; return [c + raio * Math.cos(a), c + raio * Math.sin(a)]; };
    const svg = s('svg', { width: W, height: W, viewBox: `0 0 ${W} ${W}`, 'aria-hidden': 'true' });
    svg.append(s('polygon', { points: f.atributos.map((_, i) => pt(i, R).join(',')).join(' '), fill: 'none', stroke: 'var(--line-strong)', 'stroke-width': 1 }));
    svg.append(s('polygon', { points: f.atributos.map((_, i) => pt(i, R / 2).join(',')).join(' '), fill: 'none', stroke: 'var(--line)', 'stroke-width': 1 }));
    svg.append(s('polygon', { points: f.atributos.map((a, i) => pt(i, R * Math.max(0.05, a.valor / 100)).join(',')).join(' '), fill: 'var(--eles-wash)', stroke: 'var(--eles)', 'stroke-width': 2, 'stroke-linejoin': 'round' }));
    return h('div', { class: 'mini-wrap' }, svg,
      h('ul', { class: 'mini-attrs' }, [...f.atributos].sort((a, b) => b.valor - a.valor).slice(0, 3).map((a) => h('li', { title: a.explica }, h('span', {}, a.nome), h('b', {}, a.valor)))));
  }

  function cartaoVeredito(cs, r) {
    const derrota = !r.partida.venceu;
    const dividido = cs.length > 1;
    const reu = (v) => {
      const p = v.jogador;
      return h('div', { class: 'reu' },
        retrato(p.heroi, true),
        h('div', { class: 'quem-e' },
          h('p', { class: 'eyebrow' }, `${pct(v.fatia)} da culpa do time`),
          h('h3', {}, p.nome),
          h('p', { class: 'heroi' }, `${p.heroi.nome} · pos ${p.posicao} · ${p.raw.kills}/${p.raw.deaths}/${p.raw.assists}`),
          v.diagnostico ? h('p', { class: 'frase' }, v.diagnostico) : null));
    };
    const diferenca = dividido ? Math.round((cs[0].fatia - cs[1].fatia) * 100) : 0;
    return h('article', { class: `cartao veredito${dividido ? ' dividido' : ''}` },
      derrota ? h('span', { class: 'carimbo', 'aria-hidden': 'true' }, dividido ? 'Culpados' : 'Culpado') : null,
      h('p', { class: 'eyebrow veredito-titulo' }, !derrota ? 'Elo mais fraco' : dividido
        ? `Veredito dividido · ${diferenca === 0 ? 'empate' : `${diferenca} ${diferenca === 1 ? 'ponto' : 'pontos'} de diferença`}`
        : 'Veredito'),
      h('div', { class: 'reus' }, cs.map(reu)));
  }

  // Hexágono de atributos negativos, estilo ficha de RPG
  function fichaRPG(v) {
    const f = v.ficha;
    const n = f.atributos.length;
    const W = 380;
    const H = 230;
    const cx = W / 2;
    const cy = H / 2 + 4;
    const R = 68;
    const ponto = (i, raio) => {
      const ang = -Math.PI / 2 + (i * 2 * Math.PI) / n;
      return [cx + raio * Math.cos(ang), cy + raio * Math.sin(ang)];
    };
    const svg = s('svg', { width: W, height: H, viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': `Ficha de ${v.jogador.nome}: ${f.atributos.map((a) => `${a.nome} ${a.valor}`).join(', ')}` });
    for (const nivel of [0.25, 0.5, 0.75, 1]) {
      svg.append(s('polygon', { points: f.atributos.map((_, i) => ponto(i, R * nivel).join(',')).join(' '), fill: 'none', stroke: 'var(--line)', 'stroke-width': 1 }));
    }
    f.atributos.forEach((_, i) => { const [x, y] = ponto(i, R); svg.append(s('line', { x1: cx, y1: cy, x2: x, y2: y, stroke: 'var(--line)', 'stroke-width': 1 })); });
    const pts = f.atributos.map((a, i) => ponto(i, R * Math.max(0.04, a.valor / 100)));
    svg.append(s('polygon', { points: pts.map((p) => p.join(',')).join(' '), fill: 'var(--eles-wash)', stroke: 'var(--eles)', 'stroke-width': 2, 'stroke-linejoin': 'round' }));
    pts.forEach(([x, y]) => svg.append(s('circle', { cx: x, cy: y, r: 3.5, fill: 'var(--eles)', stroke: 'var(--surface)', 'stroke-width': 1.5 })));
    f.atributos.forEach((a, i) => {
      const [x, y] = ponto(i, R + 22);
      const anchor = Math.abs(x - cx) < 8 ? 'middle' : x > cx ? 'start' : 'end';
      const t = s('text', { x, y: y + (y < cy ? -2 : 8), 'text-anchor': anchor, class: 'rpg-rotulo' });
      t.append(s('tspan', { class: 'rpg-nome' }, a.nome), s('tspan', { class: 'rpg-valor', dx: 5 }, String(a.valor)));
      t.append(s('title', {}, a.explica));
      svg.append(t);
    });
    return h('div', { class: 'ficha' },
      h('p', { class: 'eyebrow' }, 'Ficha de personagem'),
      h('p', { class: 'classe' }, f.classe),
      h('div', { class: 'ficha-svg' }, svg),
      h('ul', { class: 'sr-only' }, f.atributos.map((a) => h('li', {}, `${a.nome}: ${a.valor} (${a.explica})`))));
  }

  function lista(classe, itens, numerada) {
    if (!itens || !itens.length) return null;
    return h(numerada ? 'ol' : 'ul', { class: classe }, itens.map((x) => h('li', {}, x)));
  }

  function leituraDaBuild(v) {
    const ps = (v.itens && v.itens.leitura) || [];
    if (!ps.length) return null;
    return h('div', { class: 'leitura-build' }, h('h4', {}, 'Leitura da build'), ps.map((x) => h('p', {}, x)));
  }

  function dossie(v, i, r) {
    const p = v.jogador;
    return h('article', { class: 'cartao dossie', id: `dossie-${p.idx}`, 'aria-labelledby': `dossie-titulo-${p.idx}` },
      h('header', { class: 'dossie-topo' },
        retrato(p.heroi, true),
        h('div', {},
          h('p', { class: 'eyebrow' }, `${i + 1}º · pos ${p.posicao} · ${p.funcao}`),
          h('h3', { id: `dossie-titulo-${p.idx}` }, p.nome),
          h('p', { class: 'sub' }, `${p.heroi.nome} · ${p.raw.kills}/${p.raw.deaths}/${p.raw.assists} · ${p.raw.gold_per_min} GPM`)),
        h('div', { class: 'nota' }, h('span', { class: 'nota-valor' }, pct(v.fatia)), h('span', { class: 'nota-rotulo' }, 'da culpa'))),
      h('div', { class: 'ficha-e-parecer' },
        fichaRPG(v),
        v.diagnostico ? h('p', { class: 'parecer' }, v.diagnostico) : null),
      leituraDaBuild(v),
      h('div', { class: 'coach' },
        v.custou.length ? h('div', { class: 'coach-col ruim' }, h('h4', {}, 'O que custou o jogo'), lista('pontos', v.custou)) : null,
        v.fezBem.length ? h('div', { class: 'coach-col bom' }, h('h4', {}, 'O que você fez bem'), lista('pontos', v.fezBem)) : null,
        v.plano.length ? h('div', { class: 'coach-col plano' }, h('h4', {}, 'Plano para o próximo jogo'), lista('pontos', v.plano, true)) : null),
      detalhesDoJogador(v, r));
  }

  function detalhesDoJogador(v, r) {
    const it = v.itens;
    const porItem = new Map(it.timings.map((t) => [`${t.item}@${t.t}`, t]));
    const ordem = it.compras.map((c) => {
      const t = porItem.get(`${c.key}@${c.t}`);
      const selo = t ? (t.veredito === 'bom' ? 'bom' : t.veredito === 'atrasado' ? 'tarde' : null) : null;
      return h('li', { class: selo ? `selo-${selo}` : null, title: `${c.nome} aos ${mmss(c.t)}` },
        iconeItem(c), h('span', {}, c.nome), h('small', {}, `${Math.max(1, Math.round(c.t / 60))} min${selo === 'tarde' ? ' · tarde' : selo === 'bom' ? ' · no horário' : ''}`));
    });
    const ameacas = it.ameacasTexto || [];
    const como = it.observacoes || [];
    const fmtPts = (x) => `${x > 0 ? '+' : '−'}${Math.round(Math.abs(x))}`;
    const culpa = v.componentes.filter((c) => Math.abs(c.pontos) >= 1).map((c) => h('li', { class: c.pontos < 0 ? 'credito' : null },
      h('span', { class: 'pts' }, fmtPts(c.pontos)),
      h('span', {}, h('strong', {}, c.label), ` — ${c.evidencia}.`)));
    return h('details', { class: 'detalhes' },
      h('summary', {}, 'Ver detalhes: de onde veio a culpa, contra quem você jogou e a ordem de compra'),
      h('div', { class: 'detalhes-grid' },
        culpa.length ? h('div', { class: 'detalhes-largo' }, h('h4', {}, `De onde vieram os ${Math.round(v.score)} pontos de culpa`),
          h('ul', { class: 'conta-culpa' }, culpa),
          h('p', { class: 'nota-culpa' }, 'Cada ponto é 100 de ouro que o jogador custou ao time (ou devolveu, no caso dos créditos). A culpa da partida é a soma de cada um dividida pelo total do time.')) : null,
        ameacas.length ? h('div', {}, h('h4', {}, 'Contra quem você jogou'), lista('pontos', ameacas)) : null,
        como.length ? h('div', {}, h('h4', {}, 'Como jogar contra eles'), lista('pontos', como)) : null,
        ordem.length ? h('div', { class: 'detalhes-largo' }, h('h4', {}, 'Ordem de compra'), h('ol', { class: 'ordem-build' }, ordem)) : null));
  }

  // -------- time contra time

  function secaoTime(r) {
    const linhas = r.comparativo.map((c) => {
      const max = Math.max(c.nos, c.eles) || 1;
      const par = (classe, v, quem) => h('div', { class: `par ${classe}` },
        h('span', { class: 'barra', 'aria-hidden': 'true' }, h('span', { class: 'barra-fill', style: `display:block;width:${Math.max(1, (v / max) * 100)}%` })),
        h('span', { class: 'v', 'aria-label': `${quem}: ${fmtInt(v)}` }, fmtK(v)));
      return h('div', { class: 'linha' }, h('span', { class: 'rotulo' }, c.label), h('div', { class: 'pares' }, par('nos', c.nos, 'Vocês'), par('eles', c.eles, 'Eles')));
    });
    return h('section', { class: 'bloco', 'aria-labelledby': 'titulo-time' },
      cabecalho('Time contra time', 'Os totais de cada lado. O que vocês fizeram a mais e a menos que o outro time.', 'titulo-time'),
      h('div', { class: 'legenda' },
        h('span', {}, s('svg', { width: 14, height: 14, viewBox: '0 0 14 14', 'aria-hidden': 'true' }, s('rect', { x: 1, y: 4, width: 12, height: 6, rx: 2, fill: 'var(--nos)' })), 'Vocês'),
        h('span', {}, s('svg', { width: 14, height: 14, viewBox: '0 0 14 14', 'aria-hidden': 'true' }, s('rect', { x: 1, y: 4, width: 12, height: 6, rx: 2, fill: 'var(--eles)' })), 'Eles')),
      h('div', { class: 'cartao comparativo' }, linhas),
      r.itensQueMudamALuta && r.itensQueMudamALuta.length ? h('div', { class: 'cartao itens-deles' },
        h('h3', {}, 'Itens deles que mudam a luta'),
        h('ul', {}, r.itensQueMudamALuta.map((x) => h('li', {}, h('span', { class: 't' }, mmss(x.t)), h('span', {}, x.texto))))) : null,
      null);
  }

  function rodape(r) {
    const id = r.partida.id;
    return h('footer', { class: 'rodape' },
      h('p', {}, 'Dados do ', h('a', { href: `https://www.opendota.com/matches/${id}`, target: '_blank', rel: 'noopener' }, 'OpenDota'),
        ': a partida, o replay analisado, a comparação com quem joga o mesmo herói, os itens mais comprados por herói e a taxa de vitória por horário de item (amostras de partidas públicas; faixas com menos de 30 partidas são ignoradas).'),
      h('p', {}, 'Como a culpa é calculada: cada jogador soma pontos (1 ponto = 100 de ouro) pelo que custou ao time em situações comuns de Dota. Entram rota perdida aos 10 min (pesa 1,5x, porque ouro cedo vira bola de neve; a mid é 1x1 e é toda do mid), mortes pesadas pelo momento (entre 10 e 20 min pesam mais), morrer para quem disparou no jogo, morrer sozinho, morrer com o jogo ganho, estar morto quando caem torres e quartéis, ficar fora de lutas perdidas e farm ou visão abaixo do papel. Farm baixo pesa menos quando o time já estava muito atrás. Rota ganha e abates viram crédito. A fatia é a parte de cada um no total do time.'),
      h('p', {}, 'O índice é um ponto de partida para conversar sobre o jogo, não uma sentença final. Taxa de vitória por horário mostra correlação: quem fecha item cedo geralmente já está ganhando.'),
      r.partida.replay ? h('p', {}, 'Replay: ', h('span', { class: 'mono' }, r.partida.replay)) : null);
  }

  // ---------------------------------------------------------------- início

  function iniciar() {
    const doHash = (location.hash.match(/^#(\d{6,})$/) || [])[1];
    const ultimo = ler('culpado:ultimo');
    const exemploId = EMBUTIDO.exemplo;
    if (doHash) { el.input.value = doHash; carregar(doHash); return; }
    if (ultimo && !SO_EMBUTIDO) { el.input.value = ultimo; carregar(ultimo); return; }
    if (exemploId) { carregar(exemploId, { exemplo: true }); return; }
    mostrarStatus('Cole o ID de uma partida no topo para começar.');
  }
  iniciar();
})();

</script>
