    for (const p of ctx.eles) for (const d of ctx.mortes ? ctx.mortes[p.idx] : []) if (dentro(d.t)) mortesEles.push({ jogador: p, t: d.t, assassino: nomeAssassino(d, ctx.jog), ouro: d.ouro });
    mortesEles.sort((a, b) => a.t - b.t);
    // Presença de cada um nas lutas da janela e mortes fora de luta (pickoffs).
    const emLuta = (t) => ctx.lutas.some((l) => t >= l.inicio - 10 && t <= l.fim + 10);
    const time = tipo === 'queda' ? ctx.nos : ctx.eles;
    const mortesDoLado = tipo === 'queda' ? mortes : mortesEles;
    const presenca = ctx.nos.map((p) => ({
      jogador: p,
      lutas: lutasNa.map((l) => {
        const x = l.jogadores[p.idx];
        return x.deaths > 0 ? 'morreu' : presenteNaLuta(x) ? 'presente' : 'ausente';
      }),
      pickoffs: mortes.filter((m) => m.jogador === p && !emLuta(m.t)).length,
    }));
    const pickoffs = mortesDoLado.filter((m) => !emLuta(m.t));
    const manchete = mancheteDoMomento({ tipo, lutasNa, presenca, pickoffs, objetivos, itensDeles, itensNossos, ctx });
    return { ...w, tipo, lutas: lutasNa, mortes, mortesEles, objetivos, itensDeles, itensNossos, presenca, pickoffs, manchete, estruturas: resumoEstruturas(objetivos), time };
  }

  function resumoEstruturas(objetivos) {
    const grupos = { nos: [], eles: [] };
    for (const o of objetivos) {
      if (!['torre', 'quartel', 'ancestral'].includes(o.tipo)) continue;
      grupos[o.favor === 'eles' ? 'nos' : 'eles'].push(o);
    }
    const texto = (lista) => {
      const torres = lista.filter((o) => o.tipo === 'torre').length;
      const quarteis = lista.filter((o) => o.tipo === 'quartel').length;
      const anc = lista.some((o) => o.tipo === 'ancestral');
      const partes = [];
      if (torres) partes.push(`${torres} ${torres === 1 ? 'torre' : 'torres'}`);
      if (quarteis) partes.push(`${quarteis} ${quarteis === 1 ? 'quartel' : 'quartéis'}`);
      if (anc) partes.push('o Ancestral');
      return partes.join(' e ');
    };
    return { perdidas: texto(grupos.nos), tomadas: texto(grupos.eles) };
  }

  const juntar = (nomes) => (nomes.length <= 1 ? nomes.join('') : `${nomes.slice(0, -1).join(', ')} e ${nomes[nomes.length - 1]}`);

  function mancheteDoMomento({ tipo, lutasNa, presenca, pickoffs, objetivos, itensDeles, itensNossos, ctx }) {
    const frases = [];
    const perdidas = lutasNa.filter((l) => l.resultado === 'perdeu');
    const vencidas = lutasNa.filter((l) => l.resultado === 'venceu');
    if (tipo === 'queda') {
      if (lutasNa.length) frases.push(`Perderam ${perdidas.length} de ${lutasNa.length} ${lutasNa.length === 1 ? 'luta' : 'lutas'}`);
      const ausentes = presenca.filter((x) => x.lutas.some((c, i) => c === 'ausente' && lutasNa[i].resultado === 'perdeu'));
      if (ausentes.length) frases.push(`${juntar(ausentes.map((x) => x.jogador.nome))} ${ausentes.length === 1 ? 'ficou' : 'ficaram'} fora de luta perdida`);
      if (pickoffs.length) {
        const cont = {};
        for (const m of pickoffs) cont[m.jogador.nome] = (cont[m.jogador.nome] || 0) + 1;
        frases.push(`${pickoffs.length} ${pickoffs.length === 1 ? 'morte' : 'mortes'} sozinho, fora de luta (${juntar(Object.entries(cont).map(([n, c]) => (c > 1 ? `${n} ${c}×` : n)))})`);
      }
      const est = resumoEstruturas(objetivos).perdidas;
      if (est) frases.push(`caíram ${est}`);
      const spike = itensDeles.filter((i) => (i.custo || 0) >= 4000)[0];
      if (spike) frases.push(`${spike.jogador.heroi.nome} tinha fechado ${spike.nome} aos ${mmss(spike.t)}`);
    } else {
      if (lutasNa.length) frases.push(`Venceram ${vencidas.length} de ${lutasNa.length} ${lutasNa.length === 1 ? 'luta' : 'lutas'}`);
      const todos = presenca.filter((x) => x.lutas.length && x.lutas.every((c) => c !== 'ausente'));
      if (lutasNa.length && todos.length === presenca.length) frases.push('com os 5 presentes em todas');
      if (pickoffs.length) frases.push(`pegaram ${pickoffs.length} ${pickoffs.length === 1 ? 'inimigo sozinho' : 'inimigos sozinhos'}`);
      const est = resumoEstruturas(objetivos).tomadas;
      if (est) frases.push(`derrubaram ${est}`);
    }
    if (!frases.length) return null;
    const texto = frases.join('; ');
    return texto.charAt(0).toUpperCase() + texto.slice(1) + '.';
  }

  // ---------------------------------------------------------------- provas, conselhos e itens por jogador

  function provasDoJogador(v, ctx) {
    const p = v.jogador;
    const s = p.stats;
    const provas = [];
    const add = (tipo, texto, peso = 1) => provas.push({ tipo, texto, peso });
    const mortes = ctx.mortes ? ctx.mortes[p.idx] : [];

    if (mortes.length >= 4) {
      const cont = {};
      for (const d of mortes) { const n = nomeAssassino(d, ctx.jog); cont[n] = (cont[n] || 0) + 1; }
      const n = Math.max(...Object.values(cont));
      const tops = Object.keys(cont).filter((k) => cont[k] === n);
      if (n >= 3) add('ruim', tops.length > 1 ? `Morreu mais para ${tops.join(' e ')}: ${n} mortes para cada um, de ${mortes.length}.` : `Morreu mais para ${tops[0]}: ${n} de ${mortes.length} mortes.`, 1.2);
    }
    const caras = mortes.filter((d) => d.ouro != null).sort((a, b) => b.ouro - a.ouro);
    if (caras.length && caras[0].ouro >= 600) add('ruim', `Morte mais cara aos ${mmss(caras[0].t)}: ${fmtInt(caras[0].ouro)} de ouro para ${nomeAssassino(caras[0], ctx.jog)}.`, 1.1);

    if (s.timeDead != null) {
      const ranking = [...ctx.jog].sort((a, b) => (b.raw.life_state_dead || 0) - (a.raw.life_state_dead || 0));
      if (ranking[0] === p) add('ruim', `${(s.timeDead / 60).toLocaleString('pt-BR', { maximumFractionDigits: 1 })} min morto: o maior tempo da partida entre os 10 jogadores.`, 1.4);
    }

    const pior = ctx.quedas[0];
    if (pior) {
      const minhas = pior.mortes.filter((m) => m.jogador === p);
      if (minhas.length) add('ruim', `${plural(minhas.length, 'morte', 'mortes')} no momento decisivo (min ${pior.inicio}–${pior.fim}): ${minhas.map((m) => mmss(m.t)).join(', ')}.`, 1.3 + 0.2 * minhas.length);
    }

    const perdidas = ctx.lutas.filter((l) => l.resultado === 'perdeu');
    if (perdidas.length >= 2) {
      const morreu = perdidas.filter((l) => l.jogadores[p.idx].deaths > 0);
      const ausente = perdidas.filter((l) => !presenteNaLuta(l.jogadores[p.idx]));
      if (morreu.length >= Math.max(2, Math.ceil(perdidas.length / 2))) add('ruim', `Morreu em ${morreu.length} das ${perdidas.length} lutas que o time perdeu.`, 1.0);
      if (ausente.length >= 2) {
        const maior = [...ausente].sort((a, b) => a.swing - b.swing)[0];
        add(p.funcao === 'core' ? 'ruim' : 'neutro', `Ficou fora de ${ausente.length} das ${perdidas.length} lutas perdidas, incluindo a das ${mmss(maior.inicio)} (saldo de ${fmtInt(maior.swing)} de ouro).`, 1.0);
      }
    }

    // Item de salvamento na mochila e morte sem ativar.
    const posse = posseDeItens(p, ctx.items);
    const semUsar = [];
    for (const l of ctx.lutas) {
      const x = l.jogadores[p.idx];
      if (!(x.deaths > 0)) continue;
      const tinha = posse.filter((it) => it.de < l.inicio && it.ate > l.inicio);
      for (const it of tinha) if (!(x.item_uses || {})[it.key]) semUsar.push({ luta: l, item: itemInfo(ctx.items, it.key) });
    }
    if (semUsar.length) {
      const porLuta = new Map();
      for (const x of semUsar) porLuta.set(x.luta, [...(porLuta.get(x.luta) || []), x.item.nome]);
      const lista = [...porLuta].slice(0, 3).map(([l, nomes]) => `${nomes.join(' e ')} na luta das ${mmss(l.inicio)}`).join('; ');
      add('ruim', `Morreu sem usar o item de salvamento que tinha: ${lista}.`, 1.2);
    }

    if (p.funcao === 'core' && s.buybacks === 0 && s.lateDeaths >= 3) add('ruim', `Nenhum buyback, mesmo com ${s.lateDeaths} mortes depois dos 30 min.`, 0.9);
    const bb = p.raw.buyback_log || [];
    if (bb.length) add('bom', `Comprou buyback ${bb.length === 1 ? 'uma vez' : `${bb.length} vezes`} (${bb.map((b) => mmss(b.time)).join(', ')}).`, 0.6);

    // Rota: comparação com os rivais diretos aos 10 min.
    const rivais = ctx.eles.filter((e) => e.raw.lane != null && e.raw.lane === p.raw.lane);
    const nw10 = (j) => (j.raw.networth_t || j.raw.gold_t || [])[10];
    const lh10 = (j) => (j.raw.lh_t || [])[10];
    if (rivais.length && nw10(p) != null && rivais.every((r) => nw10(r) != null)) {
      const melhor = [...rivais].sort((a, b) => nw10(b) - nw10(a))[0];
      const diff = nw10(p) - nw10(melhor);
      const texto = `Aos 10 min: ${fmtK(nw10(p))} de patrimônio e ${lh10(p) ?? '?'} LH, contra ${fmtK(nw10(melhor))} e ${lh10(melhor) ?? '?'} LH de ${melhor.heroi.nome} na mesma rota.`;
      if (p.funcao === 'core') add(diff < -800 ? 'ruim' : diff > 800 ? 'bom' : 'neutro', texto, 0.8);
    }

    // Dano e participação no contexto do time.
    const danoTime = soma(ctx.nos, (t) => t.stats.heroDamage) || 1;
    const fatiaDano = s.heroDamage / danoTime;
    if (p.funcao === 'core' && fatiaDano < 0.16) add('ruim', `${fmtInt(s.heroDamage)} de dano em heróis: só ${pct(fatiaDano)} do dano do time.`, 0.9);
    const maiorDano = Math.max(...ctx.nos.map((t) => t.stats.heroDamage));
    if (fatiaDano >= 0.25 && s.heroDamage === maiorDano) add('bom', `${fmtInt(s.heroDamage)} de dano em heróis: ${pct(fatiaDano)} do time, o maior dano de vocês.`, 0.7);
    const tfps = ctx.nos.map((t) => t.stats.tfp).filter((x) => x != null);
    if (s.tfp != null && tfps.length === ctx.nos.length) {
      if (s.tfp === Math.min(...tfps)) add('ruim', `Participação em abates de ${pct(s.tfp)}: a menor do time.`, 0.9);
      else if (s.tfp === Math.max(...tfps)) add('bom', `Participação em abates de ${pct(s.tfp)}: a maior do time.`, 0.8);
    }

    // Suporte: visão e controle.
    if (p.funcao === 'suporte' && Array.isArray(p.raw.obs_log)) {
      const ultima = [...(p.raw.obs_log || []), ...(p.raw.sen_log || [])].reduce((m, w) => Math.max(m, Number(w.time) || 0), -Infinity);
      if (ultima > 0 && ctx.duracao - ultima > 8 * 60) add('ruim', `Última ward aos ${mmss(ultima)}: o fim do jogo (${mmss(ctx.duracao)}) foi no escuro.`, 1.0);
    }
    if (s.stuns != null) {
      const maxStun = Math.max(...ctx.jog.map((j) => Number(j.raw.stuns) || 0));
      if (s.stuns > 30 && s.stuns === maxStun) add('bom', `${Math.round(s.stuns)} s de controle (stun/root): o maior do jogo.`, 0.8);
    }
    if (s.deathsAhead) {
      const ts = (ctx.mortes ? ctx.mortes[p.idx] : []).filter((d) => { const m = Math.floor(d.t / 60); return ctx.lead && ctx.lead[m] >= THROW_LEAD; }).map((d) => mmss(d.t));
      add('ruim', `Morreu com o time +2k de ouro na frente: ${ts.join(', ')}.`, 0.9);
    }
    const farm = s.bench.gold_per_min;
    if (farm != null && farm >= 0.6 && p.funcao === 'core') add('bom', `${s.gpm} GPM: percentil ${pct(farm)} de quem joga de ${p.heroi.nome}.`, 0.6);

    return provas.sort((a, b) => (a.tipo === 'bom') - (b.tipo === 'bom') || b.peso - a.peso);
  }

  function contextoInimigo(ctx) {
    const cura = ctx.eles.map((e) => ({ heroi: e.heroi.nome, cura: Number(e.raw.hero_healing) || 0 })).sort((a, b) => b.cura - a.cura);
    const curaTotal = soma(cura, (c) => c.cura);
    const stunTotal = soma(ctx.eles, (e) => e.raw.stuns);
    const invis = ctx.eles.filter((e) => HEROIS_INVISIVEIS.has(e.heroi.id) || (e.raw.purchase_log || []).some((x) => ITENS_INVIS.has(x.key)));
    const butterfly = ctx.eles.filter((e) => (e.raw.purchase_log || []).some((x) => x.key === 'butterfly'));
    const corteCuraNosso = ctx.nos.flatMap((p) => (p.raw.purchase_log || []).filter((x) => ITENS_CORTE_CURA.has(x.key)).map((x) => ({ jogador: p, t: x.time, key: x.key })));
    return { cura, curaTotal, stunTotal, invis, butterfly, corteCuraNosso };
  }

  function perfilDeDano(p, ctx) {
    const rec = p.raw.damage_inflictor_received || {};
    const total = soma(Object.values(rec));
    if (total < 5000) return null;
    const ataque = Number(rec.null) || 0;
    const fontes = Object.entries(rec)
      .filter(([k]) => k !== 'null')
      .sort((a, b) => b[1] - a[1])
      .slice(0, 3)
      .map(([k, d]) => ({ nome: nomeFonte(k, ctx), dano: d }));
    return { total, ataque, fracAtaque: ataque / total, fontes };
  }

  function nomeFonte(key, ctx) {
    if (ctx.items[key]) return ctx.items[key].dname || prettyKey(key);
    for (const j of ctx.jog) {
      const base = (j.heroi.npc || '').replace('npc_dota_hero_', '');
      if (base && key.startsWith(`${base}_`)) return `${prettyKey(key.slice(base.length + 1))} (${j.heroi.nome})`;
    }
    return prettyKey(key);
  }

  // Notas por herói inimigo: só mecânicas estáveis entre patches. itens: core / suporte.
  const NOTAS_HEROI = {
    41: { nota: 'Chronosphere atravessa BKB: espalhem-se nas lutas para ele não pegar três de uma vez.', core: ['heavens_halberd', 'aeon_disk'], suporte: ['ghost', 'force_staff'], porque: 'Void bate físico e trava com Time Lock' },
    14: { nota: 'Meat Hook pede creeps entre vocês e ele; quem é puxado precisa de fuga pronta para o Dismember.', core: ['force_staff', 'black_king_bar'], suporte: ['force_staff', 'glimmer_cape'], porque: 'Pudge mata com gancho, Rot e Dismember' },
    85: { nota: 'Undying se sustenta com Soul Rip e Tombstone: quebrem a Tombstone primeiro e cortem a cura.', core: ['spirit_vessel', 'skadi', 'shivas_guard'], suporte: ['spirit_vessel'], porque: 'a cura do Undying vira luta longa' },
    30: { nota: 'Death Ward é canalizada: stun, Eul’s ou tirar o alvo do alcance encerram o dano.', core: ['black_king_bar'], suporte: ['cyclone', 'force_staff', 'glimmer_cape'], porque: 'Maledict e Death Ward são dano mágico/canalizado' },
    84: { nota: 'Fireblast é de alvo único: Linken’s ou Lotus Orb bloqueiam; o resto do dano dele é mágico.', core: ['sphere', 'black_king_bar'], suporte: ['glimmer_cape', 'lotus_orb'], porque: 'Ogre explode com Fireblast e Ignite' },
    44: { nota: 'Blur dá evasão e o crítico explode em segundos: MKB e desarme mudam a luta.', core: ['monkey_king_bar', 'heavens_halberd'], suporte: ['ghost', 'force_staff'], porque: 'PA mata com crítico físico' },
    32: { nota: 'Riki vive invisível: sentries nas áreas de luta e Dust na hora do aparecimento.', core: [], suporte: ['dust', 'ward_sentry'], porque: 'Riki é invisível' },
    104: { nota: 'Duel é de alvo único: Linken’s bloqueia, e quem anda sozinho vira alvo.', core: ['sphere'], suporte: ['glimmer_cape', 'force_staff'], porque: 'Legion ganha força a cada Duel' },
    22: { nota: 'Zeus é dano mágico em área: resistência mágica para o time inteiro rende mais que vida.', core: ['black_king_bar', 'pipe'], suporte: ['glimmer_cape', 'pipe'], porque: 'Zeus é só dano mágico' },
    99: { nota: 'Bristleback reduz dano pelas costas: Break (Silver Edge) desliga a passiva.', core: ['silver_edge'], suporte: [], porque: 'a passiva do Bristleback anula o dano pelas costas' },
    67: { nota: 'Dispersion devolve dano: Break (Silver Edge) desliga a passiva.', core: ['silver_edge'], suporte: [], porque: 'a Dispersion do Spectre devolve o dano' },
    12: { nota: 'Phantom Lancer se multiplica em ilusões: dano em área limpa as cópias.', core: ['mjollnir', 'bfury'], suporte: [], porque: 'as ilusões do PL escondem o original' },
  };
  // Itens inimigos que pedem resposta. tipo: 'item' sugere item; 'nota' é orientação de jogo.
  const REGRAS_ITEM_INIMIGO = [
    { keys: ['butterfly'], core: ['monkey_king_bar', 'bloodthorn'], texto: (e, it) => `${e} fechou ${it} (evasão)` },
    { keys: ['invis_sword', 'silver_edge'], suporte: ['dust', 'ward_sentry', 'gem'], texto: (e, it) => `${e} fechou ${it} e fica invisível` },
    { keys: ['greater_crit', 'satanic', 'abyssal_blade', 'desolator'], fisico: true, core: ['shivas_guard', 'assault', 'heavens_halberd'], suporte: ['ghost', 'force_staff'], texto: (e, it) => `${e} fechou ${it} (dano físico)` },
    { keys: ['guardian_greaves', 'mekansm', 'holy_locket', 'heart', 'satanic'], cura: true, core: ['skadi', 'shivas_guard', 'spirit_vessel'], suporte: ['spirit_vessel'], texto: (e, it) => `${e} fechou ${it} (cura/regeneração)` },
    { keys: ['shivas_guard', 'assault', 'crimson_guard', 'solar_crest'], armadura: true, core: ['desolator'], texto: (e, it) => `${e} fechou ${it} (armadura)` },
  ];
  const NOTAS_ITEM_INIMIGO = {
    black_king_bar: (e, t) => `${e} fechou BKB aos ${mmss(t)}: antes disso era a janela para lutar contra ele; depois, controle nele não pega por alguns segundos, então joguem no alvo sem BKB.`,
    lotus_orb: (e, t) => `${e} tem Lotus Orb desde ${mmss(t)}: não jogue habilidade de alvo em quem está com o escudo ativo.`,
    sphere: (e, t) => `${e} tem Linken’s Sphere desde ${mmss(t)}: gaste uma habilidade barata antes do combo.`,
    blade_mail: (e, t) => `${e} tem Blade Mail desde ${mmss(t)}: quando ela acender, pare de bater.`,
    aeon_disk: (e, t) => `${e} tem Aeon Disk desde ${mmss(t)}: guarde parte do combo para depois que o disco estourar.`,
  };

  function ameacasDe(p, ctx) {
    const recebido = p.raw.damage_taken || {};
    const inflictors = p.raw.damage_inflictor_received || {};
    const totalHerois = soma(Object.entries(recebido).filter(([k]) => k.startsWith('npc_dota_hero_')).map(([, v]) => v));
    if (!totalHerois) return [];
    const mortes = ctx.mortes ? ctx.mortes[p.idx] : [];
    const matchups = (ctx.matchups && (ctx.matchups[p.heroi.id] || ctx.matchups[String(p.heroi.id)])) || [];
    return ctx.eles
      .map((e) => {
        const dano = Number(recebido[e.heroi.npc]) || 0;
        const base = (e.heroi.npc || '').replace('npc_dota_hero_', '');
        const habilidades = Object.entries(inflictors)
          .filter(([k]) => base && k.startsWith(`${base}_`))
          .sort((a, b) => b[1] - a[1])
          .map(([k, d]) => ({ nome: prettyKey(k.slice(base.length + 1)), dano: d }));
        const danoHab = soma(habilidades, (h) => h.dano);
        const minhasMortes = mortes.filter((d) => d.assassino === e.idx);
        const m = matchups.find((x) => x.hero_id === e.heroi.id);
        return {
          jogador: e,
          dano,
          fracao: dano / totalHerois,
          fracFisica: dano ? Math.max(0, dano - danoHab) / dano : 0,
          habilidades: habilidades.slice(0, 2),
          mortes: minhasMortes.length,
          primeiraMorte: (minhasMortes.find((d) => d.t >= 600) || minhasMortes[0] || {}).t ?? null,
          itens: ctx.itensEles.filter((i) => i.jogador === e && (i.custo || 0) >= 2000).map((i) => ({ key: i.key, nome: i.nome, t: i.t })),
          matchup: m && m.games_played >= MIN_JOGOS ? { wr: m.wins / m.games_played, jogos: m.games_played } : null,
        };
      })
      .filter((a) => a.fracao >= 0.12 || a.mortes >= 2)
      .sort((a, b) => b.fracao + b.mortes * 0.05 - (a.fracao + a.mortes * 0.05))
      .slice(0, 3);
  }

  function itemDoPapel(p, keys) {
    const core = p.funcao === 'core';
    return (keys || []).filter((k) => {
      if (k === 'skadi') return p.heroi.atributo === 'agi';
      if (k === 'shivas_guard') return p.heroi.atributo !== 'agi';
      if (k === 'heavens_halberd') return p.heroi.atributo === 'str' || p.posicao === 3;
      if (k === 'pipe') return p.posicao === 3 || p.posicao === 4 || !core;
      if (k === 'desolator') return p.heroi.atributo !== 'int';
      return true;
    });
  }

  // ---------------------------------------------------------------- build pelo estado do jogo

  // Itens de ganância: aceleram farm ou dano, mas não te mantêm vivo. Bons para quem está na frente.
  const GANANCIA = new Set(['hand_of_midas', 'bfury', 'radiance', 'kaya', 'yasha', 'maelstrom', 'octarine_core', 'aether_lens', 'mask_of_madness', 'falcon_blade', 'dagon', 'desolator', 'echo_sabre', 'diffusal_blade', 'witch_blade', 'phylactery', 'yasha_and_kaya', 'greater_crit', 'gungir', 'mage_slayer', 'mjollnir']);
  // Resposta de sobrevivência por tipo de dano recebido (o que um coach manda fazer quando você está apanhando).
  const SOBREVIVER = {
    magico: { core: ['black_king_bar', 'eternal_shroud', 'cyclone', 'sphere', 'lotus_orb', 'blade_mail'], suporte: ['glimmer_cape', 'force_staff', 'cyclone', 'lotus_orb', 'pipe'] },
    fisico: { core: ['blade_mail', 'heavens_halberd', 'crimson_guard', 'shivas_guard', 'butterfly', 'ghost', 'force_staff'], suporte: ['ghost', 'force_staff', 'glimmer_cape', 'solar_crest'] },
    misto: { core: ['black_king_bar', 'blade_mail', 'aeon_disk', 'force_staff', 'cyclone'], suporte: ['force_staff', 'glimmer_cape', 'ghost', 'cyclone'] },
  };
  const PAPEL_DEFESA = {
    black_king_bar: 'imunidade a magia e a controle: dá para lutar sem ser explodido',
    eternal_shroud: 'resistência mágica e mana de volta quando você apanha de magia',
    hood_of_defiance: 'resistência mágica barata para aguentar o combo',
    cyclone: 'te tira do combo e limpa silence e debuff',
    sphere: 'bloqueia a habilidade de alvo que abre o combo deles',
    lotus_orb: 'devolve a habilidade de alvo e limpa debuff',
    pipe: 'escudo mágico para você e para o time',
    blade_mail: 'quem te bate apanha junto',
    heavens_halberd: 'desarma quem bate físico em você',
    crimson_guard: 'bloqueia dano físico de você e do time',
    shivas_guard: 'armadura e menos velocidade de ataque em quem chega perto',
    butterfly: 'evasão contra quem bate físico',
    ghost: 'imune a ataque físico por alguns segundos',
    force_staff: 'te tira de onde você foi pego',
    glimmer_cape: 'invisibilidade e resistência mágica para escapar',
    solar_crest: 'armadura e evasão no aliado que estiver sendo focado',
    aeon_disk: 'você sobrevive ao primeiro combo',
  };

  // Como o jogo estava para o jogador no meio do jogo (10-20 min): estava apanhando? de quê?
  function estadoDoJogador(p, ctx, ameacas) {
    const mortes = ctx.mortes ? ctx.mortes[p.idx] : [];
    const ate20 = mortes.filter((d) => d.t < 1200).length;
    const lead = ctx.lead || [];
    const l15 = lead.length > 15 ? lead[15] : lead.length ? lead[lead.length - 1] : 0;
    const rota = (ctx.vereditosTime || []).find((v) => v.jogador === p);
    const rotaPerdida = rota ? rota.componentes.some((c) => c.key === 'rota') : false;
    const apanhando = ate20 >= 3 || (ate20 >= 2 && (l15 <= -2500 || rotaPerdida));
    const total = soma(ameacas, (a) => a.fracao) || 1;
    const fisico = soma(ameacas, (a) => a.fracao * a.fracFisica) / total;
    const tipo = fisico >= 0.6 ? 'fisico' : fisico <= 0.4 ? 'magico' : 'misto';
    const quem = ameacas[0] ? ameacas[0].jogador.heroi.nome : null;
    const motivos = [];
    if (ate20) motivos.push(`${plural(ate20, 'morte', 'mortes')} antes dos 20 min`);
    if (rotaPerdida) motivos.push('a rota perdida');
    if (l15 <= -2500) motivos.push(`o time ${fmtK(-l15)} atrás aos 15 min`);
    return { apanhando, tipo, quem, ate20, l15, motivos };
  }

  function sugestaoDeSobrevivencia(p, ctx, estado, populares, comprou) {
    const lista = itemDoPapel(p, SOBREVIVER[estado.tipo][p.funcao]).filter((k) => ctx.items[k]);
    // o que quem joga o herói compra pesa mais: entre as opções certas, a mais popular do herói
    const pop = populares ? [...populares.inicio, ...populares.meio, ...populares.fim].map((x) => x.key) : [];
    const doTime = new Set((ctx.alocacao ? [...ctx.alocacao.porJogador.values()].flat() : []).map((x) => x.key));
    const ordenada = [...lista].sort((a, b) => (pop.includes(a) ? pop.indexOf(a) : 99) - (pop.includes(b) ? pop.indexOf(b) : 99));
    // já tinha a resposta certa? se chegou a tempo, o problema não era item; se chegou tarde, é ela mais cedo
    const primeiraMorte = (ctx.mortes ? ctx.mortes[p.idx] : []).find((d) => d.t >= 600);
    const tem = lista.filter((k) => comprou.has(k)).sort((a, b) => comprou.get(a) - comprou.get(b))[0];
    let key;
    if (tem) {
      const prazo = Math.max(prazoMinimo(itemInfo(ctx.items, tem).custo), primeiraMorte ? primeiraMorte.t : 0);
      if (comprou.get(tem) <= prazo + 300) return null;
      key = tem;
    } else {
      key = ordenada.find((k) => !doTime.has(k));
    }
    if (!key) return null;
    const info = itemInfo(ctx.items, key);
    const quando = Math.max(prazoMinimo(info.custo), 14 * 60);
    const atrasado = comprou.has(key);
    const saiu = atrasado ? comprou.get(key) : null;
    // jogos parecidos: quem fecha esse item com o herói até o prazo vence quanto?
    const rows = linhasTiming(ctx.timings, p.heroi.id, key).filter((r) => r.ate <= quando + 300);
    const ag = agregado(rows);
    const jogos = ag.jogos >= MIN_JOGOS ? `${p.heroi.nome} que fecha ${info.nome} até ${mmss(rows[rows.length - 1].ate)} vence ${pct(ag.wr)} (${fmtInt(ag.jogos)} partidas)` : null;
    const tipoTxt = { magico: 'quase tudo de magia', fisico: 'quase tudo no ataque físico', misto: 'misturando ataque e magia' }[estado.tipo];
    return {
      ...info, prioridade: 5, quando, porque: 'sobreviver', contra: estado.quem, atrasado, sobrevivencia: true,
      papel: PAPEL_DEFESA[key] || 'te mantém vivo na luta',
      popular: pop.includes(key),
      jogos,
      saiu,
      motivo: `Você estava apanhando (${estado.motivos.join(', ')})${estado.quem ? ` e ${estado.quem} batia ${tipoTxt}` : ''}. Atrás no jogo, o primeiro item grande tem que te manter vivo: ${info.nome} (${PAPEL_DEFESA[key] || 'sobrevivência'})${saiu != null ? `, e o seu só saiu lá pelos ${minutos(saiu)}` : ''}.${jogos ? ` ${jogos}.` : ''}`,
    };
  }

  function parecerDeItens(p, ctx, inimigo, compras, populares) {
    const comprou = new Map();
    for (const x of p.raw.purchase_log || []) if (!comprou.has(x.key)) comprou.set(x.key, Number(x.time) || 0);
    const core = p.funcao === 'core';
    const ameacas = ameacasDe(p, ctx);
    const cand = [];
    const observacoes = [];
    const acertosContra = [];
    const timeTemCorte = inimigo.corteCuraNosso.length > 0;
    const comentados = new Set();
    const propor = (keys, motivo, peso, quando, porque, contra) => {
      const opcoes = itemDoPapel(p, keys).filter((k) => !(timeTemCorte && ITENS_CORTE_CURA.has(k)));
      if (!opcoes.length) return false;
      for (const key of opcoes) {
        if (!ctx.items[key]) continue;
        const info = itemInfo(ctx.items, key);
        if (comprou.has(key)) {
          const t = comprou.get(key);
          const prazoReal = quando != null ? Math.max(quando, prazoMinimo(info.custo)) : null;
          const jaComentado = ((ctx.alocacao && ctx.alocacao.tardes.get(p.idx)) || []).some((x) => x.key === key) || comentados.has(key);
          if (prazoReal != null && t > prazoReal + 300) { if (!jaComentado) { comentados.add(key); observacoes.push(`${info.nome} contra ${contra} foi a escolha certa, mas chegou lá pelos ${minutos(t)}; o ideal era antes dos ${minutos(prazoReal)}.`); } }
          else acertosContra.push(`${info.nome} (${mmss(t)}) responde a ${contra}.`);
          return true; // já tem a resposta: não sugere outra para o mesmo problema
        }
        // item caro não fica pronto cedo: prazo mínimo realista
        const minimo = prazoMinimo(info.custo);
        const prazo = quando != null ? Math.max(quando, minimo) : quando;
        cand.push({ ...info, motivo, prioridade: peso, quando: prazo, porque: prazo !== quando ? 'tipico_custo' : porque, contra });
        return true;
      }
      return true;
    };

    for (const a of ameacas) {
      const e = a.jogador.heroi.nome;
      const partes = [`${e} causou ${pct(a.fracao)} do dano de heróis que você tomou (${fmtK(a.dano)})`];
      if (a.habilidades.length) partes.push(`principalmente com ${a.habilidades.map((h) => h.nome).join(' e ')}`);
      if (a.mortes) partes.push(`e te matou ${a.mortes === 1 ? 'uma vez' : `${a.mortes} vezes`}`);
      const base = `${partes.join(', ')}.`;
      const usaMorte = a.primeiraMorte != null && (ctx.ancora == null || a.primeiraMorte <= ctx.ancora);
      const ancora = usaMorte ? a.primeiraMorte : ctx.ancora;
      const porqueMorte = usaMorte ? `antes da 1ª morte para ${e}` : ctx.ancoraMotivo;
      const peso = 2 + a.fracao * 4 + a.mortes * 0.3;
      const nota = NOTAS_HEROI[a.jogador.heroi.id];
      const porTipo = () => {
        if (a.fracFisica >= 0.6) propor(core ? ['shivas_guard', 'assault', 'heavens_halberd'] : ['ghost', 'force_staff'], `${base} ${pct(a.fracFisica)} disso foi ataque físico: armadura, desarme ou Ghost Scepter cortam esse dano.`, peso, ancora, porqueMorte, e);
        else if (a.fracFisica <= 0.4) propor(core ? ['black_king_bar', 'pipe'] : ['glimmer_cape', 'force_staff'], `${base} Foi dano de habilidade: resistência mágica ou um item de fuga resolvem.`, peso, ancora, porqueMorte, e);
      };
      if (nota) {
        const ok = propor(core ? nota.core : nota.suporte, `${base} ${nota.nota}`, peso, ancora, porqueMorte, e);
        if (!ok) {
          const donos = inimigo.corteCuraNosso.map((c) => c.jogador);
          observacoes.push(donos.includes(p)
            ? `${nota.nota} Você já tinha o corte de cura: use no ${e} no começo da luta.`
            : `${nota.nota} O corte de cura do time estava com ${donos.map((j) => j.nome).join(', ')}: lute perto de quem tem.`);
          porTipo();
        }
      } else if (a.fracFisica >= 0.6) {
        propor(core ? ['shivas_guard', 'assault', 'heavens_halberd'] : ['ghost', 'force_staff'], `${base} ${pct(a.fracFisica)} disso foi ataque físico: armadura, desarme ou Ghost Scepter cortam esse dano.`, peso, ancora, porqueMorte, e);
      } else if (a.fracFisica <= 0.4) {
        propor(core ? ['black_king_bar', 'pipe'] : ['glimmer_cape', 'force_staff'], `${base} Foi dano de habilidade: resistência mágica ou um item de fuga resolvem.`, peso, ancora, porqueMorte, e);
      }
      for (const regra of REGRAS_ITEM_INIMIGO) {
        const it = a.itens.find((i) => regra.keys.includes(i.key));
        if (!it) continue;
        if (regra.fisico && a.fracFisica < 0.5) continue;
        if (regra.cura && (Number(a.jogador.raw.hero_healing) || 0) < 3000) continue;
        if (regra.armadura && !(core && p.heroi.atributo !== 'int' && a.fracFisica >= 0.3)) continue;
        propor(core ? regra.core : regra.suporte, `${regra.texto(e, it.nome)} aos ${mmss(it.t)}, e foi ele quem mais te machucou.`, peso - 0.5, Math.min(it.t, ancora ?? it.t), `antes de ${e} fechar ${it.nome}`, e);
      }
    }

    // Itens de qualquer inimigo que mudam a forma de lutar (não só as ameaças diretas).
    for (const e of ctx.eles) for (const it of ctx.itensEles.filter((i) => i.jogador === e && NOTAS_ITEM_INIMIGO[i.key])) {
      if (it.key === 'blade_mail') {
        const refletido = Number((p.raw.damage_inflictor_received || {}).blade_mail) || 0;
        if (refletido >= 1000) observacoes.push(`Você apanhou do próprio dano na Blade Mail de ${e.heroi.nome}: quando ela acender, pare de bater e espere acabar.`);
        continue;
      }
      // as demais notas (BKB, Lotus, Linken's, Aeon) valem para o time inteiro: ficam em r.itensQueMudamALuta
    }

    // Problemas do time inteiro que este jogador pode resolver.
    if (inimigo.curaTotal >= 8000 && !inimigo.corteCuraNosso.length && (!core || p.posicao === 3)) {
      const top = inimigo.cura.filter((c) => c.cura >= 2500).map((c) => `${c.heroi} ${fmtK(c.cura)}`).join(', ');
      propor(core ? ['spirit_vessel', 'skadi', 'shivas_guard'] : ['spirit_vessel'], `O time inimigo curou ${fmtK(inimigo.curaTotal)} (${top}) e ninguém de vocês comprou corte de cura.`, 2.2, ctx.ancora, ctx.ancoraMotivo, 'a cura deles');
    }
    if (inimigo.invis.length && !core) {
      const nomes = inimigo.invis.map((e) => e.heroi.nome).join(', ');
      propor(['dust', 'ward_sentry'], `${nomes} ${inimigo.invis.length > 1 ? 'ficam' : 'fica'} invisível: Dust of Appearance e sentries revelam.`, 2.2, ctx.ancora, ctx.ancoraMotivo, nomes);
    }

    if (populares) {
      const top = populares.meio.slice(0, 3);
      const tipico = (key) => horarioTipico(ctx.timings, p.heroi.id, key);
      const naoComprado = top.find((i) => !comprou.has(i.key));
      if (naoComprado) {
        const t = tipico(naoComprado.key);
        cand.push({ ...naoComprado, motivo: `É o ${top.indexOf(naoComprado) + 1}º item mais comprado no meio do jogo por quem joga de ${p.heroi.nome} (OpenDota), e você não comprou.`, prioridade: 1, quando: t != null ? t : ctx.ancora, porque: t != null ? 'tipico' : ctx.ancoraMotivo });
      }
      for (const i of top) {
        const t0 = comprou.get(i.key);
        if (t0 != null && t0 > LATE) {
          const t = tipico(i.key);
          cand.push({ ...i, motivo: `É o ${top.indexOf(i) + 1}º item mais comprado no meio do jogo por quem joga de ${p.heroi.nome}, e o seu só saiu aos ${mmss(t0)}.`, prioridade: 2.5, quando: t != null ? t : ctx.ancora, porque: t != null ? 'tipico' : ctx.ancoraMotivo, atrasado: true });
        }
      }
    }

    const vistos = new Set();
    const doTime = (ctx.alocacao && ctx.alocacao.porJogador.get(p.idx)) || [];
    let pessoais = cand.filter((c) => c.atrasado || c.prioridade === 1).sort((a, b) => b.prioridade - a.prioridade);
    // estado do jogo: quem está apanhando não recebe item de ganância como próximo passo
    const estado = estadoDoJogador(p, ctx, ameacas);
    let ganancia = null;
    let sobreviver = null;
    if (estado.apanhando) {
      const evitado = pessoais.find((c) => GANANCIA.has(c.key));
      if (evitado) ganancia = { key: evitado.key, nome: evitado.nome };
      pessoais = pessoais.filter((c) => !GANANCIA.has(c.key));
      sobreviver = sugestaoDeSobrevivencia(p, ctx, estado, populares, comprou);
    }
    const sugestoes = [...(sobreviver ? [sobreviver] : []), ...doTime, ...pessoais].filter((c) => !vistos.has(c.key) && vistos.add(c.key)).slice(0, 3);
    if (ctx.alocacao) { acertosContra.push(...ctx.alocacao.acertos.get(p.idx)); observacoes.unshift(...ctx.alocacao.tardes.get(p.idx).map((x) => x.texto)); }
    return { ameacas, sugestoes, observacoes: [...new Set(observacoes)].slice(0, 4), acertosContra: [...new Set(acertosContra)], estado, ganancia };
  }

  // Ficha de RPG com atributos negativos (0–100), para a zoeira do grupo.
  function fichaRPG(v, ctx) {
    const p = v.jogador;
    const s = p.stats;
    const alimentou = (x) => soma(x.componentes.filter((c) => c.key === 'mortes' || c.key === 'snowball'), (c) => c.pontos);
    const emLuta = (t) => ctx.lutas.some((l) => t >= l.inicio - 10 && t <= l.fim + 10);
    const pickoffsDe = (j) => (ctx.mortes ? ctx.mortes[j.idx] : []).filter((d) => !emLuta(d.t)).length;
    const meus = pickoffsDe(p);
    const doTime = soma(ctx.nos, pickoffsDe);
    const tfp = s.tfp != null ? s.tfp : 0.5;
    const farmPct = s.bench.gold_per_min != null ? s.bench.gold_per_min : 0.5;
    const atributos = [
      { nome: 'Feeder', valor: notaFatia(fatia(alimentou(v), soma(ctx.vereditosTime || [v], alimentou))), explica: `${s.deaths} mortes, ${fmtK(s.goldFed || 0)} de ouro entregue` },
      { nome: 'Turista', valor: clamp((0.65 - tfp) / 0.45), explica: `esteve em ${pct(tfp)} dos abates do time` },
      { nome: 'Pickoff Ambulante', valor: ctx.lutas.length ? notaFatia(fatia(meus, doTime)) : 0, explica: `${meus} ${meus === 1 ? 'morte' : 'mortes'} sozinho, fora de luta` },
      { nome: 'Throw', valor: clamp((s.deathsAhead || 0) / 4), explica: `${s.deathsAhead || 0} mortes com o time na frente` },
      { nome: 'Farm Simulator', valor: clamp(farmPct * clamp((0.75 - tfp) / 0.45) * (p.funcao === 'core' ? 1.6 : 0.6)), explica: `farm no percentil ${pct(farmPct)} e ${pct(tfp)} de participação` },
      { nome: 'Mão de Alface', valor: (s.bench.hero_damage_per_min != null ? clamp((0.6 - s.bench.hero_damage_per_min) / 0.5) : 0) * (p.funcao === 'core' ? 1 : 0.5), explica: `${fmtK(s.heroDamage)} de dano em heróis` },
    ].map((a) => ({ ...a, valor: Math.round(a.valor * 100) }));
    const top = [...atributos].sort((a, b) => b.valor - a.valor)[0];
    const classe = top.valor >= 25 ? `${top.nome} nível ${top.valor}` : 'Cidadão de bem';
    // quem mais matou este jogador (empates juntos)
    const porInimigo = ctx.eles.map((e) => ({ nome: e.heroi.nome, n: (ctx.mortes ? ctx.mortes[p.idx] : []).filter((d) => d.assassino === e.idx).length }));
    const maxN = Math.max(0, ...porInimigo.map((x) => x.n));
    const carrasco = porInimigo.filter((x) => x.n === maxN && maxN > 0).map((x) => x.nome).join(' e ') || 'o time deles';
    const varios = carrasco.includes(' e ');
    const ZOEIRA = {
      Feeder: [
        () => `${s.deaths} mortes e ${fmtK(s.goldFed || 0)} de ouro de presente: ${carrasco} já ${varios ? 'podem' : 'pode'} abrir uma conta no nome dele.`,
        () => `Patrocinou o time adversário com ${fmtK(s.goldFed || 0)} de ouro em ${s.deaths} mortes.`,
      ],
      Turista: [
        () => `Esteve em ${pct(tfp)} das lutas; o resto acompanhou pelo minimapa.`,
        () => `Participou de ${pct(tfp)} dos abates: comprou ingresso e saiu no intervalo.`,
      ],
      'Pickoff Ambulante': [
        () => `${meus} mortes sozinho no mapa: virou camp de farm de ${carrasco}.`,
        () => `${meus} mortes longe do time: andava sozinho como se tivesse Aegis.`,
      ],
      Throw: [
        () => `${s.deathsAhead} ${s.deathsAhead === 1 ? 'morte' : 'mortes'} com o jogo ganho: devolveu a vantagem com juros.`,
        () => `Com o time na frente, achou que era hora de caçar sozinho. ${s.deathsAhead} ${s.deathsAhead === 1 ? 'vez' : 'vezes'}.`,
      ],
      'Farm Simulator': [
        () => `${s.gpm} GPM e ${pct(tfp)} de participação: o time lutava, ele farmava.`,
        () => `${s.lastHits} last hits e pouca luta: a selva agradece a visita.`,
      ],
      'Mão de Alface': [
        () => `${fmtK(s.heroDamage)} de dano em heróis: os inimigos nem perceberam que ele estava lá.`,
        () => `Bateu ${fmtK(s.heroDamage)} em herói o jogo todo: carinho, não dano.`,
      ],
    };
    ctx.zoeirasUsadas = ctx.zoeirasUsadas || {};
    let zoeira = 'Ficha limpa: nenhum atributo negativo passou de 25.';
    if (top.valor >= 25 && ZOEIRA[top.nome]) {
      const k = ctx.zoeirasUsadas[top.nome] || 0;
      ctx.zoeirasUsadas[top.nome] = k + 1;
      zoeira = ZOEIRA[top.nome][k % ZOEIRA[top.nome].length]();
    }
    return { atributos, classe, zoeira, principal: top.nome };
  }

  // Itens que valem para o time inteiro (aura ou contra-item único): só um jogador compra.
  const ITENS_DE_TIME = new Set(['assault', 'shivas_guard', 'crimson_guard', 'pipe', 'guardian_greaves', 'spirit_vessel', 'solar_crest', 'monkey_king_bar', 'dust', 'gem', 'heavens_halberd', 'lotus_orb', 'skadi']);
  const AURAS = new Set(['assault', 'shivas_guard', 'crimson_guard', 'pipe', 'guardian_greaves']);
  // Resposta por posição para cada tipo de ameaça. A ordem das posições é a prioridade.
  const RESPOSTAS = {
    fisico: [
      { pos: [3], itens: ['crimson_guard', 'assault', 'shivas_guard'], por: 'aura de armadura e bloqueio para o time inteiro' },
      { pos: [5], itens: ['ghost', 'force_staff'], por: 'fica imune a ataque quando ele pular em você' },
      { pos: [4], itens: ['solar_crest', 'force_staff'], por: 'armadura no aliado que ele focar' },
      { pos: [1, 2], todos: true, itens: ['heavens_halberd', 'butterfly', 'black_king_bar'], por: 'desarma ou desvia os ataques dele na luta' },
    ],
    magico: [
      { pos: [3, 4], itens: ['pipe'], por: 'escudo mágico para o time inteiro' },
      { pos: [5, 4], itens: ['glimmer_cape', 'force_staff'], por: 'resistência mágica e fuga para você ou um aliado' },
      { pos: [1, 2], todos: true, itens: ['black_king_bar'], por: 'imunidade a magia para bater na luta' },
    ],
    cura: [
      { pos: [4, 3, 5], itens: ['spirit_vessel'], por: 'corta a cura deles', um: true },
      { pos: [1, 2], itens: ['skadi', 'shivas_guard'], por: 'corta a cura deles', um: true },
    ],
    invis: [{ pos: [5, 4], itens: ['dust', 'ward_sentry'], por: 'revela quem fica invisível', um: true }],
    evasao: [{ pos: [1, 2, 3], itens: ['monkey_king_bar'], por: 'ignora a evasão', um: true }],
  };

  function alocarItensDoTime(ctx, inimigo) {
    const recebido = (p, e) => Number((p.raw.damage_taken || {})[e.heroi.npc]) || 0;
    const totalTime = soma(ctx.nos, (p) => soma(Object.entries(p.raw.damage_taken || {}).filter(([k]) => k.startsWith('npc_dota_hero_')).map(([, v]) => v)));
    // ameaças do time inteiro: dano em todos vocês + mortes que causou
    const ameacas = ctx.eles.map((e) => {
      const base = (e.heroi.npc || '').replace('npc_dota_hero_', '');
      const dano = soma(ctx.nos, (p) => recebido(p, e));
      const hab = soma(ctx.nos, (p) => soma(Object.entries(p.raw.damage_inflictor_received || {}).filter(([k]) => base && k.startsWith(`${base}_`)).map(([, v]) => v)));
      const mortes = soma(ctx.nos, (p) => (ctx.mortes ? ctx.mortes[p.idx] : []).filter((d) => d.assassino === e.idx).length);
      const primeira = Math.min(...ctx.nos.flatMap((p) => (ctx.mortes ? ctx.mortes[p.idx] : []).filter((d) => d.assassino === e.idx && d.t >= 600).map((d) => d.t)));
      return { jogador: e, dano, fracao: totalTime ? dano / totalTime : 0, fracFisica: dano ? Math.max(0, dano - hab) / dano : 0, mortes, primeira: Number.isFinite(primeira) ? primeira : null };
    }).filter((a) => a.dano > 0).sort((a, b) => b.dano + b.mortes * 1500 - (a.dano + a.mortes * 1500)).slice(0, 2);

    const necessidades = ameacas.map((a, i) => ({
      tipo: a.fracFisica >= 0.55 ? 'fisico' : a.fracFisica <= 0.45 ? 'magico' : (i === 0 ? 'fisico' : 'magico'),
      contra: a.jogador.heroi.nome,
      porque: `${a.jogador.heroi.nome} fez ${pct(a.fracao)} do dano de heróis em vocês e matou ${a.mortes}`,
      nota: (NOTAS_HEROI[a.jogador.heroi.id] || {}).nota || null,
      quando: [a.primeira, ctx.ancora].filter((x) => x != null).sort((x, y) => x - y)[0] ?? null,
      peso: 3 - i,
    }));
    if (inimigo.curaTotal >= 8000) necessidades.push({ tipo: 'cura', contra: 'a cura deles', porque: `o time inimigo curou ${fmtK(inimigo.curaTotal)}`, quando: ctx.ancora, peso: 1.5 });
    // invisível de nascença pede revelação desde cedo; com item, a partir da compra
    const tInvis = Math.min(...inimigo.invis.map((e) => (HEROIS_INVISIVEIS.has(e.heroi.id) ? 12 * 60 : Math.min(...(e.raw.purchase_log || []).filter((x) => ITENS_INVIS.has(x.key)).map((x) => Number(x.time) || 0)))));
    if (inimigo.invis.length) necessidades.push({ tipo: 'invis', contra: inimigo.invis.map((e) => e.heroi.nome).join(' e '), porque: `${inimigo.invis.map((e) => e.heroi.nome).join(' e ')} fica invisível`, quando: Number.isFinite(tInvis) ? tInvis : 12 * 60, peso: 1.4 });
    if (inimigo.butterfly.length) necessidades.push({ tipo: 'evasao', contra: inimigo.butterfly.map((e) => e.heroi.nome).join(' e '), porque: `${inimigo.butterfly.map((e) => e.heroi.nome).join(' e ')} tem Butterfly`, quando: ctx.ancora, peso: 1.3 });

    const comprou = new Map(ctx.nos.map((p) => [p.idx, new Map((p.raw.purchase_log || []).map((x) => [x.key, Number(x.time) || 0]))]));
    const doTime = new Set(); // itens de time já comprados ou atribuídos
    for (const p of ctx.nos) for (const k of comprou.get(p.idx).keys()) if (ITENS_DE_TIME.has(k)) doTime.add(k);
    const porJogador = new Map(ctx.nos.map((p) => [p.idx, []]));
    const acertos = new Map(ctx.nos.map((p) => [p.idx, []]));
    const tardes = new Map(ctx.nos.map((p) => [p.idx, []]));
    const plano = [];
    for (const n of necessidades) {
      let resolvida = false;
      for (const resp of RESPOSTAS[n.tipo]) {
        if (resolvida && resp.um) break;
        // aura/contra-item de time: prefere quem ainda não tem nenhum atribuído
        const candidatos = resp.pos.map((pos) => ctx.nos.find((j) => j.posicao === pos)).filter(Boolean);
        const temAuraAtribuida = (p) => porJogador.get(p.idx).some((x) => AURAS.has(x.key));
        const ordem = resp.itens.some((k) => AURAS.has(k)) ? [...candidatos.filter((p) => !temAuraAtribuida(p)), ...candidatos.filter(temAuraAtribuida)] : candidatos;
        for (const p of ordem) {
          const tem = resp.itens.find((k) => comprou.get(p.idx).has(k));
          if (tem) {
            const tCompra = comprou.get(p.idx).get(tem);
            const alvo = n.tipo === 'cura' ? 'o corte de cura' : n.tipo === 'invis' ? `a invisibilidade de ${n.contra}` : `a ameaça de ${n.contra}`;
            const prazoReal = n.quando != null ? Math.max(n.quando, prazoMinimo(itemInfo(ctx.items, tem).custo)) : null;
            if (prazoReal != null && tCompra > prazoReal + 300) {
              if (!tardes.get(p.idx).some((x) => x.key === tem)) tardes.get(p.idx).push({ key: tem, texto: `${itemInfo(ctx.items, tem).nome} era a resposta certa para ${alvo}, mas só saiu lá pelos ${minutos(tCompra)}; o ideal era ter antes dos ${minutos(prazoReal)}.` });
            }
            else acertos.get(p.idx).push(`${itemInfo(ctx.items, tem).nome} (${mmss(tCompra)}) já cobria ${alvo}.`);
            resolvida = true;
            if (resp.todos) continue;
            break;
          }
          const key = itemDoPapel(p, resp.itens).find((k) => ctx.items[k] && !(ITENS_DE_TIME.has(k) && doTime.has(k)) && !porJogador.get(p.idx).some((x) => x.key === k));
          if (!key) continue;
          if (ITENS_DE_TIME.has(key)) doTime.add(key);
          const info = itemInfo(ctx.items, key);
          const custo = info.custo || 0;
          const minimo = prazoMinimo(custo);
          const quando = n.quando != null ? Math.max(n.quando, minimo) : minimo || null;
          const sug = {
            ...info, contra: n.contra, prioridade: n.peso + 1, quando, porque: 'time', papel: resp.por,
            curto: `${resp.por}, contra ${n.contra}`,
            motivo: `${n.porque}. ${resp.por.charAt(0).toUpperCase() + resp.por.slice(1)}.${n.nota ? ` ${n.nota}` : ''}`,
          };
          porJogador.get(p.idx).push(sug);
          plano.push({ jogador: p, ...sug });
          resolvida = true;
          if (!resp.todos) break;
        }
        if (resolvida && resp.um) break;
      }
    }
    return { ameacas, necessidades, porJogador, acertos, tardes, plano: plano.sort((a, b) => a.jogador.posicao - b.jogador.posicao) };
  }

  // Para cada ameaça do time: o item de time que a respondia (dono pela posição) e o item pessoal
  // de quem mais morreu para ela. Divide a responsabilidade com números, sem proteger ninguém.
  const ITEM_TIME_POR_TIPO = { magico: { keys: ['pipe'], pos: [3, 4] }, fisico: { keys: ['crimson_guard', 'assault', 'shivas_guard'], pos: [3, 4] } };
  const ITEM_PESSOAL_POR_TIPO = {
    magico: { core: ['black_king_bar'], suporte: ['glimmer_cape', 'force_staff', 'cyclone'] },
    fisico: { core: ['black_king_bar', 'butterfly', 'heavens_halberd', 'manta', 'satanic'], suporte: ['ghost', 'force_staff', 'glimmer_cape'] },
  };

  function debatesDeItens(ctx) {
    const debates = [];
    const nwEm = (p, t) => ((p.raw.networth_t || p.raw.gold_t || [])[Math.min(Math.floor(t / 60), (p.raw.networth_t || p.raw.gold_t || []).length - 1)] ?? null);
    for (const a of ctx.alocacao.ameacas) {
      const tipo = a.fracFisica >= 0.55 ? 'fisico' : a.fracFisica <= 0.45 ? 'magico' : null;
      if (!tipo) continue;
      const e = a.jogador;
      // quem mais sofreu com essa ameaça
      const vitimas = ctx.nos.map((p) => {
        const mortes = (ctx.mortes ? ctx.mortes[p.idx] : []).filter((d) => d.assassino === e.idx).map((d) => d.t);
        return { p, mortes, dano: Number((p.raw.damage_taken || {})[e.heroi.npc]) || 0 };
      }).sort((x, y) => y.mortes.length - x.mortes.length || y.dano - x.dano);
      const vitima = vitimas[0];
      if (!vitima || !vitima.mortes.length) continue;
      const compra = (p, keys) => {
        const x = (p.raw.purchase_log || []).find((c) => keys.includes(c.key));
        return x ? { key: x.key, nome: itemInfo(ctx.items, x.key).nome, t: Number(x.time) || 0 } : null;
      };
      // item de time: alguém do time comprou? senão, o dono pela posição
      const it = ITEM_TIME_POR_TIPO[tipo];
      const quemComprou = ctx.nos.map((p) => ({ p, c: compra(p, it.keys) })).find((x) => x.c);
      const dono = quemComprou ? quemComprou.p : it.pos.map((pos) => ctx.nos.find((j) => j.posicao === pos)).find(Boolean);
      const itemTime = quemComprou ? quemComprou.c : null;
      // item pessoal de quem mais sofreu
      const pess = ITEM_PESSOAL_POR_TIPO[tipo][vitima.p.funcao];
      const itemPessoal = compra(vitima.p, pess);
      // horário realista de cada item: antes disso, não dá para cobrar ninguém
      const PRAZO = { pipe: 18, crimson_guard: 16, assault: 25, shivas_guard: 25, black_king_bar: 22, butterfly: 28, heavens_halberd: 22, manta: 22, satanic: 30, ghost: 12, force_staff: 14, glimmer_cape: 14, cyclone: 15 };
      const prazoDe = (keys) => 60 * Math.min(...keys.map((k) => PRAZO[k] || 20));
      const prazoTime = prazoDe(it.keys);
      const prazoPessoal = prazoDe(pess);
      const nMortes = vitima.mortes.length;
      const cobraveisTime = vitima.mortes.filter((m) => m >= prazoTime && (!itemTime || m < itemTime.t));
      const cobraveisPessoal = vitima.mortes.filter((m) => m >= prazoPessoal && (!itemPessoal || m < itemPessoal.t));
      const nomeTime = tipo === 'magico' ? 'Pipe' : 'aura de armadura (Crimson, Assault ou Shiva)';
      const nomesPessoal = (() => { const n = pess.slice(0, 3).map((k) => itemInfo(ctx.items, k).nome); return n.length > 1 ? `${n.slice(0, -1).join(', ')} ou ${n[n.length - 1]}` : n[0]; })();
      const tipoTxt = tipo === 'magico' ? 'mágico' : 'físico';
      const vezes = (n) => `${n} ${n === 1 ? 'morte' : 'mortes'}`;
      const buildAte = (p, t) => (p.raw.purchase_log || []).filter((c) => (Number(c.time) || 0) <= t && ehItemDeBuild(c.key, ctx.items, conjuntoComponentes(ctx.items)) && (itemInfo(ctx.items, c.key).custo || 0) >= 2000).map((c) => itemInfo(ctx.items, c.key).nome);
      const ultimaCobravel = cobraveisTime[cobraveisTime.length - 1];
      const fatos = [
        `${vitima.p.nome} (${vitima.p.heroi.nome}) foi quem mais sofreu: morreu ${nMortes} ${nMortes === 1 ? 'vez' : 'vezes'} para ${e.heroi.nome}, que batia em vocês ${tipo === 'magico' ? 'quase só com magia' : 'quase só no ataque físico'}.`,
        itemTime
          ? `${quemComprou.p.nome} fechou ${itemTime.nome} lá pelos ${minutos(itemTime.t)}. ${cobraveisTime.length ? `Dos ${minutos(prazoTime)} (quando já dava para ter) até a compra, ${vezes(cobraveisTime.length)} ${cobraveisTime.length === 1 ? 'aconteceu' : 'aconteceram'} sem ele.` : 'Chegou a tempo.'}`
          : `Ninguém comprou ${nomeTime}.${dono ? ` O natural era ${dono.nome} (pos ${dono.posicao}, ${dono.heroi.nome}), e a partir dos ${minutos(prazoTime)} já dava para ter: depois disso, ${vezes(cobraveisTime.length)}.` : ''}`,
        dono && !itemTime && ultimaCobravel != null ? (() => { const b = buildAte(dono, ultimaCobravel); return b.length ? `No lugar, ${dono.nome} foi de ${b.length > 1 ? `${b.slice(0, -1).join(', ')} e ${b[b.length - 1]}` : b[0]}.` : `Até ali, ${dono.nome} não tinha fechado nenhum item grande.`; })() : null,
        itemPessoal
          ? `${vitima.p.nome} fechou ${itemPessoal.nome} lá pelos ${minutos(itemPessoal.t)}${cobraveisPessoal.length ? `; antes disso, ${vezes(cobraveisPessoal.length)} já ${cobraveisPessoal.length === 1 ? 'dava' : 'davam'} para ter evitado com ele` : ', a tempo'}.`
          : `${vitima.p.nome} não comprou ${nomesPessoal}${cobraveisPessoal.length ? `, e ${vezes(cobraveisPessoal.length)} ${cobraveisPessoal.length === 1 ? 'veio' : 'vieram'} quando já dava para ter um deles` : ''}.`,
      ].filter(Boolean);
      const cedo = vitima.mortes.filter((m) => m < Math.min(prazoTime, prazoPessoal)).length;
      const donoNome = dono ? `${dono.nome} (pos ${dono.posicao})` : 'o time';
      const t1 = cobraveisTime.length;
      const t2 = cobraveisPessoal.length;
      let veredito;
      const foram = (n) => (n === 1 ? 'foi' : 'foram');
      if (!t1 && !t2) veredito = cedo ? `Não dá para culpar a build: ${vezes(cedo)} ${foram(cedo)} antes de qualquer item fazer sentido e, depois disso, os itens estavam lá. O problema foi posicionamento.` : 'Os dois itens estavam lá: o problema foi posicionamento, não build.';
      else if (t1 && t2) veredito = `Os dois dividem: ${vezes(t1)} sem ${nomeTime} de ${donoNome} e ${vezes(t2)} sem ${nomesPessoal} de ${vitima.p.nome}.`;
      else if (t1) veredito = `Aqui pesa mais para ${donoNome}: ${vitima.p.nome} já tinha a defesa pessoal, e ${vezes(t1)} vieram sem ${nomeTime} no time.`;
      else veredito = `Aqui pesa mais para ${vitima.p.nome}: ${vezes(t2)} vieram sem ${nomesPessoal}, e o item de time não resolvia sozinho.`;
      if (cedo && (t1 || t2)) veredito += ` (${vezes(cedo)} ${foram(cedo)} cedo demais para cobrar item.)`;
      const faltouTime = t1 / nMortes;
      const faltouPessoal = t2 / nMortes;
      debates.push({ ameaca: e, tipo, vitima: vitima.p, dono, itemTime, itemPessoal, fatos, veredito, faltouTime, faltouPessoal });
    }
    return debates;
  }

  // ---------------------------------------------------------------- leitura de build (tom de coach)

  // Para que serve cada item, para descrever a intenção da build em palavras.
  const INTENCAO_ITEM = {
    farm: ['bfury', 'maelstrom', 'mjollnir', 'radiance', 'hand_of_midas', 'gungir'],
    dano: ['desolator', 'greater_crit', 'monkey_king_bar', 'silver_edge', 'invis_sword', 'sange_and_yasha', 'yasha_and_kage', 'kaya_and_sange', 'skadi', 'abyssal_blade', 'basher', 'bloodthorn', 'nullifier', 'diffusal_blade', 'disperser', 'echo_sabre', 'harpoon', 'orchid', 'daedalus', 'yasha', 'sange', 'kaya', 'dagon', 'ethereal_blade', 'revenants_brooch', 'witch_blade', 'phylactery', 'khanda', 'mage_slayer', 'parasma'],
    defesa: ['black_king_bar', 'aeon_disk', 'satanic', 'manta', 'sphere', 'heart', 'butterfly', 'ghost', 'blade_mail', 'heavens_halberd', 'hood_of_defiance', 'eternal_shroud', 'crimson_guard', 'pipe', 'assault', 'shivas_guard', 'vanguard', 'lotus_orb', 'bloodstone', 'octarine_core'],
    luta: ['blink', 'overwhelming_blink', 'swift_blink', 'arcane_blink', 'refresher', 'ultimate_scepter', 'sheepstick', 'cyclone', 'wind_waker', 'rod_of_atos', 'gleipnir', 'force_staff', 'hurricane_pike', 'glimmer_cape', 'solar_crest', 'spirit_vessel', 'urn_of_shadows', 'mekansm', 'guardian_greaves', 'holy_locket', 'aether_lens', 'veil_of_discord', 'boots_of_bearing', 'meteor_hammer'],
    botas: ['power_treads', 'phase_boots', 'arcane_boots', 'tranquil_boots', 'travel_boots', 'travel_boots_2', 'guardian_greaves', 'boots_of_bearing'],
  };
  const intencaoDe = (key) => Object.keys(INTENCAO_ITEM).find((k) => INTENCAO_ITEM[k].includes(key)) || null;
  const RESPONDE = {
    fisico: new Set(['ghost', 'force_staff', 'heavens_halberd', 'butterfly', 'shivas_guard', 'assault', 'crimson_guard', 'solar_crest', 'blade_mail', 'black_king_bar', 'aeon_disk', 'manta', 'satanic', 'hurricane_pike', 'glimmer_cape', 'cyclone', 'wind_waker']),
    magico: new Set(['black_king_bar', 'pipe', 'glimmer_cape', 'hood_of_defiance', 'eternal_shroud', 'force_staff', 'cyclone', 'wind_waker', 'lotus_orb', 'sphere', 'aeon_disk', 'manta']),
  };
  // item caro não fica pronto cedo: antes disso não dá para cobrar ninguém
  const prazoMinimo = (custo) => ((custo || 0) >= 4000 ? 20 * 60 : (custo || 0) >= 2500 ? 15 * 60 : (custo || 0) >= 1500 ? 12 * 60 : 0);
  const minutos = (t) => `${Math.max(1, Math.round(t / 60))} min`;
  const juntarNomes = (xs) => (xs.length <= 1 ? xs.join('') : `${xs.slice(0, -1).join(', ')} e ${xs[xs.length - 1]}`);

  // Uma frase por ameaça, sem porcentagem: quanto machucou, de que jeito, e quantas vezes te pegou.
  const VARIA_AMEACA = {
    maior: ['foi quem mais te machucou, de longe'],
    grande: ['foi uma das maiores fontes de dano em você', 'também pesou bastante no dano que você tomou', 'completou o estrago'],
    fecha: ['não foi quem mais bateu, mas era quem fechava as suas mortes', 'também chegava na hora de fechar a conta', 'aparecia sempre no fim das suas mortes'],
    leve: ['te incomodou o jogo todo', 'também te incomodou', 'apareceu menos, mas pesou'],
  };
  function frasesDeAmeaca(a, p, i, usados) {
    const e = a.jogador.heroi.nome;
    const nivel = a.fracao >= 0.4 ? 'maior' : a.fracao >= 0.25 ? 'grande' : a.mortes >= 3 ? 'fecha' : 'leve';
    const k = usados[nivel] || 0;
    usados[nivel] = k + 1;
    const quanto = VARIA_AMEACA[nivel][k % VARIA_AMEACA[nivel].length];
    const jeito = a.fracFisica >= 0.6 ? 'quase tudo no ataque físico'
      : a.fracFisica <= 0.4 ? `quase tudo com habilidade${a.habilidades.length ? ` (${juntarNomes(a.habilidades.map((x) => x.nome))})` : ''}`
        : 'misturando ataque e habilidade';
    const mortes = a.mortes === 0 ? 'mas não chegou a te matar' : a.mortes === 1 ? 'e te matou uma vez' : `e te pegou ${a.mortes} vezes`;
    const partes = [`${e} ${quanto}: ${jeito}, ${mortes}.`];
    if (a.matchup && a.matchup.wr <= 0.46) partes.push(`É um confronto ruim para ${p.heroi.nome}: no geral perde mais do que ganha contra ele, então não dá para trocar golpe de igual para igual.`);
    else if (a.matchup && a.matchup.wr >= 0.54) partes.push(`No papel o confronto é bom para ${p.heroi.nome}; o problema foi como a luta aconteceu, não o herói.`);
    const itens = a.itens.slice(0, 3).map((x) => x.nome);
    if (itens.length) partes.push(`A build dele: ${juntarNomes(itens)}.`);
    return partes.join(' ');
  }

  // Leitura da build como um coach faria: o que ela buscava, o que chegou tarde,
  // o que faltou contra quem te bateu e o caminho para a próxima. Poucos números.
  function leituraDaBuild(v, ctx) {
    const p = v.jogador;
    const it = v.itens;
    const core = p.funcao === 'core';
    const paragrafos = [];
    const grandes = it.compras.filter((c) => (c.custo || 0) >= 1800 && intencaoDe(c.key) !== 'botas');
    const botas = it.compras.find((c) => intencaoDe(c.key) === 'botas');
    const timingDe = (c) => it.timings.find((t) => t.item === c.key && t.t === c.t);

    // 1. o caminho da build
    if (!it.compras.length) {
      paragrafos.push(core ? 'Sem registro de compras: o replay não foi analisado, então não dá para ler a build.' : 'Sem itens grandes no jogo: o ouro foi em wards, consumíveis e botas.');
    } else {
      const intencoes = grandes.map((c) => intencaoDe(c.key)).filter(Boolean);
      const conta = (k) => intencoes.filter((x) => x === k).length;
      const dominante = ['farm', 'dano', 'defesa', 'luta'].sort((a, b) => conta(b) - conta(a))[0];
      const DESC = { farm: 'uma build de farm, pensada para acelerar o ouro', dano: 'uma build de dano, para matar rápido', defesa: 'uma build para sobreviver na luta', luta: 'uma build de luta e utilidade para o time' };
      const nomes = grandes.slice(0, 4).map((c) => c.nome);
      if (nomes.length) {
        const caminho = `${botas ? `${botas.nome}, ` : ''}${juntarNomes(nomes)}`;
        paragrafos.push(conta(dominante) ? `Você foi de ${caminho}: ${DESC[dominante]}.` : `Você foi de ${caminho}.`);
      } else if (botas) {
        paragrafos.push(core ? `A build parou em ${botas.nome}: nenhum item grande saiu, e um core sem item não segura luta nenhuma.` : `Fora ${botas.nome}, o ouro foi em wards e consumíveis, o que é normal para suporte; mas um item de salvamento no meio do jogo faz falta.`);
      }
      const primeiro = grandes[0];
      const tPrimeiro = primeiro ? timingDe(primeiro) : null;
      const tipico = primeiro ? horarioTipico(ctx.timings, p.heroi.id, primeiro.key) : null;
      if (primeiro && core && (tipico != null ? primeiro.t > tipico + 240 : tPrimeiro && tPrimeiro.veredito === 'atrasado')) {
        paragrafos.push(`O problema é o relógio: ${primeiro.nome} só ficou pronto lá pelos ${minutos(primeiro.t)}${tipico != null ? `, quando quem joga de ${p.heroi.nome} costuma fechar por volta dos ${minutos(tipico)}` : ''}. O meio do jogo passou com você ainda fraco.`);
      } else if (primeiro && tPrimeiro && tPrimeiro.veredito === 'bom') {
        paragrafos.push(`${primeiro.nome} saiu cedo, no horário de quem vence com ${p.heroi.nome}. Essa foi a melhor parte da sua build.`);
      }
    }

    // 2. contra quem te bateu
    const a = it.ameacas[0];
    if (a && it.compras.length) {
      const tipo = a.fracFisica >= 0.6 ? 'fisico' : a.fracFisica <= 0.4 ? 'magico' : null;
      const e = a.jogador.heroi.nome;
      const golpe = tipo === 'fisico' ? 'batendo físico' : tipo === 'magico' ? 'na base da magia' : 'com ataque e habilidade';
      const pegou = a.mortes >= 2 ? ` e te pegou ${a.mortes} vezes` : a.mortes === 1 ? ' e te matou uma vez' : '';
      const resposta = tipo ? it.compras.filter((c) => RESPONDE[tipo].has(c.key)) : [];
      let txt = `Quem mais te castigou foi ${e}, ${golpe}${pegou ? `,${pegou}` : ''}.`;
      if (!tipo) txt += ' Não tem um item só que resolva; aqui pesa mais posicionamento.';
      else if (resposta.length) {
        const r = resposta[0];
        const tardes = (ctx.alocacao && ctx.alocacao.tardes.get(p.idx)) || [];
        const tarde = tardes.some((x) => x.key === r.key) || (a.primeiraMorte != null && r.t > Math.max(a.primeiraMorte, prazoMinimo(r.custo)) + 300);
        txt += tarde ? ` A sua build até respondia com ${r.nome}, mas ele chegou tarde: quando ficou pronto, ${e} já tinha feito o estrago.` : ` ${r.nome} era a resposta certa e chegou a tempo; daí em diante o problema foi mais posição do que item.`;
      } else {
        const foco = grandes.length ? { farm: 'farm', dano: 'dano', defesa: 'defesa', luta: 'utilidade' }[intencaoDe(grandes[0].key)] || 'outras coisas' : 'outras coisas';
        txt += ` Nada na sua build respondia a isso: o ouro foi para ${foco}, e ${e} encontrou você sempre do mesmo jeito.`;
      }
      paragrafos.push(txt);
    }

    // 3. o caminho para a próxima
    const sg = it.sugestoes.slice(0, 2).sort((x, y) => (y.sobrevivencia ? 1 : 0) - (x.sobrevivencia ? 1 : 0) || (x.quando ?? 1e9) - (y.quando ?? 1e9));
    const est = it.estado;
    if (est && est.apanhando) {
      const tipoTxt = { magico: 'de magia', fisico: 'de ataque físico', misto: 'de ataque e magia' }[est.tipo];
      ctx.contextoUsado = (ctx.contextoUsado || 0) + 1;
      const abre = ['O contexto importa: você chegou ao meio do jogo apanhando', 'Olhando o momento do jogo: você entrou no meio do jogo atrás', 'Antes de pensar em item, o estado do jogo: você estava apanhando'][(ctx.contextoUsado - 1) % 3];
      paragrafos.push(`${abre} (${est.motivos.join(', ')})${est.quem ? `, e o dano que te matava era ${tipoTxt}, principalmente de ${est.quem}` : ''}. Nessa situação a build muda: primeiro sobreviver, depois farmar.${it.ganancia ? ` ${it.ganancia.nome} é o item mais comum de ${p.heroi.nome} no meio do jogo, mas é item de quem está na frente: atrás e morrendo, só aumenta o alvo nas suas costas.` : ''}`);
    }
    if (sg.length) {
      const motivo = (x) => (x.sobrevivencia ? `${x.papel}${x.saiu != null ? `; o seu saiu lá pelos ${minutos(x.saiu)}, depois do estrago` : ''}${x.popular && x.saiu == null ? ` (é a escolha defensiva mais comum de quem joga de ${p.heroi.nome})` : ''}${x.jogos ? `; ${x.jogos}` : ''}` : x.papel ? `${x.papel}${x.contra ? `, contra ${x.contra}` : ''}` : x.atrasado ? 'é o item central do herói e precisa sair mais cedo' : x.prioridade === 1 ? `é o que quase todo ${p.heroi.nome} faz no meio do jogo` : x.contra ? `responde a ${x.contra}` : 'fecha o buraco da build');
      const ordem = sg.map((x) => `${x.nome}${x.quando != null ? ` até uns ${minutos(x.quando)}` : ''}`);
      const base = botas ? `depois de ${botas.nome}, ` : '';
      const porques = sg.length === 2 && sg.every((x) => x.atrasado && !x.sobrevivencia)
        ? `Os dois são o centro do ${p.heroi.nome} e saíram tarde demais`
        : sg.map((x) => (x.papel ? `${x.nome}: ${motivo(x)}` : `${x.nome} porque ${motivo(x)}`)).join('. ');
      paragrafos.push(`Na próxima: ${base}${juntarNomes(ordem)}. ${porques}.`);
    }
    return paragrafos;
  }

  // ---------------------------------------------------------------- a história da partida

  // Narrativa em parágrafos a partir dos dados: o que se esperava de cada rota, o que aconteceu,
  // quem rotacionou, quem disparou, onde o jogo virou e como acabou.
  function historiaDaPartida(ctx, rotas, venceu) {
    const { nos, eles, jog } = ctx;
    const mortesDe = (i) => (ctx.mortes ? ctx.mortes[i] : []);
    const nomeH = (i) => jog[i].heroi.nome;
    const quemE = (p) => (p.radiant === nos[0].radiant ? `${p.heroi.nome} (${p.nome})` : p.heroi.nome);
    const lista = (xs) => (xs.length <= 1 ? xs.join('') : `${xs.slice(0, -1).join(', ')} e ${xs[xs.length - 1]}`);
    const radiant = nos[0].radiant;
    const laneDeJ = (p) => laneDe(p.raw, p.radiant);
    const capitulos = [];

    // 1. rotas
    const NOMES_ROTA = { mid: 'Mid', safe: 'Safe lane', off: 'Offlane' };
    for (const l of rotas) {
      const nossos = l.nos.map(quemE);
      const deles = l.eles.map(quemE);
      const frases = [`${lista(nossos)} contra ${lista(deles)}.`];
      if (l.expectativa && l.expectativa.texto) frases.push(l.expectativa.texto);
      // mortes na rota antes dos 10 min, dos dois lados, entre quem jogou nela
      const naRota = [...l.nos, ...l.eles];
      const doNaRota = new Set(naRota.map((v) => v.idx));
      const eventos = naRota.flatMap((v) => mortesDe(v.idx).filter((d) => d.t >= 90 && d.t < 600).map((d) => ({ ...d, vitima: v })))
        .filter((d) => d.assassino != null && doNaRota.has(d.assassino)).sort((a, b) => a.t - b.t);
      const antes = l.nos.flatMap((v) => mortesDe(v.idx).filter((d) => d.t < 90 && d.assassino != null).map((d) => ({ ...d, vitima: v })));
      if (antes.length) frases.push(`Antes das rotas começarem, ${lista(antes.map((d) => `${nomeH(d.assassino)} pegou ${d.vitima.heroi.nome} aos ${mmss(d.t)}`))}${antes.some((d) => d.t <= 60) ? ' (first blood na briga de runa)' : ''}.`);
      const nossasMortes = eventos.filter((d) => l.nos.includes(d.vitima));
      const delas = eventos.filter((d) => l.eles.includes(d.vitima));
      const descrever = (ds) => {
        const porPar = new Map();
        for (const d of ds) {
          const k = `${d.assassino}>${d.vitima.idx}`;
          if (!porPar.has(k)) porPar.set(k, { assassino: d.assassino, vitima: d.vitima, tempos: [] });
          porPar.get(k).tempos.push(mmss(d.t));
        }
        return [...porPar.values()].map((x) => `${nomeH(x.assassino)} matou ${x.vitima.radiant === radiant ? x.vitima.heroi.nome : x.vitima.heroi.nome} ${x.tempos.length > 1 ? `${x.tempos.length} vezes (${lista(x.tempos)})` : `aos ${x.tempos[0]}`}`);
      };
      if (nossasMortes.length) frases.push(`${frase0(lista(descrever(nossasMortes)))}.`);
      if (delas.length) frases.push(`Do outro lado, ${lista(descrever(delas))}.`);
      if (!nossasMortes.length && !delas.length) frases.push('Ninguém morreu na rota antes dos 10 min.');
      const lh = (p) => (p && p.raw.lh_t ? p.raw.lh_t[Math.min(10, p.raw.lh_t.length - 1)] : null);
      if (l.coreNos && l.coreEles && lh(l.coreNos) != null && lh(l.coreEles) != null && Math.abs(lh(l.coreNos) - lh(l.coreEles)) >= 10) {
        frases.push(`No farm, ${l.coreNos.heroi.nome} tinha ${lh(l.coreNos)} last hits aos 10 min contra ${lh(l.coreEles)} de ${l.coreEles.heroi.nome}.`);
      }
      const media = l.diffMedia;
      const res = l.resultado === 'ganhou' ? `ganharam a rota por ${fmtK(media)} de média por herói` : l.resultado === 'perdeu' ? `perderam a rota por ${fmtK(-media)} de média por herói` : 'a rota terminou empatada';
      let vsEsperado = '';
      if (l.expectativa && l.expectativa.esperado != null) {
        const sobra = (l.diffComXp ?? media) - l.expectativa.esperado;
        vsEsperado = sobra < -400 ? ', bem pior do que o matchup pedia' : sobra > 400 ? ', melhor do que o matchup prometia' : ', dentro do esperado para esse matchup';
      }
      frases.push(`Aos 10 min, ${res}${vsEsperado}.`);
      capitulos.push({ fase: 'rotas', titulo: `${NOMES_ROTA[l.tipo] || 'Rota'}: ${l.nos.map((p) => p.heroi.nome).join(' e ')} x ${l.eles.map((p) => p.heroi.nome).join(' e ')}`, texto: frases.join(' '), resultado: l.resultado });
    }

    // 2. rotações antes dos 12 min (quem matou fora da própria rota)
    const rotacoes = (killers, vitimas) => {
      const out = new Map();
      for (const v of vitimas) for (const d of mortesDe(v.idx)) {
        if (d.t < 90 || d.t >= 720 || d.assassino == null) continue;
        const k = jog[d.assassino];
        if (!killers.includes(k) || laneDeJ(k) == null || laneDeJ(k) === laneDeJ(v)) continue;
        if (!out.has(k)) out.set(k, []);
        out.get(k).push({ vitima: v, t: d.t });
      }
      return out;
    };
    const ROTA_NOME = { 1: radiant ? 'safe lane de vocês' : 'offlane de vocês', 2: 'mid', 3: radiant ? 'offlane de vocês' : 'safe lane de vocês' };
    const rotDeles = rotacoes(eles, nos);
    const rotNossas = rotacoes(nos, eles);
    const textosRot = [];
    for (const [k, ms] of rotDeles) {
      const rotaDele = rotas.find((l) => l.eles.includes(k));
      const contexto = rotaDele && rotaDele.resultado === 'perdeu' ? `Com a ${rotaDele.tipo === 'mid' ? 'mid' : 'rota'} ganha, ` : '';
      const vitimas = [...new Set(ms.map((m) => m.vitima))];
      const onde = [...new Set(vitimas.map((v) => ROTA_NOME[laneDeJ(v)]).filter(Boolean))];
      textosRot.push(`${contexto}${k.heroi.nome} saiu da rota e matou ${lista(vitimas.map((v) => `${v.heroi.nome} (${lista(ms.filter((m) => m.vitima === v).map((m) => mmss(m.t)))})`))}${onde.length ? ` na ${lista(onde)}` : ''}.`);
    }
    // abate fora da rota: se a vítima matou alguém na rota do assassino no mesmo minuto, quem rotacionou foi ela
    const veioAte = (vitima, assassino, t) => (assassino.radiant === radiant ? nos : eles).some((x) => laneDeJ(x) === laneDeJ(assassino) && mortesDe(x.idx).some((d) => d.assassino === vitima.idx && Math.abs(d.t - t) <= 60));
    const foram = [];
    const pegaram = [];
    for (const [k, ms] of rotNossas) for (const m of ms) (veioAte(m.vitima, k, m.t) ? pegaram : foram).push({ k, ...m });
    if (foram.length) textosRot.push(`Do lado de vocês, ${lista([...new Set(foram.map((x) => x.k))].map((k) => `${k.heroi.nome} saiu da rota e pegou ${lista([...new Set(foram.filter((x) => x.k === k).map((x) => x.vitima.heroi.nome))])}`))}.`);
    if (pegaram.length) textosRot.push(`E a rotação deles teve preço: ${lista(pegaram.map((x) => `${x.vitima.heroi.nome} morreu para ${x.k.heroi.nome} aos ${mmss(x.t)}`))}.`);
    if (textosRot.length) {
      const midPerdida = rotas.find((l) => l.tipo === 'mid' && l.resultado === 'perdeu');
      const aviso = midPerdida && [...rotDeles.keys()].some((k) => laneDeJ(k) === 2) ? ' É o preço de uma mid perdida: o mid deles fica livre para decidir as outras rotas.' : '';
      capitulos.push({ fase: 'rotacoes', titulo: 'Rotações', texto: textosRot.join(' ') + aviso });
    }

    // 3. quem disparou (5+ abates em vocês até os 20 min)
    const disparou = eles.map((e) => {
      const vitimas = nos.map((p) => ({ p, n: mortesDe(p.idx).filter((d) => d.assassino === e.idx && d.t < 1200).length })).filter((x) => x.n);
      return { e, total: soma(vitimas, (x) => x.n), vitimas: vitimas.sort((a, b) => b.n - a.n) };
    }).filter((x) => x.total >= CULPA.snowballAbates).sort((a, b) => b.total - a.total);
    if (disparou.length) {
      const partes = disparou.map((x) => {
        const r = x.e.raw;
        const fonte = x.vitimas.slice(0, 3).map((v) => `${v.p.heroi.nome} ${v.n}`);
        return `${x.e.heroi.nome} fez ${x.total} abates em vocês até os 20 min (${lista(fonte)}) e terminou ${r.kills}/${r.deaths}/${r.assists} com ${r.gold_per_min} de GPM`;
      });
      capitulos.push({ fase: 'snowball', titulo: disparou.length > 1 ? 'Quem disparou' : `${disparou[0].e.heroi.nome} disparou`, texto: `${partes.join('; ')}. Cada morte para quem já está na frente vira o próximo item dele.` });
    }

    // 4. onde o jogo virou
    const momento = venceu ? ctx.viradas[0] : ctx.quedas[0];
    if (momento && Math.abs(momento.delta) >= 3000) {
      const de = (ctx.lead || [])[momento.inicio];
      const ate = (ctx.lead || [])[momento.fim];
      const placar = (x) => (x == null ? '' : x >= 0 ? `+${fmtK(x)}` : `−${fmtK(-x)}`);
      const nossasM = momento.mortes.length;
      const delasM = momento.mortesEles.length;
      const torres = momento.objetivos.filter((o) => o.favor === (venceu ? 'nos' : 'eles') && (o.tipo === 'torre' || o.tipo === 'quartel')).length;
      const quemMorreu = [...new Set(momento.mortes.map((m) => m.jogador))].map((p) => `${p.heroi.nome} ${momento.mortes.filter((m) => m.jogador === p).length}`);
      const texto = venceu
        ? `Entre os min ${momento.inicio} e ${momento.fim} a vantagem foi de ${placar(de)} para ${placar(ate)}: ${delasM} mortes deles contra ${nossasM} de vocês${torres ? ` e ${plural(torres, 'estrutura', 'estruturas')} derrubadas` : ''}.`
        : `Entre os min ${momento.inicio} e ${momento.fim} o placar de ouro foi de ${placar(de)} para ${placar(ate)}: ${nossasM} mortes de vocês (${lista(quemMorreu)}) contra ${delasM} deles${torres ? `, e ${plural(torres, 'estrutura caiu', 'estruturas caíram')}` : ''}. ${momento.manchete || ''}`.trim();
      capitulos.push({ fase: 'virada', titulo: venceu ? 'Onde o jogo foi ganho' : 'Onde o jogo virou', texto });
    }

    // 5. o fim
    const quarteis = ctx.eventos.filter((e) => e.tipo === 'quartel' && e.favor === (venceu ? 'nos' : 'eles'));
    const fimTxt = quarteis.length
      ? `${venceu ? 'Vocês derrubaram' : 'Eles derrubaram'} ${plural(quarteis.length, 'quartel', 'quartéis')} entre ${mmss(quarteis[0].t)} e ${mmss(quarteis[quarteis.length - 1].t)}, e o jogo acabou aos ${mmss(ctx.duracao)}.`
      : `O jogo acabou aos ${mmss(ctx.duracao)}.`;
    capitulos.push({ fase: 'fim', titulo: venceu ? 'Vitória' : 'Derrota', texto: fimTxt });
    return capitulos;
  }
  const frase0 = (t) => (t ? t.charAt(0).toUpperCase() + t.slice(1) : t);

  function planoDeJogo(v) {
    const plano = [];
    const ameacaDe = (nome) => v.itens.ameacas.find((a) => a.jogador.heroi.nome === nome);
    for (const sg of v.itens.sugestoes.slice(0, 2)) {
      const a = sg.contra && ameacaDe(sg.contra);
      const porque = sg.curto ? sg.curto : a
        ? (a.mortes >= 2 ? `${a.jogador.heroi.nome} te pegou ${a.mortes} vezes` : `${a.jogador.heroi.nome} foi quem mais te machucou`)
        : sg.atrasado ? 'é item central do herói e chegou tarde demais' : sg.contra ? `responde a ${sg.contra}` : 'é o que mais se compra com esse herói';
      plano.push(`${sg.nome}${sg.quando != null ? ` até uns ${minutos(sg.quando)}` : ''}: ${porque}.`);
    }
    if (v.tatica) plano.splice(1, 0, v.tatica);
    const obs = (v.itens.observacoes || []).find((o) => o.includes('pare de bater') || o.includes('lute perto'));
    if (plano.length < 3 && obs) plano.push(obs);
    return plano.slice(0, 3);
  }

  // Diagnóstico: o padrão principal do jogador em duas frases (o que aconteceu, o que mudar).
  function diagnostico(v, ctx) {
    const p = v.jogador;
    const s = p.stats;
    const top = v.pesou.map((c) => c.key);
    // rota perdida é causa, mortes depois são consequência: se a rota pesou de verdade, a história começa nela
    const rotaPesou = v.componentes.find((c) => c.key === 'rota' && c.pontos >= 10 && c.pontos >= 0.25 * (v.pesou[0] ? v.pesou[0].pontos : 0));
    if (rotaPesou && top[0] !== 'rota') top.unshift('rota');
    const ameaca = v.itens.ameacas[0];
    const pior = ctx.quedas[0];
    const noColapso = pior ? pior.mortes.filter((m) => m.jogador === p).length : 0;
    const farmBom = (s.bench.gold_per_min || 0) >= 0.55;
    const frases = [];
    const porInimigo = ctx.eles.map((e) => ({ nome: e.heroi.nome, mortes: (ctx.mortes ? ctx.mortes[p.idx] : []).filter((d) => d.assassino === e.idx).length }));
    const maxM = Math.max(0, ...porInimigo.map((a) => a.mortes));
    const assassinos = porInimigo.filter((a) => a.mortes === maxM && maxM > 0).map((a) => a.nome);
    const quem = assassinos.length ? `${assassinos.join(' e ')} (${maxM} ${maxM === 1 ? 'morte' : 'mortes'}${assassinos.length > 1 ? ' cada' : ''})` : null;
    const evid = (k) => { const c = v.componentes.find((x) => x.key === k); return c ? c.evidencia : null; };
    const frase = (t) => (t ? t.charAt(0).toUpperCase() + t.slice(1) : '');
    const depois = `Depois ainda morreu ${plural(s.deaths, 'vez', 'vezes')}${quem ? `, mais para ${quem}` : ''}`;
    if (top[0] === 'rota') {
      const rot = evid('rotacoes');
      frases.push(`${frase(evid('rota'))}.${rot ? ` ${frase(rot)}.` : ''} ${depois}.`);
    } else if (top[0] === 'rotacoes') {
      frases.push(`${frase(evid('rotacoes'))}: perder a mid deixa o mid deles livre para decidir as outras rotas. ${depois}.`);
    } else if (top[0] === 'mortes' || top[0] === 'snowball' || top[0] === 'objetivos' || top[0] === 'pickoff') {
      const extra = top[0] === 'snowball' ? `; ${evid('snowball')}` : top[0] === 'objetivos' ? `; ${evid('objetivos')}` : top[0] === 'pickoff' ? `; ${evid('pickoff')}` : '';
      frases.push(`${farmBom ? `Farmou bem (${s.gpm} GPM), mas` : 'Você'} morreu ${s.deaths} vezes${quem ? `, mais para ${quem}` : ''}, e isso virou ${fmtK(s.goldFed || 0)} de ouro para o outro time${extra}.`);
    } else if (top[0] === 'ausencia' || top[0] === 'participacao') {
      frases.push(`${frase(evid(top[0]))}${s.tfp != null ? `: esteve em ${pct(s.tfp)} dos abates do time` : ''}.`);
    } else if (top[0] === 'throw') {
      frases.push(`Com o time na frente você morreu ${s.deathsAhead} ${s.deathsAhead === 1 ? 'vez' : 'vezes'}, e cada uma devolveu ouro que o time tinha construído${quem ? `; no jogo todo, quem mais te pegou foi ${quem}` : ''}.`);
    } else if (top[0] === 'farm') {
      frases.push(`Seu farm ficou no percentil ${pct(s.bench.gold_per_min || 0)} de quem joga de ${p.heroi.nome} (${s.gpm} GPM): os itens chegaram tarde para as lutas do mid game.`);
    } else if (top[0] === 'visao') {
      frases.push(`${s.obs} obs e ${s.sen} sentries numa partida de ${Math.round(s.duracao / 60)} min: o time lutou sem saber onde eles estavam.`);
    } else if (top[0]) {
      frases.push(`${frase(v.pesou[0].evidencia)}.`);
    }
    const alvo = ameaca ? ameaca.jogador.heroi.nome : 'o time deles';
    const disparou = (v.componentes.find((x) => x.key === 'snowball') || {}).evidencia;
    const TATICA = {
      rota: () => (p.posicao === 2 ? 'na mid, se a rota estiver perdida, empurre a wave antes de sair da torre e avise o time toda vez que o mid deles sumir' : 'combinem a rota antes do jogo: quem busca o primeiro golpe, quando recuar, e peçam rotação antes de a lane cair'),
      rotacoes: () => 'quando o mid deles sumir, avise na hora e empurre a wave para ir atrás ou pegar a torre dele',
      mortes: (core) => (core ? `farme do lado do mapa que vocês controlam quando ${alvo} sumir do minimapa` : `ande atrás dos cores e não fique sozinho onde ${alvo} pode te pegar`),
      snowball: () => `não dê luta sozinho para quem disparou${disparou ? ` (${disparou.split('para ').pop().replace(/, que dispar\w+ no jogo/, '')})` : ''}: jogue perto do time até ter o item de defesa`,
      pickoff: () => 'sem saber onde eles estão, não ande sozinho: farme com visão e perto de um aliado',
      objetivos: (core) => (core ? 'no mid e late, guarde ouro de buyback e não morra perto de torre em desvantagem' : 'no mid e late, quem morre primeiro abre a torre: entre na luta depois do iniciador'),
      ausencia: () => 'tenha TP sempre e chegue nas lutas junto com o time, não depois',
      participacao: () => 'tenha TP sempre e chegue nas lutas junto com o time, não depois',
      throw: () => 'com vantagem, agrupe e derrube torre em vez de caçar abate no lado deles',
      farm: () => 'mantenha uma wave ou camp no caminho entre uma luta e outra',
      visao: () => 'compre obs a cada recarga e coloque sentry antes de Roshan e das lutas em torre',
      dano: () => 'posicione-se para bater do começo ao fim da luta',
    };
    const core = p.funcao === 'core';
